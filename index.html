,"answer":"sleep 按时长暂停当前线程，不会释放已持有的监视器锁；wait 必须按对象监视器规则使用，会释放对应监视器并在恢复后重新获取；park 使用许可机制。等待条件应循环检查。","example":"用 synchronized 的条件等待要 while 判断。","pitfall":"wait 不是释放线程持有的所有锁。","follow":"为什么不能只用 if 检查等待条件？","priority":"基础必会","id":"base-019"},{"cat":"并发","q":"线程安全中的原子性、可见性、有序性是什么？","plain":"操作会不会被插开、别人能不能看到、顺序是否满足约定。","answer":"原子性是关键操作不可被并发观察为不完整；可见性关心更新何时对其他线程可见；有序性关心允许的执行和观察顺序。需要依据 Java 内存模型建立正确同步。","example":"配置初始化完成后再发布给请求线程。","pitfall":"不能仅靠本机跑几次正确来证明线程安全。","follow":"锁为什么不仅解决互斥？","priority":"基础必会","id":"base-020"},{"cat":"并发","q":"happens-before 应该怎么理解？","plain":"它给出跨线程可见性与顺序保证的推理规则。","answer":"如对同一监视器解锁先行发生于随后加锁，volatile 写与后续对应读之间有规则，还存在传递性。它不是简单按日志时间先后排序。","example":"正确发布配置后，读取线程应看到初始化结果。","pitfall":"两个操作实际时间先后不一定构成 happens-before。","follow":"Thread.start 和 join 各带来什么保证？","priority":"进阶再学","id":"base-021"},{"cat":"并发","q":"CAS 有什么代价，ABA 是什么？","plain":"比较值没变，不代表中间从未被改过。","answer":"CAS 失败可能反复重试，竞争激烈时有成本。ABA 指值从 A 变 B 又变 A，单看当前值无法区分历史；需要时用版本或戳等方式表达变化。","example":"节点状态可能需要携带执行轮次。","pitfall":"CAS 不自动保证多字段业务不变量。","follow":"AtomicInteger 适合代替所有锁吗？","priority":"基础必会","id":"base-022"},{"cat":"并发","q":"ThreadLocal 为什么可能引发问题？","plain":"线程复用时，请求数据可能活得比请求更久。","answer":"ThreadLocal 提供线程关联数据，线程池线程会复用。未清理的上下文可能串到后续任务或保留对象。通常在 finally 中 remove，并明确异步传播与恢复边界。","example":"traceId 留在线程里，下个请求日志可能串号。","pitfall":"换线程后不自动拥有正确上下文。","follow":"异步任务如何带上并清理业务上下文？","priority":"基础必会","id":"base-023"},{"cat":"并发","q":"死锁的条件和排查思路是什么？","plain":"任务互相等对方释放资源，所有人都走不下去。","answer":"经典条件包含互斥、占有并等待、不可抢占、循环等待。可通过统一锁顺序、缩小临界区、限时获取等降低风险。排查要看线程栈和等待关系。","example":"一个线程先锁配置再锁 Client，另一个顺序相反。","pitfall":"CPU 低也可能服务卡死，不能只看使用率。","follow":"线程池内互相等待会不会造成类似停滞？","priority":"基础必会","id":"base-024"},{"cat":"并发","q":"CompletableFuture 的 allOf 有什么边界？","plain":"它能组合完成状态，但不能替你完成全部治理。","answer":"allOf 在相关 Future 都结束后完成，其异常语义要结合具体 API 处理。它不自动把所有任务结果汇集成业务列表，也不能假定任一失败立即取消所有兄弟任务。","example":"并行检索完成后再合并候选。","pitfall":"默认执行器、异常传播与取消都要显式核对。","follow":"如何限制并发数并收集每个分支的错误？","priority":"进阶再学","id":"base-025"},{"cat":"JVM","q":"JVM 内存区域先记哪些？","plain":"堆放对象等共享数据，线程栈记录方法执行，各区域用途不同。","answer":"先掌握堆、Java 虚拟机栈、程序计数器、方法区相关概念及本地方法栈。HotSpot 使用元空间实现类元数据的相关存储，堆外内存也需纳入进程内存分析。","example":"堆不大，进程 RSS 仍可能很高。","pitfall":"不要把元空间说成 Java 堆里一块永久代。","follow":"直接缓冲区、线程数量会怎样影响内存？","priority":"基础必会","id":"base-026"},{"cat":"JVM","q":"OOM 与 StackOverflowError 有什么区别？","plain":"一种常见于资源内存分配失败，一种常见于调用栈深度耗尽。","answer":"OutOfMemoryError 可能涉及堆、元空间、本地线程等不同资源，需看具体信息；StackOverflowError 常见于递归太深等栈空间问题。处理方式不能只靠加堆。","example":"工作流误递归与队列堆积可能表现不同。","pitfall":"看到 OOM 就扩大 -Xmx 可能掩盖根因。","follow":"怎样区分对象堆积与线程数过多？","priority":"基础必会","id":"base-027"},{"cat":"JVM","q":"GC 怎么判断对象可以回收？","plain":"关注对象是否仍可从根引用到达。","answer":"常见追踪式 GC 依据从 GC Roots 的可达性分析对象，具体回收还受引用类型和收集器机制影响。两个对象互相引用但整体不可达，并不必然阻止回收。","example":"静态 Map 持有请求对象，会让它继续可达。","pitfall":"不能简单用引用计数解释现代 HotSpot 的全部回收行为。","follow":"一个全局缓存为什么可能造成内存泄漏？","priority":"基础必会","id":"base-028"},{"cat":"JVM","q":"内存泄漏和内存溢出是什么关系？","plain":"不再需要的对象仍被持有会积累，但溢出不只有这一种原因。","answer":"Java 中的泄漏常指对象在业务上无用却仍可达。溢出是分配等资源申请失败的结果，也可能由正常峰值、配置不足或堆外资源引起。","example":"已结束的流仍留在全局注册表。","pitfall":"GC 会回收垃圾，不会自动判断业务是否还需要一个可达对象。","follow":"怎么证明对象是谁持有的？","priority":"基础必会","id":"base-029"},{"cat":"JVM","q":"G1 和 Full GC 先学到什么程度？","plain":"先理解停顿、吞吐、堆占用和证据，再调参数。","answer":"G1 按 Region 管理堆并进行不同类型收集；Full GC 是需要结合收集器和日志判断的事件，不能与所有老年代回收画等号。先读 GC 日志、分配与存活量，再决定调整。","example":"大队列留住对象，改 GC 参数未必解决。","pitfall":"不要承诺某个参数组合适合所有服务。","follow":"延迟升高时如何判断与 GC 是否有关？","priority":"进阶再学","id":"base-030"},{"cat":"JVM","q":"CPU 高、服务卡顿时怎么排查？","plain":"先确认哪个进程、哪些线程、什么调用栈在消耗或等待。","answer":"结合系统进程指标、线程视图或线程转储、GC 日志、请求链路和近期变更，区分计算热点、忙循环、频繁 GC、锁等待与 IO 等待。一次快照不足时采多次对照。","example":"生产者循环重试，或线程都在等下游响应。","pitfall":"CPU 低不代表系统健康；不要直接重启后丢失所有证据。","follow":"怎样把线程栈与某次请求关联？","priority":"基础必会","id":"base-031"},{"cat":"Spring","q":"IoC 和 DI 是什么？","plain":"把对象的创建与依赖组装交给容器，减少自己到处 new 的耦合。","answer":"IoC 是控制反转思想，DI 是常见实现方式：对象声明依赖，由容器注入。构造器注入便于显式表达必需依赖，也方便普通单测替换实现。","example":"Gateway 构造时接收 Router 和 ModelClient。","pitfall":"依赖注入不意味着所有对象都必须注册 Bean。","follow":"如何在测试中换成假模型 Client？","priority":"基础必会","id":"base-032"},{"cat":"Spring","q":"Bean 生命周期怎么回答？","plain":"创建、组装、初始化、使用，最后按生命周期销毁。","answer":"先讲实例化与依赖注入，再讲初始化回调和相关后处理，最后是销毁。代理可能由后处理等机制产生，具体顺序取决于扩展点，不要背一串术语却说不出何时资源可用。","example":"Client 池初始化完成后才对请求开放。","pitfall":"构造方法里依赖尚未全部装配，不应假设资源都已就绪。","follow":"初始化失败时 readiness 应如何表现？","priority":"基础必会","id":"base-033"},{"cat":"Spring","q":"AOP 和代理解决什么？","plain":"把事务、日志等横切能力放到统一边界执行。","answer":"Spring AOP 常通过代理拦截方法调用，织入通知。JDK 动态代理常基于接口，类代理基于子类；选择取决于配置。某些 final、私有或内部调用场景受代理机制限制。","example":"调用事务代理后才进入事务拦截逻辑。","pitfall":"不能说类上有注解就代表所有调用都经过代理。","follow":"本类自调用为什么可能绕过增强？","priority":"基础必会","id":"base-034"},{"cat":"Spring","q":"REQUIRED 和 REQUIRES_NEW 有什么区别？","plain":"一个通常加入现有事务，一个要求独立的新事务。","answer":"REQUIRED 在存在事务时通常参与，否则创建；REQUIRES_NEW 使用独立事务并按支持方式挂起外层资源上下文。独立提交可能与外层结果不同，也可能需要额外连接。","example":"审计记录是否要独立提交，需要先明确业务语义。","pitfall":"不要把 REQUIRES_NEW 当解决所有回滚问题的开关。","follow":"高并发嵌套事务为何可能耗尽连接池？","priority":"进阶再学","id":"base-035"},{"cat":"Spring","q":"为什么不要把慢 HTTP 调用随意放进事务？","plain":"等待外部服务可能拉长数据库资源占用时间。","answer":"事务中可能持有连接和锁，慢调用增加占用与失败窗口。可按业务拆分事务阶段、用可靠事件驱动等设计，但要处理跨阶段一致性，不能简单移出就当问题解决。","example":"事务内写账单后等模型返回几十秒。","pitfall":"本地数据库回滚不能自动撤销已经发出的外部通知。","follow":"若外部调用成功但本地提交失败怎么办？","priority":"基础必会","id":"base-036"},{"cat":"Spring","q":"Spring MVC 请求的大致链路是什么？","plain":"入口找到处理方法，绑定参数，执行业务，再写回响应。","answer":"DispatcherServlet 组织请求分发，结合映射和适配找到处理器，进行参数解析、返回值处理及异常处理。过滤器、拦截器、控制器职责不同。流式响应还有异步生命周期。","example":"Controller 把请求转换后交给 Pipeline。","pitfall":"返回 SseEmitter 不代表后台流处理已完成。","follow":"异常在响应提交前后处理有什么不同？","priority":"基础必会","id":"base-037"},{"cat":"Spring","q":"Filter、Interceptor、AOP 怎么区分？","plain":"它们在不同层面拦截不同对象。","answer":"Filter 位于 Servlet 请求响应链，Interceptor 更贴近 MVC 处理器，AOP 面向代理对象方法。选择取决于需要处理 HTTP、处理器上下文还是业务方法。","example":"通用 HTTP 头处理、请求拦截、业务事务分别放在合适层。","pitfall":"不能只按执行先后顺序把三者看成完全可替换。","follow":"非 HTTP 调用会不会经过 MVC 拦截器？","priority":"基础必会","id":"base-038"},{"cat":"Spring","q":"循环依赖是什么，为什么先考虑拆设计？","plain":"对象构造依赖互相绕回自身，容器可能无法完成组装。","answer":"A 依赖 B、B 又依赖 A 会形成循环。能否处理取决于构造或属性注入、作用域、代理与配置。优先通过职责拆分、事件或第三个服务消除不合理依赖。","example":"路由服务反向依赖业务服务导致初始化纠缠。","pitfall":"不能笼统说 Spring 能解决所有循环依赖。","follow":"构造器循环为什么更难直接创建？","priority":"进阶再学","id":"base-039"},{"cat":"MySQL","q":"B+ 树索引为什么适合常见数据库查询？","plain":"树较矮，范围数据有序，减少定位与连续访问的成本。","answer":"B+ 树的内部节点主要用于导航，叶子包含索引记录并按序组织。高分支因子有利于降低树高，叶子有序便于范围扫描。实际性能还取决于缓存、页访问与查询模式。","example":"按业务和时间范围查询执行记录。","pitfall":"不能只说时间复杂度低，忽略磁盘页和范围访问。","follow":"哈希索引为什么不擅长一般范围排序？","priority":"基础必会","id":"base-040"},{"cat":"MySQL","q":"聚簇索引、二级索引与回表是什么？","plain":"先可能找到主键，再通过主键找到整行。","answer":"InnoDB 聚簇索引叶子承载行数据，常以主键组织；二级索引记录包含对应主键信息。需要的列不在二级索引中时，可能继续访问聚簇索引，这常称回表。","example":"按 status 查记录，又要读取大字段。","pitfall":"不指定主键不代表 InnoDB 没有聚簇组织规则。","follow":"为什么主键过大会影响二级索引空间？","priority":"基础必会","id":"base-041"},{"cat":"MySQL","q":"覆盖索引与索引下推是什么？","plain":"前者减少取整行的需要，后者减少不必要的存储引擎返回。","answer":"覆盖索引指查询所需列可由选用索引提供。索引条件下推是在适用场景把部分条件交给存储引擎利用索引记录先判断，减少完整行访问。二者不是同一机制。","example":"联合索引中已包含查询列和部分筛选字段。","pitfall":"不要把所有 Using index 的现象都叫索引下推。","follow":"EXPLAIN 中会关注哪些 Extra 信息？","priority":"进阶再学","id":"base-042"},{"cat":"MySQL","q":"索引失效应该怎样准确表达？","plain":"多数时候是无法高效利用某部分索引，或优化器没有选择它。","answer":"函数、隐式转换、前导通配符、不合适的联合索引条件等可能削弱索引利用，但需结合类型、字符集、查询结构和优化器判断。用执行计划与真实数据验证。","example":"字符串列与不匹配类型比较，可能触发转换。","pitfall":"不能背成所有函数、所有 OR 或范围条件后全部字段必然失效。","follow":"为什么小表全表扫描可能是合理选择？","priority":"基础必会","id":"base-043"},{"cat":"MySQL","q":"EXPLAIN 先看哪几个信息？","plain":"看访问方式、用了什么索引、预计读多少以及额外处理。","answer":"先看表访问顺序、type、possible_keys、key、rows、filtered 和 Extra。rows 等常是估计值。再结合慢查询与实际执行信息，不要只看一个字段评判。","example":"同一条最近记录查询，比较索引前后的计划。","pitfall":"使用了索引不代表代价低，估计少也不保证真实少。","follow":"Using filesort 就一定磁盘排序吗？","priority":"基础必会","id":"base-044"},{"cat":"MySQL","q":"ACID 四个字母是什么？","plain":"事务强调原子性、一致性、隔离性、持久性。","answer":"原子性是事务作为整体成功或回滚；一致性要结合约束和正确业务逻辑；隔离性规定并发观察与冲突规则；持久性是提交后的保存保证，实际还受配置与故障模型影响。","example":"余额扣减与账单写入同一个本地事务。","pitfall":"数据库事务不自动覆盖外部 HTTP 副作用。","follow":"为何有事务仍可能出现业务逻辑错误？","priority":"基础必会","id":"base-045"},{"cat":"MySQL","q":"RC 与 RR 的一致性读有什么区别？","plain":"RC 通常每次读取看较新的已提交快照，RR 通常在事务里沿用快照。","answer":"InnoDB 中 READ COMMITTED 的一致性读通常每次创建新快照；REPEATABLE READ 通常由首次一致性读确定事务快照。锁定读、更新及事务自身写入需另行分析。","example":"同一事务两次普通 SELECT，中间其他事务提交。","pitfall":"不能把 RR 理解成所有类型读取都永远只看到同一份数据。","follow":"SELECT FOR UPDATE 与普通 SELECT 有什么差别？","priority":"基础必会","id":"base-046"},{"cat":"MySQL","q":"行锁、间隙锁、临键锁是什么？","plain":"不仅能锁住已有记录，也可能约束记录之间的插入范围。","answer":"InnoDB 按索引记录等实施锁定。记录锁针对索引记录，间隙锁约束间隙，next-key 锁结合记录及其前间隙。具体行为与隔离级别、索引、条件有关。","example":"范围锁定读与另一个事务插入同范围记录。","pitfall":"不能凭 SQL 看起来只改一行就断言锁范围只有一行。","follow":"无合适索引的更新为什么可能影响更多并发？","priority":"进阶再学","id":"base-047"},{"cat":"MySQL","q":"数据库死锁和长事务怎么处理？","plain":"先看谁占着什么、谁在等什么，再修访问顺序与范围。","answer":"死锁可由事务以不同顺序锁资源产生。按证据统一访问顺序、缩小事务范围、补合适索引，遇到死锁失败可在安全前提下有限重试。长事务还会增加锁和版本保留等压力。","example":"两个操作分别先更新账号 A/B，再更新 B/A。","pitfall":"无限重试可能放大负载，并掩盖设计问题。","follow":"怎样确认重试不会重复产生业务副作用？","priority":"基础必会","id":"base-048"},{"cat":"MySQL","q":"undo log、redo log、binlog 的作用是什么？","plain":"分别侧重版本回退、崩溃恢复、变更记录与复制等用途。","answer":"undo 支持回滚与多版本读取等；redo 记录 InnoDB 恢复所需变化；binlog 是服务器层的变更日志，用于复制和恢复等。它们职责不同，写入顺序与持久化配置也重要。","example":"数据库崩溃恢复与主从复制不是同一流程。","pitfall":"不能说 binlog 就是 InnoDB redo 的另一名字。","follow":"主从延迟时为什么可能读不到刚写的数据？","priority":"进阶再学","id":"base-049"},{"cat":"Redis","q":"Redis 常用五类数据结构怎么记？","plain":"字符串、哈希、列表、集合、有序集合各有用途。","answer":"String 可存值或计数，Hash 适合字段映射，List 提供序列操作，Set 去重，Sorted Set 按分数排序。还存在 Streams 等其他类型，选型要看访问模式和规模。","example":"配置缓存用字符串或 Hash，简单排行榜可考虑 ZSet。","pitfall":"不要把 Redis 当只有字符串的 Map，也别用巨大单 key 承载一切。","follow":"查某字段、整体过期和并发修改如何影响结构选择？","priority":"基础必会","id":"base-050"},{"cat":"Redis","q":"Redis 单线程为什么还能处理很多请求？","plain":"常见命令执行路径有串行特点，但整个服务并非所有工作都单线程。","answer":"内存访问、事件驱动和适当 IO 复用使许多短命令开销较低；网络与后台任务还可能使用其他线程。性能受命令复杂度、大值、阻塞和网络等影响。","example":"一次 O(N) 大遍历可能拖慢其他请求。","pitfall":"不要说 Redis 全部功能只有一个线程或不会阻塞。","follow":"为什么生产环境扫描要避免不受控的大操作？","priority":"基础必会","id":"base-051"},{"cat":"Redis","q":"过期删除与内存淘汰有什么区别？","plain":"一个处理时间到期，一个处理内存压力。","answer":"过期机制处理带 TTL 且到期的 key，常结合访问时检查和主动清理。淘汰策略在内存约束下决定删除哪些数据或拒绝写入，策略与部署配置有关。","example":"一个还没过期的缓存也可能因内存策略被淘汰。","pitfall":"设置 TTL 不等于 key 会在那个毫秒立刻物理删除。","follow":"TTL、LRU、LFU 各关注什么？","priority":"基础必会","id":"base-052"},{"cat":"Redis","q":"RDB 与 AOF 怎样比较？","plain":"一个像时间点快照，一个记录可重放的写操作。","answer":"RDB 适合紧凑快照和备份；AOF 记录写操作，并可重写压缩。数据丢失窗口、恢复成本与运行影响取决于具体持久化策略和配置，也能组合使用。","example":"缓存可以重建与账单数据不可随意丢失，要求不同。","pitfall":"开启 AOF 不代表任何故障下零丢失。","follow":"fsync 策略为什么影响性能和丢失窗口？","priority":"基础必会","id":"base-053"},{"cat":"Redis","q":"主从、Sentinel、Cluster 分别做什么？","plain":"复制、故障管理与分片是不同层面的能力。","answer":"复制让副本接收主节点数据；Sentinel 监控并组织故障切换等；Cluster 使用槽分配实现分片并有自身故障转移机制。它们都不能自动消除复制延迟和所有故障风险。","example":"读副本可能看到旧配置。","pitfall":"不能把加副本当成写入必定不丢的保证。","follow":"主节点写入后立刻故障可能出现什么窗口？","priority":"进阶再学","id":"base-054"},{"cat":"Redis","q":"Redis 分布式锁的最小要求是什么？","plain":"要原子获取、识别持有者，并考虑租约失效。","answer":"常见基础是 SET key token NX PX lease 获取，释放时原子比较 token 再删除。还要处理业务超出租约、暂停、续租失败和故障切换。关键副作用可能需要 fencing 或数据库约束配合。","example":"旧持有者暂停后恢复，锁可能已属于别人。","pitfall":"不能用无条件 DEL 释放，也不能把有锁等同于业务绝对安全。","follow":"任务耗时超过租约后如何防止旧持有者继续写？","priority":"进阶再学","id":"base-055"},{"cat":"Redis","q":"布隆过滤器解决什么，边界是什么？","plain":"用较少空间快速判断某元素是否可能存在。","answer":"布隆过滤器可出现误判存在；在按定义维护且无删除等干扰前提下，不会把已加入元素判为不存在。容量、误判率和更新流程要设计。常用作穿透请求前的筛选。","example":"明显不存在的文档 ID 可提前挡掉。","pitfall":"判断可能存在仍需查真实数据；基础布隆过滤器不直接支持随意删除。","follow":"新数据入库和过滤器更新不同步会怎样？","priority":"进阶再学","id":"base-056"},{"cat":"网络与 Linux","q":"从输入 URL 到返回页面会经过什么？","plain":"先定位服务，再建立传输与安全连接，发送请求，服务处理后返回。","answer":"典型 HTTPS 流程涉及 URL 解析、缓存与 DNS、连接建立、TLS、HTTP 请求响应和客户端处理。连接复用与协议版本会改变具体过程。先说清分层，再分析延迟。","example":"模型调用慢可能在 DNS、建连、TLS 或等待响应阶段。","pitfall":"不要认为每个请求都重新 DNS 和三次握手。","follow":"连接池复用解决了哪段成本？","priority":"基础必会","id":"base-057"},{"cat":"网络与 Linux","q":"TCP 三次握手为什么需要确认？","plain":"双方要确认彼此可收发并同步连接状态。","answer":"客户端发 SYN，服务端回 SYN+ACK，客户端再 ACK，交换初始序列号并确认双向连通与状态。握手并不保证后续网络永远可靠。","example":"连接建立成功后，上游仍可能立刻断开。","pitfall":"不能把握手成功当业务调用成功。","follow":"建连超时与响应读取超时怎么区分？","priority":"基础必会","id":"base-058"},{"cat":"网络与 Linux","q":"TIME_WAIT 为什么存在？","plain":"主动关闭方通常还要等待，处理旧报文和最后确认的可靠性。","answer":"TIME_WAIT 有助于处理连接关闭过程与旧报文隔离。大量短连接可能增加这类状态，应先分析连接复用、关闭行为和资源压力，再考虑系统参数。具体实现受系统影响。","example":"每段模型输出都重建连接是不合理的设计信号。","pitfall":"不要看到 TIME_WAIT 多就直接修改内核参数。","follow":"CLOSE_WAIT 较多可能提示哪类问题？","priority":"进阶再学","id":"base-059"},{"cat":"网络与 Linux","q":"HTTPS 提供什么保证？","plain":"传输加密、完整性与按信任链验证对端身份。","answer":"HTTPS 在 HTTP 与传输层之间使用 TLS 等机制保护通信。要正确验证证书、主机名与信任链。传输安全不替代业务鉴权，也不隐藏终端应用自己记录的明文。","example":"API Key 经 HTTPS 发送，日志仍需控制记录。","pitfall":"不能为解决证书错误直接关闭所有验证。","follow":"服务端身份可信是否等于调用方有权限？","priority":"基础必会","id":"base-060"},{"cat":"网络与 Linux","q":"GET、POST 和 HTTP 幂等怎么理解？","plain":"协议方法有语义约定，但业务实现必须遵守才成立。","answer":"GET 用于获取表示，按语义应安全；PUT、DELETE 等有幂等语义，POST 通常不承诺幂等。幂等是多次相同请求的预期效果，不意味着每次返回值或日志完全相同。","example":"POST 创建任务可额外支持业务幂等键。","pitfall":"不能只凭用了 GET 就认定服务实际无副作用。","follow":"为什么代理可能更愿意重试幂等请求？","priority":"基础必会","id":"base-061"},{"cat":"网络与 Linux","q":"401、403、429、500、502、504 怎么区分？","plain":"分别看身份、权限、流量、服务内部和上游边界。","answer":"401 常表示缺少有效认证，403 表示拒绝访问；429 表示请求过多；500 是服务器内部错误；502 是网关收到无效上游响应；504 是网关等上游超时。实际错误映射要与协议和接口约定一致。","example":"模型限额拒绝与网关自身异常不应混成一种错误。","pitfall":"不能所有失败都返回 200 且让调用方猜文本。","follow":"SSE 已提交后还能随意改变 HTTP 状态吗？","priority":"基础必会","id":"base-062"},{"cat":"网络与 Linux","q":"服务 CPU 高、内存高、端口不通先看什么？","plain":"先定位现象属于资源、进程、监听还是网络链路。","answer":"先确认进程存活、监听地址与端口、资源和日志，再逐段检查本机访问、容器映射、服务发现与下游。结合时间窗口定位变更，必要时抓线程或网络证据。","example":"服务只监听回环地址，其他机器不能直接访问。","pitfall":"一次重启恢复不等于查清根因。","follow":"端口能连通但请求一直挂起，下一步查哪里？","priority":"基础必会","id":"base-063"},{"cat":"网络与 Linux","q":"readiness 与 liveness 检查有什么区别？","plain":"一个决定能否接流量，一个决定是否需要重启恢复。","answer":"readiness 反映是否准备好服务请求；liveness 用于识别应重启的失活状态。慢启动可另设启动检查。依赖短暂异常若被粗暴当存活失败，可能造成重启风暴。","example":"模型 Client 尚未初始化完，应暂不接流量。","pitfall":"不能把所有下游故障都配置为立刻杀进程。","follow":"为什么健康检查本身不能做很重的工作？","priority":"基础必会","id":"base-064"},{"cat":"分布式与消息","q":"CAP 应该怎么准确回答？","plain":"出现网络分区时，不能同时保证特定定义的强一致和可用。","answer":"CAP 中的一致性通常指线性一致性，可用性也有严格定义。讨论需要说明故障模型和具体操作，不是简单把系统永久贴成三选二标签。正常时期仍有延迟与一致性的取舍。","example":"配置源不可达时继续用旧配置，是一种明确的业务选择。","pitfall":"不要把 CAP 的 C 与 ACID 的 C 当同一个定义。","follow":"你的路由配置在故障时更希望保旧还是拒绝？","priority":"进阶再学","id":"base-065"},{"cat":"分布式与消息","q":"接口幂等键怎样设计？","plain":"把同一次业务意图识别出来，并绑定处理结果。","answer":"幂等键应在约定范围内唯一，结合请求摘要、状态、结果与有效期设计。通过唯一约束或原子状态处理并发重复；同 key 不同参数应有明确规则。还需处理进行中和超时状态。","example":"调用方重试同一笔创建任务，沿用同一个 requestId。","pitfall":"只先查后插在并发下可能重复；内存去重不覆盖进程崩溃。","follow":"如果处理成功但结果存储失败，如何恢复？","priority":"基础必会","id":"base-066"},{"cat":"分布式与消息","q":"重试为什么要退避、抖动和总预算？","plain":"大家同时立刻再试，会让故障服务更忙。","answer":"先按错误可重试性分类，再设置最大次数、总体 deadline、指数或其他退避与随机抖动。副作用操作需配合幂等。多层各自重试可能导致请求数成倍放大。","example":"入口和模型 SDK 都重试三次，实际调用可能超预期。","pitfall":"不能把权限错误等永久失败无限重试。","follow":"遇到 429 是否有建议等待信息可利用？","priority":"基础必会","id":"base-067"},{"cat":"分布式与消息","q":"负载均衡和一致性哈希怎么选？","plain":"均匀分配与保持同类请求亲和，目标不同。","answer":"轮询、加权随机、最少连接等适用不同负载。哈希亲和可将相同标识映射到相近目标，一致性哈希能减少成员变化时的迁移，但仍需处理热点、权重、健康与扩缩容。","example":"多轮会话希望保持实例亲和。","pitfall":"哈希路由不自动保证负载平均，也不能访问已故障节点。","follow":"热门用户形成热点时怎么办？","priority":"基础必会","id":"base-068"},{"cat":"分布式与消息","q":"Kafka 的 Topic、Partition、Group 怎么理解？","plain":"主题装逻辑消息，分区用于存储与并行，消费组分配工作。","answer":"一个 Topic 有多个分区；同一消费组内，在常见消费模式下每个分区同时分配给一个消费者；不同组可独立消费。增加组内消费者超过可分配分区数未必继续增加并行度。","example":"追踪日志与计费消费可以使用不同消费组。","pitfall":"不能把 Topic 当成只有一条全局有序队列。","follow":"为什么要按业务 key 选择分区？","priority":"基础必会","id":"base-069"},{"cat":"分布式与消息","q":"消息顺序怎么保证，边界是什么？","plain":"先明确需要什么范围内的顺序，再保持相同实体走同一条顺序链路。","answer":"可按订单或任务 key 分区，并约束生产与消费处理顺序。异步并发处理、重试和失败补偿都可能打乱业务完成顺序。通常不应无代价追求全局顺序。","example":"同一工作流节点状态更新不宜被后到的旧事件覆盖。","pitfall":"分区按序读出不代表异步业务按序完成。","follow":"可以用版本号拒绝旧状态覆盖吗？","priority":"基础必会","id":"base-070"},{"cat":"分布式与消息","q":"Outbox 模式解决哪段一致性？","plain":"把业务数据和待发送事件先写进同一个本地事务。","answer":"Outbox 将业务变更与事件记录原子落库，再由独立发送流程可靠转发。发送和确认仍可能重复，消费者仍需幂等，并监控积压、重试与清理。","example":"账单提交后发送拆账任务，避免提交成功但事件丢失。","pitfall":"不能把 Outbox 说成自动实现所有系统全局恰好一次。","follow":"转发成功但未记录发送状态会怎样？","priority":"进阶再学","id":"base-071"},{"cat":"分布式与消息","q":"日志、指标、链路追踪各看什么？","plain":"日志看细节，指标看趋势，追踪看一次请求的跨组件路径。","answer":"用请求或链路标识关联事件，指标聚合错误、延迟和资源水位，追踪描述调用关系和阶段耗时。标签需控制基数，不能随意把每个用户或请求 ID 都放进指标维度。","example":"首段慢要拆入口等待、路由、上游建连和首段读取。","pitfall":"高基数标签可能让监控系统代价失控。","follow":"p99、错误率、运行中任务数分别揭示什么？","priority":"基础必会","id":"base-072"},{"cat":"AI 与工作流","q":"Token、上下文窗口、最大输出是什么？","plain":"模型处理的是分词后的单位，输入与输出都有预算。","answer":"Token 不是固定一个汉字或一个英文单词。上下文窗口约束模型能处理的上下文规模，输入、工具定义、历史和输出等如何计入依模型约定。最大输出是额外限制，需核对具体模型。","example":"历史对话越长，可能增加费用与首段等待。","pitfall":"不能把所有模型的字符长度当统一 token 数。","follow":"输入过长应怎样截断或摘要？","priority":"基础必会","id":"base-073"},{"cat":"AI 与工作流","q":"temperature、top_p 和 Prompt 需要背到什么程度？","plain":"先理解它们影响生成与约束，别背成保证正确的开关。","answer":"temperature 调节采样分布，top_p 约束候选概率质量范围，具体支持与组合依模型而定。Prompt 组织目标、上下文和格式，但不能替代程序校验或权限规则。","example":"要求 JSON 后仍校验字段与类型。","pitfall":"temperature=0 不保证跨版本、跨环境绝对一致。","follow":"如何评估提示词修改是否真的更好？","priority":"基础必会","id":"base-074"},{"cat":"AI 与工作流","q":"工具参数校验与权限为什么不能交给模型？","plain":"模型建议动作，后端必须执行可信的规则。","answer":"后端校验工具白名单、参数类型范围、调用者权限、资源归属、速率与副作用边界。模型输出和检索文本都应按输入处理，不能提升成系统授权。","example":"工具查询订单时仍验证当前用户有权查看。","pitfall":"模型说“已经授权”不能作为授权证据。","follow":"工具调用的审计和幂等键怎么记录？","priority":"基础必会","id":"base-075"},{"cat":"AI 与工作流","q":"Agent 循环为什么需要停止条件？","plain":"模型可能反复尝试，系统必须给它明确边界。","answer":"限制最大轮数、总时间、成本与工具调用数，识别终止回答和重复无进展，处理工具失败与取消。还要保存必要状态用于诊断。复杂度应按实际任务需求增加。","example":"工具连续三次相同失败，转为明确错误或人工处理。","pitfall":"不能让无限循环消耗模型配额。","follow":"工具成功但模型最终回答失败，状态怎么表示？","priority":"基础必会","id":"base-076"},{"cat":"AI 与工作流","q":"RAG 文档怎么切分，为什么有重叠？","plain":"切分要在语义完整与检索粒度之间平衡。","answer":"块太大会引入噪声并消耗上下文，太小可能丢失条件与关联。按标题、段落和结构切分，适当重叠可保留边界上下文，但也增加重复与索引量。通过问题集验证。","example":"报销金额和适用条件不能被完全分离。","pitfall":"没有对所有语料最优的固定 chunk 大小。","follow":"表格、代码和多级标题怎么处理？","priority":"基础必会","id":"base-077"},{"cat":"AI 与工作流","q":"RAG 怎样评估，不只看回答像不像？","plain":"分别测找没找到证据、证据是否有效、回答是否忠实。","answer":"准备有标准证据的问题集，评估召回覆盖、排序、无答案处理和权限过滤，再看回答正确性、依据一致性、延迟与成本。数据要覆盖同义、边界、过期与无答案情况。","example":"10 道固定题比较两种检索策略，保留失败样例。","pitfall":"一次好回答不足以证明检索改动有效。","follow":"问题集与参数调优数据重合会带来什么偏差？","priority":"基础必会","id":"base-078"},{"cat":"AI 与工作流","q":"模型网关协议兼容为什么不只是改字段名？","plain":"请求、分块事件、工具、结束原因和用量的语义也可能不同。","answer":"统一内部表示有利于厂商隔离，但要处理消息角色、内容块、工具调用、流事件顺序、错误、结束原因和 usage。不能默默丢弃不支持能力，应明确兼容边界。","example":"工具参数可能跨多个流片段传回，要正确拼接。","pitfall":"同名字段不保证含义完全一致。","follow":"某厂商没有 usage 时，如何记录与计量？","priority":"基础必会","id":"base-079"},{"cat":"AI 与工作流","q":"首段延迟、总耗时和吞吐怎么区分？","plain":"开始得快、结束得快、单位时间处理得多，是不同指标。","answer":"首段延迟取决于约定的首个有效输出；总耗时覆盖整次执行；吞吐描述单位时间完成量，模型侧还可能关注输出 token 速率。统计时需统一起止点并区分排队、网络、生成和发送。","example":"网关首段事件可能只是元信息，未必是首个文本。","pitfall":"首段快不代表整次请求短，平均快不代表长尾可接受。","follow":"客户端慢读会怎样影响网关观测总耗时？","priority":"基础必会","id":"base-080"}],"guideHtml":"\u003ch2>AI 平台后端求职学习手册：从不熟悉代码到能独立解释和修改\u003c/h2>\n\u003cp>适用对象：3 年 Java 工作经验，陌陌项目外包驻场，主要接触大模型网关和 AI 工作流引擎，目前对代码不够熟悉，希望下班后循序学习。\u003c/p>\n\u003cp>编写日期：2026 年 10 月 20 日。代码入口按当前工作区核对；后续代码变动时，以实际实现为准。\u003c/p>\n\u003cp>这份手册的目标是建立实际能力：读懂主链路、写出简化实现、验证失败场景、解释自己的贡献。6 周是第一轮安排，不是拿到 Offer 的保证，也不代表学完就具备所有平台岗位的要求。\u003c/p>\n\u003ch2>1. 怎么使用这份手册\u003c/h2>\n\u003ch3>1.1 时间安排\u003c/h3>\n\u003cul>\u003cli>周一到周五：每晚 90—120 分钟。开始前留出吃饭和休息时间，按自己的通勤调整。\u003c/li>\u003cli>周六：2—3 小时，完成一项可运行练习。\u003c/li>\u003cli>周日：30—60 分钟，只复盘和补最关键的一处遗漏。\u003c/li>\u003cli>第 1 天可以从任何一天开始；“周”只是七个学习日，不必对应自然周。\u003c/li>\u003cli>没完成当天验收就留在当天。允许 6 周顺延成 8—10 周，不用赶进度。\u003c/li>\u003cli>加班当天只做 20 分钟最低任务，第二天继续，不要补双倍课程。\u003c/li>\u003c/ul>\n\u003cp>每晚标准流程：\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>环节\u003c/th>\u003cth>用时\u003c/th>\u003cth>具体做法\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>回忆\u003c/td>\u003ctd>10 分钟\u003c/td>\u003ctd>不看资料，复述昨天的调用链或知识点\u003c/td>\u003c/tr>\u003ctr>\u003ctd>读代码\u003c/td>\u003ctd>30 分钟\u003c/td>\u003ctd>只追一条分支，遇到外部依赖先记录输入输出\u003c/td>\u003c/tr>\u003ctr>\u003ctd>动手\u003c/td>\u003ctd>30—45 分钟\u003c/td>\u003ctd>写最小例子、打断点、补一个故障场景\u003c/td>\u003c/tr>\u003ctr>\u003ctd>补基础\u003c/td>\u003ctd>15—20 分钟\u003c/td>\u003ctd>只补当天出现的概念，算法按后面的安排穿插\u003c/td>\u003c/tr>\u003ctr>\u003ctd>收尾\u003c/td>\u003ctd>5—10 分钟\u003c/td>\u003ctd>写今天的结论、证据、下次第一步\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>最低任务：打开当天的一个方法，写清输入、输出、一个调用方、一个异常路径，再记一个问题。做完即可结束。\u003c/p>\n\u003ch3>1.2 每天只要求四项产出\u003c/h3>\n\u003col>\u003cli>一张小流程图或一页笔记。\u003c/li>\u003cli>一个预测后再验证的结果，例如“这里抛异常，外层应该返回什么”。\u003c/li>\u003cli>一个自己写的例子、断点记录或场景验证。\u003c/li>\u003cli>一段 1—3 分钟的口头解释，可以录音，不必发给别人。\u003c/li>\u003c/ol>\n\u003cp>“看完了”“AI 解释得很清楚”不能单独算完成。能够合上代码解释，再回代码找到证据，才算基本掌握。\u003c/p>\n\u003ch3>1.3 阅读源码的固定顺序\u003c/h3>\n\u003cp>每次只研究一个方法，按下面七步来：\u003c/p>\n\u003col>\u003cli>谁调用它？先找一个最直接的调用方。\u003c/li>\u003cli>输入是什么？区分请求参数、共享配置、当前请求的临时状态。\u003c/li>\u003cli>返回什么？正常值、空值、错误对象还是异常？\u003c/li>\u003cli>主干做哪 3—5 件事？先忽略日志和工具方法细节。\u003c/li>\u003cli>修改了谁的数据？这个对象会不会被其他请求共享？\u003c/li>\u003cli>哪些地方会等待、发网络请求、创建线程或借用资源？\u003c/li>\u003cli>出错后在哪里收尾？是否关闭连接、释放许可、结束流、记录状态？\u003c/li>\u003c/ol>\n\u003cp>第一次读大方法只画主干，第二次补失败路径，第三次才研究关键实现。不要从 import 开始逐行背。\u003c/p>\n\u003ch3>1.4 环境卡住怎么办\u003c/h3>\n\u003cp>第 1 天检查 JDK、IDE、Maven 是否可用。项目使用 Java 21 相关能力，学习练习优先与项目 JDK 保持一致；不需要为了学习盲目升级到更新版本。\u003c/p>\n\u003cp>公司项目涉及内部依赖、配置中心、数据库和 RPC，完整启动失败不等于不能学习：\u003c/p>\n\u003cul>\u003cli>环境排查最多先花 30 分钟，记下具体报错。\u003c/li>\u003cli>能运行项目单测就挑隔离性较好的单测；先读清是否调用外部服务。\u003c/li>\u003cli>不能运行就切换到本地练习：普通 Java main 方法、内存 Map、假模型、固定数据。\u003c/li>\u003cli>Spring、JSON、HTTP 服务只在需要时引入；不要第一天就搭完整平台。\u003c/li>\u003cli>所有学习数据使用虚构 business、model 和凭证，练习用 localhost 或内存对象。\u003c/li>\u003cli>本手册不要求修改公司项目或调用生产服务。\u003c/li>\u003c/ul>\n\u003ch3>1.5 六周的产出地图\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>周次\u003c/th>\u003cth>主线\u003c/th>\u003cth>周末拿得出的东西\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>第 1 周\u003c/td>\u003ctd>Java 语法、Spring 调用链、非流式网关\u003c/td>\u003ctd>一张网关流程图、可运行的最小网关 v1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>第 2 周\u003c/td>\u003ctd>SSE、线程、取消、流控、指标\u003c/td>\u003ctd>可制造慢响应和异常的流式练习、资源释放记录\u003c/td>\u003c/tr>\u003ctr>\u003ctd>第 3 周\u003c/td>\u003ctd>图、节点、变量、并行汇合\u003c/td>\u003ctd>最小 DAG 执行器 v1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>第 4 周\u003c/td>\u003ctd>工作流超时、失败、工具调用、检索\u003c/td>\u003ctd>DAG v2、工具循环练习、检索小评测\u003c/td>\u003c/tr>\u003ctr>\u003ctd>第 5 周\u003c/td>\u003ctd>数据库、缓存、消息、事务、部署\u003c/td>\u003ctd>小项目工程说明、排障记录、基础知识笔记\u003c/td>\u003c/tr>\u003ctr>\u003ctd>第 6 周\u003c/td>\u003ctd>项目表达、算法、模拟面试\u003c/td>\u003ctd>真实简历素材、项目讲稿、能力差距清单\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>2. 源码导航：先收藏，不要一次读完\u003c/h2>\n\u003cp>G 表示网关，W 表示工作流。下面只列阅读入口，不表示每个功能都已经完整实现。抽象类、注释、文档写了某项能力，仍需要找到具体实现和调用点验证。\u003c/p>\n\u003cul>\u003cli>\u003cstrong>G1\u003c/strong>：\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/controller/AgentController.java\">请求入口 AgentController \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003c/li>\u003cli>\u003cstrong>G2\u003c/strong>：\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/Pipeline.java\">主编排 Pipeline \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003c/li>\u003cli>\u003cstrong>G3\u003c/strong>：\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/ModelRouter.java\">模型路由 ModelRouter \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003c/li>\u003cli>\u003cstrong>G4\u003c/strong>：\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/auth/AbstractAuth.java\">鉴权 AbstractAuth \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003c/li>\u003cli>\u003cstrong>G5\u003c/strong>：\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/limit/AbstractLimit.java\">限流 AbstractLimit \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003c/li>\u003cli>\u003cstrong>G6\u003c/strong>：\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/process/ChatProcessor.java\">非流式 ChatProcessor \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003c/li>\u003cli>\u003cstrong>G7\u003c/strong>：\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/process/ChatStreamProcessor.java\">流式 ChatStreamProcessor \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003c/li>\u003cli>\u003cstrong>G8\u003c/strong>：\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/client/ProviderMoaiClient.java\">客户端管理 ProviderMoaiClient \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003c/li>\u003cli>\u003cstrong>G9\u003c/strong>：\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/protocol/stream/GatewayStreamSink.java\">流桥接 GatewayStreamSink \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003c/li>\u003cli>\u003cstrong>G10\u003c/strong>：\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/protocol/stream/StreamWatchdog.java\">流超时 StreamWatchdog \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003c/li>\u003cli>\u003cstrong>G11\u003c/strong>：\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/config/ConfigCenter.java\">配置 ConfigCenter \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003c/li>\u003cli>\u003cstrong>G12\u003c/strong>：\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/client/bean/ClientHealthCounter.java\">健康计数 ClientHealthCounter \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003c/li>\u003cli>\u003cstrong>G13\u003c/strong>：\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/protocol/ProtocolCommon.java\">协议转换 ProtocolCommon \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003c/li>\u003cli>\u003cstrong>G14\u003c/strong>：\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/process/mock/MockChatProcessor.java\">本地模拟 MockChatProcessor \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003c/li>\u003cli>\u003cstrong>W1\u003c/strong>：\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/WorkflowRunner.java\">执行器 WorkflowRunner \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003c/li>\u003cli>\u003cstrong>W2\u003c/strong>：\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/entities/WorkflowRunState.java\">请求状态 WorkflowRunState \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003c/li>\u003cli>\u003cstrong>W3\u003c/strong>：\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/nodes/BaseNode.java\">节点基类 BaseNode \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003c/li>\u003cli>\u003cstrong>W4\u003c/strong>：\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/entities/VariablePool.java\">变量池 VariablePool \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003c/li>\u003cli>\u003cstrong>W5\u003c/strong>：\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/nodes/start/StartNode.java\">StartNode \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003c/li>\u003cli>\u003cstrong>W6\u003c/strong>：\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/nodes/end/EndNode.java\">EndNode \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003c/li>\u003cli>\u003cstrong>W7\u003c/strong>：\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/nodes/llm/LLMNode.java\">LLMNode \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003c/li>\u003cli>\u003cstrong>W8\u003c/strong>：\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/nodes/knowledge/KnowledgeNode.java\">KnowledgeNode \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003c/li>\u003cli>\u003cstrong>W9\u003c/strong>：\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/nodes/knowledge/service/KnowledgeRetrievalService.java\">KnowledgeRetrievalService \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003c/li>\u003cli>\u003cstrong>W10\u003c/strong>：\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/nodes/knowledge/strategy/HybridSearchStrategy.java\">HybridSearchStrategy \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003c/li>\u003cli>\u003cstrong>W11\u003c/strong>：\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/test/java/com/immomo/dify/workflow/WorkflowRunStateTest.java\">并发与超时测试 WorkflowRunStateTest \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003c/li>\u003c/ul>\n\u003ch2>3. 第 1 周：读懂非流式网关，同时补最必要的 Java\u003c/h2>\n\u003cp>本周只跟一条普通文本、非流式请求。多模态、语音、工具调用先放一边。遇到泛型或继承看不懂，当晚用一个十几行的普通例子补概念。\u003c/p>\n\u003cp>算法怎么穿插：少量、重复、能重写\u003c/p>\n\u003cp>不用同时开一条高强度刷题线。从第 1 周起每周做 2 道新题、复做 1 道旧题。安排在基础学习时间里；当天项目任务较重就顺延，不额外挤睡眠。\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>周次\u003c/th>\u003cth>两道新题\u003c/th>\u003cth>为什么练\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>两数之和、有效括号\u003c/td>\u003ctd>Map、栈、边界条件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>反转链表、合并两个有序链表\u003c/td>\u003ctd>引用变化、指针操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>二叉树层序遍历、课程表／判断有向图是否有环\u003c/td>\u003ctd>队列、图、入度、拓扑排序\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>最长无重复子串、第 K 大元素\u003c/td>\u003ctd>滑动窗口、堆\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>二分查找、合并区间\u003c/td>\u003ctd>边界、排序、区间\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>独立重写最弱两题\u003c/td>\u003ctd>检查是否真的掌握\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>每题留下：输入输出、思路、边界、时间复杂度、空间复杂度、错误记录。看过答案的题至少隔一天重写。\u003c/p>\n\u003cp>这只是起步集合，不代表覆盖所有公司的算法面试。\u003c/p>\n\u003ch2>10. 知识记忆与复习\u003c/h2>\n\u003cp>配套文件“必备八股文页面”包含分级卡片和简短答案。每天只练 2—3 张，每张 30—60 秒。\u003c/p>\n\u003cp>记忆结构：\u003c/p>\n\u003col>\u003cli>一句话定义。\u003c/li>\u003cli>它解决哪个具体问题。\u003c/li>\u003cli>一个常见限制或坑。\u003c/li>\u003cli>代码／练习里的证据。\u003c/li>\u003c/ol>\n\u003cp>复习间隔：第一次学习当晚回忆；第 2 天、第 4 天、第 8 天、第 15 天再抽问。忘了就看答案，再合上复述，不需要整篇抄写。\u003c/p>\n\u003cp>优先级：\u003c/p>\n\u003cul>\u003cli>第一优先：Java 基础、并发、Spring、HTTP／SSE、超时、DAG。\u003c/li>\u003cli>第二优先：MySQL、Redis、Kafka、事务、Agent、RAG。\u003c/li>\u003cli>后续拓展：K8s 深入、Python 服务开发、推理引擎与算力调度。\u003c/li>\u003c/ul>\n\u003cp>不要背项目指标、个人贡献、故障根因的编造版本；这些必须来自事实。\u003c/p>\n\u003ch2>11. 笔记和学习工具怎么用\u003c/h2>\n\u003ch3>每日笔记模板\u003c/h3>\n\u003cpre>\u003ccode>日期／Day：\n今天只解决的问题：\n阅读入口：类名、方法名\n我的事前预测：\n实际代码或运行结果：\n一张小图／三步流程：\n我自己写了什么：\n我能用自己的话解释：\n仍不确定的一点：\n明天下班打开电脑先做：\u003c/code>\u003c/pre>\n\u003ch3>源码结论必须标记证据级别\u003c/h3>\n\u003cul>\u003cli>已运行验证：有输入、操作和输出记录。\u003c/li>\u003cli>已读源码确认：指出具体调用和分支，尚未实际运行。\u003c/li>\u003cli>根据文档理解：尚未核对实现。\u003c/li>\u003cli>待验证假设：有猜测，没有足够证据。\u003c/li>\u003c/ul>\n\u003cp>这个习惯能防止把过期文档、注释或 AI 解释当成真实系统行为。\u003c/p>\n\u003ch3>适合拿来提问的模板\u003c/h3>\n\u003cpre>\u003ccode>我在学某类的某方法，目前理解是：\n1. ...\n2. ...\n\n我卡在：\n...\n\n请先核对我的理解，给出源码证据。\n一次只解释一个分支，遇到基础语法先用小例子说明。\n最后给一道题让我先回答，再评价。\n不要替我把整份学习作业直接写完。\u003c/code>\u003c/pre>\n\u003cp>请核对工具给出的类名、调用关系和代码行。第一次让 AI 带着读，第二次自己追，第三次闭卷画图或写代码。\u003c/p>\n\u003ch2>12. 评分、卡住处理与可选拓展\u003c/h2>\n\u003ch3>四档评分\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>分数\u003c/th>\u003cth>表现\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>没学过或完全解释不了\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>看答案能理解，合上就说不清\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>能独立解释，能做基本例子\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>能解释失败场景、局限和取舍，并给证据\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>每周目标是核心项达到 2，少数项目强项争取 3。不要用代码行数、听课时长代替能力评分。\u003c/p>\n\u003ch3>卡住 20 分钟时\u003c/h3>\n\u003cul>\u003cli>是语法问题：从业务代码抽出最小的 10—20 行例子。\u003c/li>\u003cli>是调用链太长：只找当前方法的直接调用方和下一个调用点。\u003c/li>\u003cli>是环境问题：保存报错，切本地模拟，单独安排处理。\u003c/li>\u003cli>是概念太抽象：画两个线程／三个节点的具体时间线。\u003c/li>\u003cli>是没精力：完成最低任务，写清明天第一步，然后休息。\u003c/li>\u003c/ul>\n\u003ch3>这六周不优先投入的内容\u003c/h3>\n\u003cul>\u003cli>同时学习多个 Agent 框架并比较所有 API。\u003c/li>\u003cli>大模型预训练、强化学习、CUDA、算子优化。\u003c/li>\u003cli>为学习平台后端先实现一个完整前端。\u003c/li>\u003cli>从零完整重写公司两个项目。\u003c/li>\u003cli>没有具体问题时整本背 JVM 参数或所有中间件源码。\u003c/li>\u003cli>因为某次模拟面试不顺，就推翻全部路线。\u003c/li>\u003c/ul>\n\u003ch3>后续 Python 四次练习，可在主线完成后安排\u003c/h3>\n\u003col>\u003cli>基础语法与 JSON：读取一份虚构模型配置并校验字段。\u003c/li>\u003cli>HTTP 客户端：调用本地假模型，处理正常、超时、错误响应。\u003c/li>\u003cli>小服务：提供本地健康检查与工具接口。\u003c/li>\u003cli>日志与资源：给请求加 ID、超时和清理，写清启动步骤。\u003c/li>\u003c/ol>\n\u003cp>已有明确目标岗位要求 Python 或 K8s 时，可以提前替换部分拓展时间；不要挤掉 Java 与项目主链路训练。\u003c/p>\n\u003ch2>13. 今晚只做这五步\u003c/h2>\n\u003col>\u003cli>打开 G2 的 process()，看主干，暂时跳过细枝末节。\u003c/li>\u003cli>画鉴权→限流→路由→Client→Processor→返回。\u003c/li>\u003cli>写出 model、business、traceId 三个字段的来源和去向，不知道就标问号。\u003c/li>\u003cli>写一个 Request 对象传入方法后被修改的小例子。\u003c/li>\u003cli>用两分钟复述，然后在进度表给 Day 01 写上实际日期和卡点。\u003c/li>\u003c/ol>\n\u003cp>不用今晚看完这份手册。把“下次第一步”写下来，明天下班就能接着做。\u003c/p>","sources":[["Java 基础","Java 21 语言规范：类型与变量","https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html"],["集合","Java 21 HashMap","https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/HashMap.html"],["集合","Java 21 ConcurrentHashMap","https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ConcurrentHashMap.html"],["并发","Java 21 ThreadPoolExecutor","https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/ThreadPoolExecutor.html"],["并发","Java 21 Future","https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/Future.html"],["并发","Java 21 虚拟线程","https://docs.oracle.com/en/java/javase/21/core/virtual-threads.html"],["Spring","Spring 事务注解与代理","https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/annotations.html"],["Spring","Spring 事务回滚规则","https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/rolling-back.html"],["MySQL","InnoDB 一致性读","https://dev.mysql.com/doc/refman/8.4/en/innodb-consistent-read.html"],["MySQL","InnoDB 聚簇与二级索引","https://dev.mysql.com/doc/refman/8.4/en/innodb-index-types.html"],["MySQL","InnoDB 锁","https://dev.mysql.com/doc/refman/8.4/en/innodb-locking.html"],["Redis","Redis 持久化","https://redis.io/docs/latest/operate/oss_and_stack/management/persistence/"],["Redis","Redis 分布式锁","https://redis.io/docs/latest/develop/clients/patterns/distributed-locks/"],["Redis","Redis 数据类型","https://redis.io/docs/latest/develop/data-types/"],["网络与 Linux","MDN SSE","https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events"],["网络与 Linux","MDN HTTP 方法","https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Methods"],["分布式与消息","Apache Kafka 设计","https://kafka.apache.org/41/design/design/"]],"quizzes":[["Java 方法传入 Request 后，哪个操作能改变调用方看到的原对象字段？",["给形参重新 new 一个对象","通过形参修改原对象字段","把形参设为 null"],1,"Java 复制引用值，修改同一对象的字段可被看到，重新绑定形参不替换调用方引用。","core-01"],["两个 String 对象内容相同时，哪项一定正确？",["它们的 == 一定为 true","它们的 equals 为 true","它们必定是同一个对象"],1,"String 重写 equals 比较内容，引用是否相同是另一件事。","base-002"],["ConcurrentHashMap 中先 containsKey 再 put，是否自动成为一项原子业务操作？",["是，所有组合都安全","不是，需要合适的原子方法或同步","只要运行得快就是"],1,"单次操作安全不代表复合逻辑原子，还要考虑值对象内部状态。","core-04"],["volatile int count 的 count++ 是否自动原子？",["是","否","只要线程数不多就是"],1,"count++ 包含读取、计算、写回，volatile 不能把整体变成原子更新。","core-06"],["Future.get(timeout) 超时后，可以直接断言什么？",["远端请求已取消","任务已结束","本次等待超过给定时间而未取得结果"],2,"等待超时不自动结束任务，更不保证远端副作用停止。","core-09"],["流式响应已创建并返回，意味着什么？",["所有模型输出已经完成","还需继续管理流发送与终止","不需要处理异常了"],1,"流式生命周期仍需处理输出、失败、超时、断连与清理。","core-12"],["固定总预算为 2 秒，前面已花 1.2 秒，后续等待应怎么做？",["重新等 2 秒","按约 0.8 秒剩余预算约束等待","每个分支各领 2 秒"],1,"应传播并扣除统一预算，并为终止和清理定义行为。","core-19"],["并行 B、C 汇合到 D，最关键的保护是什么？",["让线程数更大","检查依赖满足与只调度一次的状态正确同步","给 D 加 sleep"],1,"多线程可能同时观察可执行条件，需防止重复调度。","core-17"],["Spring 代理模式下，本类直接调用带事务注解的方法，应该怎样判断？",["注解一定生效","通常绕过事务代理，需要核对调用边界","方法名包含 transaction 就生效"],1,"需要通过正确代理边界，且核对回滚等配置。","core-11"],["InnoDB 二级索引缺少查询所需列时，可能发生什么？",["一定无需读其他结构","按主键继续访问聚簇索引","数据库自动忽略缺少的列"],1,"这通常称回表；若索引覆盖全部所需列可减少这类访问。","base-041"],["热点缓存刚过期，大量请求同时回源通常称什么？",["缓存击穿","缓存穿透","线程死锁"],0,"穿透常针对不存在数据持续回源；热点失效的大量并发回源通常称击穿。","core-27"],["业务处理成功但 offset 提交前崩溃，Kafka 消费可能怎样？",["绝不重复","消息可能再次被处理","自动撤销外部数据库写入"],1,"需要围绕业务副作用设计幂等与一致性。","core-28"],["模型返回工具名和参数后，谁负责校验权限并执行？",["模型自动获得所有权限","后端执行规则负责校验与调用","只要参数 JSON 合法就可执行"],1,"合法格式不代表授权，资源归属等规则必须由后端执行。","core-22"],["Rerank 能否自动找回完全没进入候选集的文档？",["一般不能，它主要重排已有候选","一定能","只要 temperature 为零就能"],0,"候选召回不足要从召回策略、语料和索引等方面改进。","core-24"],["主事务提交后再启动异步操作，是否意味着异步任务可靠必达？",["是","不是，还要处理失败和崩溃窗口","只要线程池很大就是"],1,"afterCommit 改变时序，但不会自动提供可靠投递语义。","core-11"],["模型网关中，把每个 traceId 都当监控标签可能有什么问题？",["一定提升性能","标签基数过高，监控成本和负担上升","自动降低错误率"],1,"请求 ID 适合关联日志和追踪，聚合指标维度需控制基数。","base-072"]],"codeRefs":{"G1":{"label":"请求入口 AgentController","path":"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/controller/AgentController.java"},"G2":{"label":"主编排 Pipeline","path":"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/Pipeline.java"},"G3":{"label":"模型路由 ModelRouter","path":"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/ModelRouter.java"},"G4":{"label":"鉴权 AbstractAuth","path":"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/auth/AbstractAuth.java"},"G5":{"label":"限流 AbstractLimit","path":"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/limit/AbstractLimit.java"},"G6":{"label":"非流式 ChatProcessor","path":"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/process/ChatProcessor.java"},"G7":{"label":"流式 ChatStreamProcessor","path":"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/process/ChatStreamProcessor.java"},"G8":{"label":"客户端管理 ProviderMoaiClient","path":"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/client/ProviderMoaiClient.java"},"G9":{"label":"流桥接 GatewayStreamSink","path":"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/protocol/stream/GatewayStreamSink.java"},"G10":{"label":"流超时 StreamWatchdog","path":"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/protocol/stream/StreamWatchdog.java"},"G11":{"label":"配置 ConfigCenter","path":"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/config/ConfigCenter.java"},"G12":{"label":"健康计数 ClientHealthCounter","path":"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/client/bean/ClientHealthCounter.java"},"G13":{"label":"协议转换 ProtocolCommon","path":"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/protocol/ProtocolCommon.java"},"G14":{"label":"本地模拟 MockChatProcessor","path":"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/process/mock/MockChatProcessor.java"},"W1":{"label":"执行器 WorkflowRunner","path":"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/WorkflowRunner.java"},"W2":{"label":"请求状态 WorkflowRunState","path":"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/entities/WorkflowRunState.java"},"W3":{"label":"节点基类 BaseNode","path":"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/nodes/BaseNode.java"},"W4":{"label":"变量池 VariablePool","path":"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/entities/VariablePool.java"},"W5":{"label":"StartNode","path":"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/nodes/start/StartNode.java"},"W6":{"label":"EndNode","path":"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/nodes/end/EndNode.java"},"W7":{"label":"LLMNode","path":"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/nodes/llm/LLMNode.java"},"W8":{"label":"KnowledgeNode","path":"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/nodes/knowledge/KnowledgeNode.java"},"W9":{"label":"KnowledgeRetrievalService","path":"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/nodes/knowledge/service/KnowledgeRetrievalService.java"},"W10":{"label":"HybridSearchStrategy","path":"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/nodes/knowledge/strategy/HybridSearchStrategy.java"},"W11":{"label":"并发与超时测试 WorkflowRunStateTest","path":"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/test/java/com/immomo/dify/workflow/WorkflowRunStateTest.java"}},"projectHtml":"\u003cdiv class=\"pill\">先记住一句话：管理端管配置，执行引擎跑流程，网关调用模型。\u003c/div>\n\u003ch2>两个仓库，不只有两种职责\u003c/h2>\n\u003cp>你说的“管理端”通常对应 dify-engine 里的 manager 服务。但 dify-engine 仓库还包含 platform 服务，也就是 AI 工作流执行引擎。llm-proxy-moa 是另一个仓库，承担大模型网关职责。先把这三块分开，后面读代码会清楚得多。\u003c/p>\n\u003cdiv class=\"flow\">\u003cdiv class=\"flowbox\">\u003cstrong>管理端 Manager\u003c/strong>\u003cspan>谁能用、用哪些模型、应用配置、版本与发布\u003c/span>\u003c/div>\u003cspan class=\"flowarrow\">配置与发布 →\u003c/span>\u003cdiv class=\"flowbox\">\u003cstrong>执行引擎 Platform\u003c/strong>\u003cspan>读工作流，执行节点，传变量，处理分支与结果\u003c/span>\u003c/div>\u003cspan class=\"flowarrow\">需要模型 →\u003c/span>\u003cdiv class=\"flowbox\">\u003cstrong>大模型网关 Gateway\u003c/strong>\u003cspan>鉴权、限流、路由、协议适配、调用厂商\u003c/span>\u003c/div>\u003c/div>\n\u003cp class=\"notehint\">这是职责关系图，不表示每次业务调用都必须顺序经过三个服务。业务方可以直接调用网关；管理端也会为了模型测试、生成向量或调试而调用 AI 服务。\u003c/p>\n\n\u003ch2>1. 管理端：AI 平台的控制后台\u003c/h2>\n\u003cp>\u003cstrong>它解决的问题：\u003c/strong>如果每接一个业务、加一种模型、修改配置、发布一个工作流都要直接改代码，维护会很困难。管理端把这些信息和操作组织成后台能力，提供管理、审批、发布和查询入口。\u003c/p>\n\u003cp>\u003cstrong>谁用它：\u003c/strong>管理后台用户、平台运维或业务配置人员，以及需要获取配置的其他服务。它连接 MySQL，提供 MOA RPC 接口，还包含分发和代理能力。\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>核心功能\u003c/th>\u003cth>白话解释\u003c/th>\u003cth>你先关心什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>工作空间与 API Key\u003c/td>\u003ctd>把不同业务的资源和使用身份组织起来\u003c/td>\u003ctd>空间、业务身份和调用凭证怎样关联；不能只凭表名假设权限已全部落实\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>供应商与模型\u003c/td>\u003ctd>登记模型来自哪里、有哪些能力、使用什么配置\u003c/td>\u003ctd>逻辑模型名、厂商、实际模型、配置与凭证的区别\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>模型连通测试\u003c/td>\u003ctd>试着调用一次，判断当前配置能不能用\u003c/td>\u003ctd>modelPing 怎样选模型、调用谁、失败怎么反馈\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>应用与版本\u003c/td>\u003ctd>保存 AI 应用和工作流配置，管理不同版本\u003c/td>\u003ctd>编辑、创建版本、上线三个动作不应简单视为同一件事\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>发布、灰度、回滚\u003c/td>\u003ctd>决定哪份配置让哪些调用方使用\u003c/td>\u003ctd>配置怎样生效，旧版本与新版本怎样区分\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>知识库、标注与调试\u003c/td>\u003ctd>维护检索数据，转发调试、查询运行记录\u003c/td>\u003ctd>需要学 RAG 和排障时再深入\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>价格、账单与审批\u003c/td>\u003ctd>处理平台治理和成本相关业务\u003c/td>\u003ctd>若非你负责且不写简历，先知道用途，暂不逐接口读\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>关键纠正：\u003c/strong>管理端不只是增删改查，它有配置组装、发布和跨服务调用；但它也不应被说成 DAG 执行器。实际 WorkflowRunner 在 platform 服务。\u003c/p>\n\n\u003ch3>管理端优先关注的方法\u003c/h3>\n\u003cp>下面是已在 Java API 定义与实现中核对的方法名。管理端使用 MOA RPC 和 dispatch 等入口，不能把这些名字直接猜成同名 HTTP URL。\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>优先级\u003c/th>\u003cth>方法／入口\u003c/th>\u003cth>阅读目的\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>第一批\u003c/td>\u003ctd>getModelConfigMap(corpUpper, crossEnvLlmProxyBaseUrl)\u003c/td>\u003ctd>网关从管理端获取元配置与凭证的桥梁。实现委托给 ModelService.getMetaConfigAndCredentialConfig()\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>第一批\u003c/td>\u003ctd>modelList、infoModel、addModel、updateModel、modelPing\u003c/td>\u003ctd>选择一次“查询→修改／新增→测试”的小闭环，不要求一晚读完全部方法\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>第一批\u003c/td>\u003ctd>workspaceList、infoWorkspace、providerList、infoProvider\u003c/td>\u003ctd>明白模型属于哪个业务空间、由谁提供\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>第二批\u003c/td>\u003ctd>insertAgentApp、updateAgentApp、addAgentAppVersion\u003c/td>\u003ctd>应用与工作流配置如何保存、形成版本\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>第二批\u003c/td>\u003ctd>operate、grayConfig、cancelGrayConfig\u003c/td>\u003ctd>版本操作、灰度和取消灰度的边界\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>第二批\u003c/td>\u003ctd>debugTask、debugQuery、debugNode、sendChatMessage\u003c/td>\u003ctd>管理端怎样转发调试或聊天到执行端；不是它自己在这里调度 DAG\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>了解入口\u003c/td>\u003ctd>dispatch(url, params, operatorInfo)\u003c/td>\u003ctd>理解请求分发。没有读路由注册前，不猜每个前端 URL 的具体映射\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\n\u003ch2>2. 大模型网关：业务调用模型的统一入口\u003c/h2>\n\u003cp>\u003cstrong>它解决的问题：\u003c/strong>不同模型厂商的请求格式、鉴权、流式事件和错误不完全一样。如果每个业务直接接所有厂商，就会重复建设。网关提供统一接入，并把配置、调用治理与厂商差异集中处理。\u003c/p>\n\u003cp>\u003cstrong>谁用它：\u003c/strong>业务后端、工作流引擎以及支持兼容协议的调用端。网关不是训练大模型的服务，也不能因入口叫 AgentController 就推断它运行了完整 Agent 规划循环。\u003c/p>\n\u003cdiv class=\"flow\">\u003cdiv class=\"flowbox\">\u003cstrong>业务请求\u003c/strong>\u003cspan>key、model、messages、stream\u003c/span>\u003c/div>\u003cspan class=\"flowarrow\">→\u003c/span>\u003cdiv class=\"flowbox\">\u003cstrong>网关编排\u003c/strong>\u003cspan>身份 → 限流 → 路由 → Client → Processor\u003c/span>\u003c/div>\u003cspan class=\"flowarrow\">→\u003c/span>\u003cdiv class=\"flowbox\">\u003cstrong>厂商调用与返回\u003c/strong>\u003cspan>协议转换、响应／SSE、错误、用量与指标\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>核心功能\u003c/th>\u003cth>要理解的问题\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>协议兼容与转换\u003c/td>\u003ctd>外部请求如何变成内部 ChatCompletion；厂商响应怎样转回来\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>鉴权与业务识别\u003c/td>\u003ctd>API Key 如何关联 business；谁负责校验与填充字段\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>限流\u003c/td>\u003ctd>当前具体实现限制什么，计数放哪里，多实例是否共享；不能只读抽象类下结论\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>路由与 Client 管理\u003c/td>\u003ctd>business+model 怎样找到配置，后续怎样选厂商和具体 Client\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>普通与流式调用\u003c/td>\u003ctd>一次完整 JSON 返回与持续输出的生命周期有什么不同\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>健康、超时与清理\u003c/td>\u003ctd>故障如何记录或影响选择，取消能否传到底层，资源怎样结束\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>多类 AI 能力\u003c/td>\u003ctd>除聊天外，仓库还存在 Embedding、Rerank、语音、生图、异步任务等入口；按任务需要深入\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\n\u003ch3>网关优先关注的 HTTP 接口\u003c/h3>\n\u003cp class=\"notehint\">路径来自 Controller 类级和方法级注解组合。外部域名、反向代理与环境前缀可能另有改写，这里不推断生产访问地址。\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>优先级\u003c/th>\u003cth>Controller 路径\u003c/th>\u003cth>用途与入口\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>先学这个\u003c/td>\u003ctd>POST /moai/agent/v1/chat/completions\u003c/td>\u003ctd>AgentController.chatCompletions → processOpenai → doProcess → Pipeline。第一次选 stream=false\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>随后\u003c/td>\u003ctd>同上，stream=true\u003c/td>\u003ctd>从同一入口观察 CHAT 与 CHAT_STREAM 的分支，追到 ChatStreamProcessor\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>随后\u003c/td>\u003ctd>POST /api/v1/chat/completions\u003c/td>\u003ctd>AIGCGatewayController.chat。按 shouldUsePipeline 判断走新 Pipeline 或旧调用服务，别把两条流程混着学\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>再学\u003c/td>\u003ctd>POST /moai/agent/v1/messages\u003c/td>\u003ctd>另一兼容协议入口，比较请求和流事件转换差异\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>学 RAG 时\u003c/td>\u003ctd>POST /api/v1/embeddings、/api/v1/embeddings/v2\u003c/td>\u003ctd>将文本等输入转换为向量的调用入口；两个版本差异需分别读实现\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>学 RAG 时\u003c/td>\u003ctd>POST /api/v1/rerank\u003c/td>\u003ctd>候选相关性重排\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>后放\u003c/td>\u003ctd>/api/v1/audio/speech、/api/v1/image/txt2img、/api/v1/async/submit 等\u003c/td>\u003ctd>语音、生图、异步任务，先知道存在；如果实际由你负责，再提升优先级\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>第一次读代码的完整主线：\u003c/strong>AgentController → ProtocolCommon → Pipeline.process → Auth → Limit → ModelRouter → ProviderMoaiClient → Processor → 某一个具体模型调用。\u003c/p>\n\u003cp>Controller 是 HTTP 入口；Pipeline 是编排服务；Processor 是处理抽象／实现；它们不是三个对外 HTTP 接口。先分清“外部接口”和“内部方法”。\u003c/p>\n\n\u003ch2>3. 工作流执行引擎：把多个步骤串起来运行\u003c/h2>\n\u003cp>如果业务需求是“检索知识→拼提示词→问模型→处理结果→返回”，单次模型调用不够。platform 服务读取工作流配置，建立节点与依赖，运行节点，传递变量，处理并发、失败、超时和结果。\u003c/p>\n\u003cp>\u003cstrong>例子：\u003c/strong>用户问报销规则 → Start 接收输入 → Knowledge 检索规则 → LLM 基于规则生成回答 → End 输出。这个例子用于理解，不代表已经确认生产存在这条具体流程。\u003c/p>\n\u003cp>节点需要模型时，可以通过模型适配层调用网关；不是所有节点都调用网关。代码节点、变量处理或其他工具节点可以有不同执行路径。\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>优先级\u003c/th>\u003cth>Controller 路径／内部入口\u003c/th>\u003cth>阅读目的\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>第一批\u003c/td>\u003ctd>POST /v1/workflows/run\u003c/td>\u003ctd>DifyEngineController.workflowRun：一般工作流运行入口\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>第一批\u003c/td>\u003ctd>POST /v1/chat-messages\u003c/td>\u003ctd>聊天应用请求入口；与普通模型 chat/completions 不是同一层\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>第一批\u003c/td>\u003ctd>WorkflowRunner.build、runWithTaskId、run(state,node)\u003c/td>\u003ctd>配置构建、一次执行状态、节点调度\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>第一批\u003c/td>\u003ctd>WorkflowRunState、VariablePool、BaseNode\u003c/td>\u003ctd>当前执行的状态、变量与节点公共逻辑\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>第二批\u003c/td>\u003ctd>POST /v1/debug/task、/v1/debug/query、/v1/debug/node\u003c/td>\u003ctd>提交调试、查询结果、单节点调试\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\n\u003ch2>4. 三者怎样合作：分清两条链路\u003c/h2>\n\u003ch3>配置链路：系统知道“用什么、谁能用”\u003c/h3>\n\u003col>\u003cli>后台人员在管理端维护工作空间、供应商、模型或应用版本。\u003c/li>\u003cli>管理端保存与组装相关配置。网关 ConfigCenter 存在获取管理端配置的代码，并按开关与配置源进行合并／刷新。\u003c/li>\u003cli>在当前源码中，国内分支可通过 getModelConfigMap RPC 获取，海外分支存在 HTTP 获取路径；实际走哪条取决于运行环境。\u003c/li>\u003cli>网关更新可用的路由、凭证和 Client 等缓存。应用版本发布与工作流配置生效是另一个需要单独追踪的链路。\u003c/li>\u003c/ol>\n\u003cp class=\"notehint\">保存到数据库、组装配置、发布、网关刷新不是天然同一个原子动作。新旧配置源和开关也不能忽略。具体生效时序必须继续沿实现验证。\u003c/p>\n\u003ch3>运行链路：一次业务请求如何得到结果\u003c/h3>\n\u003col>\u003cli>业务直接调用网关：网关识别身份、路由并调用厂商，返回普通或流式响应。\u003c/li>\u003cli>业务调用工作流：执行引擎加载流程、创建当前执行状态、运行节点，模型节点按模型层实现请求网关，最终汇总或流式输出。\u003c/li>\u003cli>管理端的聊天／调试功能可以作为入口或代理，但不表示每次线上模型请求都先经过管理端。\u003c/li>\u003c/ol>\n\n\u003ch2>5. 你现在需要懂到什么程度\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>层次\u003c/th>\u003cth>本轮要求\u003c/th>\u003cth>暂时不用做\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>用途\u003c/td>\u003ctd>各用一句话说明三者用途，举一个真实或明确标注为示例的业务场景\u003c/td>\u003ctd>背所有模块名\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>接口\u003c/td>\u003ctd>一条非流式聊天接口的输入、输出、调用链与错误路径\u003c/td>\u003ctd>读完每个厂商、语音和生图接口\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>配置\u003c/td>\u003ctd>说明业务、模型、厂商、凭证、Client 各是什么，配置怎样到网关\u003c/td>\u003ctd>第一晚读所有审批和账单接口\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>工作流\u003c/td>\u003ctd>先看 Start→假节点／LLM→End，再看分支、状态和超时\u003c/td>\u003ctd>立即理解完整条件分支与迭代调度\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>个人贡献\u003c/td>\u003ctd>写进简历的模块要能讲实现、理由、失败处理和本人改动\u003c/td>\u003ctd>把旁观或学习理解说成亲自主导\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\n\u003ch2>6. 推荐的源码阅读顺序\u003c/h2>\n\u003col>\u003cli>先读本页，只画职责关系，不写代码。\u003c/li>\u003cli>AgentController 的 processOpenai 和 doProcess。\u003c/li>\u003cli>Pipeline.process：先正常流程，再两个 catch。\u003c/li>\u003cli>ModelRouter.route，然后追到一个实际 Client／Processor。\u003c/li>\u003cli>ConfigCenter.getDifyEngineManagerMetaConfigByApi，再看 Manager 的 getModelConfigMap 与 ModelService.getMetaConfigAndCredentialConfig。\u003c/li>\u003cli>再学工作流接口与 WorkflowRunner，分清“调用模型”和“调度多个节点”。\u003c/li>\u003cli>最后扩展流式、并发、检索、调试和发布。\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>今晚验收：\u003c/strong>能解释“为什么直接问模型只需要网关，而一个检索后回答的流程还需要工作流引擎；管理端在其中负责准备和管理什么”。说不清就重看关系图，不急着读复杂实现。\u003c/p>\n\n\u003ch2>源码入口：复制到 IDE 查找\u003c/h2>\n\u003cp>以下结论来自当前本地源码与项目文档核对，尚未启动系统验证运行环境。\u003c/p>\n\u003cdiv class=\"toolbar\">\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-manager-api/src/main/java/com/immomo/dify/manager/api/DifyEngineManagerService.java\">管理端 API 定义 \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-manager-service/src/main/java/com/immomo/dify/manager/service/impl/controller/DifyEngineManagerServiceImpl.java\">管理端服务实现 \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-manager-service/src/main/java/com/immomo/dify/manager/service/impl/service/ModelService.java\">管理端 ModelService \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-manager-service/src/main/java/com/immomo/dify/manager/service/impl/service/MoaiMetaConfigService.java\">管理端配置组装 \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/controller/AgentController.java\">网关 AgentController \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/controller/AIGCGatewayController.java\">网关 AIGCGatewayController \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/Pipeline.java\">网关 Pipeline \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/config/ConfigCenter.java\">网关 ConfigCenter \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/controller/DifyEngineController.java\">工作流 HTTP Controller \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/WorkflowRunner.java\">WorkflowRunner \u003cspan>复制路径 ↗\u003c/span>\u003c/button>\u003c/div>\n\n"}</script>

 for(const d of DATA.days){const v=raw.days&&raw.days[d.id];if(v&&typeof v==='object')clean.days[d.id]={done:v.done===true,note:typeof v.note==='string'?v.note.slice(0,20000):''}}
 for(const c of DATA.cards){const v=raw.cards&&raw.cards[c.id];if(v&&typeof v==='object')clean.cards[c.id]={level:[0,1,2,3].includes(v.level)?v.level:0,star:v.star===true,note:typeof v.note==='string'?v.note.slice(0,20000):'',due:Number.isFinite(v.due)?v.due:0,review:Number.isFinite(v.review)?v.review:0}}

 return clean;

function filteredCards(){return DATA.cards.filter(c=>{const s=cardState(c.id);return (category==='全部'||c.cat===category)&&(priority==='全部'||c.priority===priority)&&(filter==='全部'||filter==='收藏'&&s.star||filter==='不会／模糊'&&[1,2].includes(s.level)||filter==='待复习'&&s.review&&s.due<=Date.now()||filter==='未学习'&&!s.review)&&(query===''||[c.q,c.plain,c.answer,c.example,c.pitfall,c.follow,c.cat].join(' ').toLowerCase().includes(query.toLowerCase()))})}
function renderCards(openId){const list=filteredCards(),count=Math.max(1,Math.ceil(list.length/12));page=Math.min(page,count);const cats=[...new Set(DATA.cards.map(c=>c.cat))];root.innerHTML=head('必备八股文，从会解释开始。','110 个知识点。先读白话解释，再闭卷回答，最后联系项目。')+
 '<div class="toolbar"><select id="category" aria-label="知识分类">'+['全部',...cats].map(c=>'<option '+(category===c?'selected':'')+'>'+c+'</option>').join('')+'</select><select id="priority" aria-label="学习优先级">'+['全部','基础必会','项目必会','进阶再学'].map(c=>'<option '+(priority===c?'selected':'')+'>'+c+'</option>').join('')+'</select>'+['全部','未学习','不会／模糊','待复习','收藏'].map(f=>'<button class="chip '+(filter===f?'on':'')+'" data-filter="'+f+'">'+f+'</button>').join('')+'<span class="notehint" style="margin-left:auto">'+list.length+' 个结果'+(query?' · 搜索：'+esc(query):'')+'</span></div><div class="cards">'+(list.length?list.slice((page-1)*12,page*12).map(c=>cardHTML(c,c.id===openId)).join(''):'<div class="empty">暂时没有符合条件的知识点。试试清空搜索或切换分类。</div>')+'</div><div class="pagination"><button class="small" data-page="-1" '+(page<=1?'disabled':'')+'>← 上一页</button><span class="notehint">'+page+' / '+count+'</span><button class="small" data-page="1" '+(page>=count?'disabled':'')+'>下一页 →</button></div>';
}

 '<div class="planlayout"><aside class="daylist" aria-label="每日任务">'+DATA.days.map((x,i)=>(i%7===0?'<div class="weeklabel">WEEK '+x.week+'</div>':'')+'<button class="daybtn '+(x.id===d.id?'on':'')+'" data-day="'+x.id+'"><small>'+String(x.id).padStart(2,'0')+'</small>'+esc(x.title)+(dayState(x.id).done?' ✓':'')+'</button>').join('')+'</aside><article class="panel"><div class="panelhead"><span class="pill">WEEK '+d.week+' / DAY '+String(d.id).padStart(2,'0')+'</span><button class="small '+(ds.done?'chosen':'primary')+'" data-done="'+d.id+'">'+(ds.done?'✓ 已完成 · 点击撤销':'达到验收，标记完成')+'</button></div><h2>'+esc(d.title)+'</h2><div class="reading">'+d.html+'</div><div class="notelabel"><label for="daynote">今天的笔记与明天第一步</label><span>自动保存</span></div><textarea id="daynote" data-day-note="'+d.id+'" placeholder="今天弄懂了什么；证据在哪里；还有什么不懂；明天先做什么。">'+esc(ds.note)+'</textarea><div class="statusrow"><button class="small" data-day="'+Math.max(1,d.id-1)+'" '+(d.id===1?'disabled':'')+'>← 前一天</button><button class="small primary" data-day="'+Math.min(42,d.id+1)+'" '+(d.id===42?'disabled':'')+'>下一天 →</button></div></article></div>'}

function quizIntro(){root.innerHTML=head('先回答，再看答案。','16 道基础判断题，另有知识卡片闭卷复习。结果用于找薄弱点。')+'<div class="quizwrap"><div class="panel"><span class="pill">基础诊断 · 约 10 分钟</span><h2 style="margin-top:20px">先知道哪里不会，<br>再决定今天学什么。</h2><p class="muted">涵盖 Java、并发、Spring、数据库、消息与 AI 平台。选择后会解释原因，并链接回对应知识点。</p><button class="primary" data-start-quiz>开始 16 题自测 →</button><div class="progress" style="margin-top:26px"><div style="width:0"></div></div><p class="notehint">没有计时压力。不知道可以选“不确定”，不要猜对后就当学会了。</p></div><div class="panel" style="margin-top:18px"><h3>想练开口回答？</h3><p class="muted">打开知识卡，先只看题目。闭卷讲 30—60 秒，再展开答案，自评“还不会／模糊／能讲清楚”。</p><button class="small" data-weak>复习不会和模糊的知识点</button></div></div>'}
function renderQuiz(){if(!quiz){quizIntro();return}if(quiz.index>=quiz.items.length){const wrong=quiz.answers.filter(a=>!a.correct);root.innerHTML=head('这次自测完成了。','先修补不确定的点，再做下一次。分数不代表实际项目熟练度。')+'<div class="quizwrap"><div class="panel"><span class="eyebrow">YOUR CHECK-IN</span><h2 style="font-size:44px;margin:14px 0">'+quiz.answers.filter(a=>a.correct).length+' <span class="muted" style="font-size:20px">/ '+quiz.items.length+'</span></h2><p>'+wrong.length+' 个知识点需要再看一遍。</p><button class="primary" data-start-quiz>重新自测</button><button style="margin-left:10px" data-view="notes">查看学习记录</button></div><div style="margin-top:20px">'+wrong.map(a=>'<div class="minicard"><p>'+esc(a.q[0])+'</p><button class="small" data-open-card="'+a.q[4]+'">回去学习</button></div>').join('')+'</div></div>';return}
 const q=quiz.items[quiz.index],a=quiz.answers[quiz.index];root.innerHTML=head('闭卷自测','先凭自己的理解选择；答错的知识点会加入薄弱项。')+'<div class="quizwrap"><section class="panel"><div class="panelhead"><span class="pill">QUESTION '+(quiz.index+1)+' / '+quiz.items.length+'</span><button class="small ghost" data-exit-quiz>退出本次</button></div><div class="progress"><div style="width:'+(quiz.index/quiz.items.length*100)+'%"></div></div><h2 class="quizquestion">'+esc(q[0])+'</h2>'+q[1].map((o,i)=>'<button class="option '+(a&&i===q[2]?'correct':a&&a.choice===i?'wrong':'')+'" data-choice="'+i+'" '+(a?'disabled':'')+'>'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join('')+'<button class="option '+(a&&a.choice===-1?'wrong':'')+'" data-choice="-1" '+(a?'disabled':'')+'>不确定，先标记不会</button>'+(a?'<div class="explanation"><strong>'+(a.correct?'判断正确':'这里需要再学一下')+'</strong><p style="margin:8px 0 0">'+esc(q[3])+'</p></div><div class="statusrow"><button class="primary" data-next-quiz>'+(quiz.index===quiz.items.length-1?'查看结果':'下一题 →')+'</button><button data-open-card="'+q[4]+'">查看对应知识点</button></div>':'')+'</section></div>'}
function notes(){const done=DATA.days.filter(d=>dayState(d.id).done),written=DATA.days.filter(d=>dayState(d.id).note.trim()),cardnotes=DATA.cards.filter(c=>cardState(c.id).note.trim());root.innerHTML=head('把弄懂的，留下来。','笔记和进度保存在当前浏览器。换浏览器或移动地址前，请导出记录。')+'<div class="toolbar"><button class="primary" data-export>导出学习记录 ↓</button><button data-import>导入记录 · 合并</button><button data-print>打印当前页面</button></div><div class="grid2"><section class="panel"><h3>每日笔记 <span class="muted">'+written.length+'</span></h3>'+(written.length?written.map(d=>'<div class="minicard" style="display:block"><button class="small" data-day="'+d.id+'">Day '+String(d.id).padStart(2,'0')+' · '+esc(d.title)+'</button><p style="white-space:pre-wrap;margin-top:12px">'+esc(dayState(d.id).note)+'</p></div>').join(''):'<p class="muted">从 Day 01 开始，写下一点今天真正理解的内容。</p><button data-day="1">去写第一篇笔记</button>')+'</section><section class="panel"><h3>知识点笔记 <span class="muted">'+cardnotes.length+'</span></h3>'+(cardnotes.length?cardnotes.map(c=>'<div class="minicard" style="display:block"><button class="small" data-open-card="'+c.id+'">'+esc(c.q)+'</button><p style="white-space:pre-wrap;margin-top:12px">'+esc(cardState(c.id).note)+'</p></div>').join(''):'<p class="muted">知识卡片下面可以记录自己的例子和不懂的地方。</p>')+'<h3 style="margin-top:25px">最近自测</h3>'+(state.quizHistory.length?state.quizHistory.slice(-5).reverse().map(h=>'<p class="notehint">'+esc(h.date)+' · '+h.score+' / '+h.total+'</p>').join(''):'<p class="notehint">还没有完成自测。</p>')+'</section></div>'}
function guide(){root.innerHTML=head('这本手册怎么用。','按天推进，允许顺延。Java 以项目相关的 JDK 21 概念为主，其他版本细节要核对。')+'<article class="panel reading"><h2>打开与保存</h2><p>入口是 my 文件夹内的 index.html。双击即可阅读，不需要联网或安装依赖。可把此文件加入浏览器书签。</p><p>学习记录保存在当前浏览器、当前页面地址下，不会自动同步到其他设备。更换浏览器、文件位置或清理浏览数据前，先在“我的学习记录”导出 JSON；之后再导入合并。</p><p>所有学习页面均可离线使用。官方参考链接需要联网。当前是本地手册；手机访问需要复制文件或另行安排托管。</p><h2>版本与证据</h2><p>源码关系已按 2026-10-20 工作区核对，项目当前是否启用某功能还取决于运行配置。Java 以 JDK 21 为主要参考；MySQL 引用 8.4 官方概念页，项目数据库版本与行为需另行确认。Spring、Redis、Kafka 的具体配置同样需要结合实际版本。</p>'+DATA.guideHtml+'</article><h2 style="margin-top:30px">继续核对的官方资料</h2><p class="notehint">遇到争议或版本差异时回到这些资料，再用本地例子验证。它们是进一步阅读入口，不代表每张卡涵盖了完整规范。</p><div class="sourcegrid">'+DATA.sources.map(s=>'<a target="_blank" rel="noopener noreferrer" href="'+esc(s[2])+'"><small>'+esc(s[0])+'</small>'+esc(s[1])+' ↗</a>').join('')+'</div>'}
function render(){document.getElementById('crumb').textContent=names[view];document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('on',b.dataset.view===view));({home,projects,plan,cards:renderCards,quiz:renderQuiz,notes,guide}[view]||home)();updateSide()}
function go(v){view=v;render();window.scrollTo({top:0,behavior:'instant'})}
function openCard(id){view='cards';query='';document.getElementById('search').value='';category='全部';priority='全部';filter='全部';const index=DATA.cards.findIndex(c=>c.id===id);if(index<0)return;page=Math.floor(index/12)+1;render();const el=document.getElementById(id);if(el){el.open=true;el.scrollIntoView({block:'start',behavior:'instant'})}}
function setRate(id,level){const old=cardState(id);if(level===0){state.cards[id]={...old,level:0,review:0,due:0};save();return}const now=Date.now(),streak=level===3?(old.review||0)+1:0,days=level===1?0:level===2?1:[1,3,7,14][Math.min(3,Math.max(0,streak-1))];state.cards[id]={...old,level,review:streak||1,due:now+days*86400000};save()}
document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.view){go(b.dataset.view);return}
 if(b.dataset.day){selectedDay=Number(b.dataset.day);go('plan');return}
 if(b.dataset.openCard){openCard(b.dataset.openCard);return}
 if(b.dataset.filter){filter=b.dataset.filter;page=1;renderCards();return}
 if(b.dataset.page){page+=Number(b.dataset.page);renderCards();window.scrollTo({top:0,behavior:'instant'});return}
 if(b.dataset.rate){setRate(b.dataset.rate,Number(b.dataset.level));const block=b.closest('.knowledge');block.querySelectorAll('[data-rate]').forEach(x=>x.classList.toggle('chosen',x===b));const c=DATA.cards.find(x=>x.id===b.dataset.rate);block.querySelector('.question small').textContent=c.cat+' · '+c.priority+' · '+['尚未自评','还不会','有点模糊','能讲清楚'][Number(b.dataset.level)];toast('已记录，下次继续复习');return}
 if(b.dataset.star){const id=b.dataset.star;state.cards[id]={...cardState(id),star:!cardState(id).star};save();b.textContent=state.cards[id].star?'★ 已收藏':'☆ 收藏';return}
 if(b.dataset.done){const id=Number(b.dataset.done);state.days[id]={...dayState(id),done:!dayState(id).done};save();plan();return}
 if(b.dataset.copy){try{await navigator.clipboard.writeText(b.dataset.copy);toast('源码路径已复制')}catch(e){const t=document.createElement('textarea');t.value=b.dataset.copy;document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();toast(ok?'源码路径已复制':'请在 IDE 中搜索对应类名')}return}
 if(b.hasAttribute('data-start-quiz')){quiz={items:[...DATA.quizzes].sort(()=>Math.random()-.5),index:0,answers:[]};go('quiz');return}
 if(b.hasAttribute('data-exit-quiz')){quiz=null;renderQuiz();return}
 if(b.dataset.choice!==undefined&&quiz&&!quiz.answers[quiz.index]){const q=quiz.items[quiz.index],choice=Number(b.dataset.choice),correct=choice===q[2];quiz.answers.push({q,choice,correct});if(!correct)setRate(q[4],1);renderQuiz();return}
 if(b.hasAttribute('data-next-quiz')){quiz.index++;if(quiz.index===quiz.items.length){state.quizHistory.push({date:date(),score:quiz.answers.filter(a=>a.correct).length,total:quiz.items.length});state.quizHistory=state.quizHistory.slice(-50);save()}renderQuiz();return}
 if(b.hasAttribute('data-weak')){filter='不会／模糊';category='全部';priority='全部';query='';page=1;document.getElementById('search').value='';go('cards');return}
 if(b.hasAttribute('data-export')){const blob=new Blob([JSON.stringify({format:'my-learning-records',version:1,exported:new Date().toISOString(),state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='学习记录-'+date().replaceAll('/','-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('记录已导出');return}
 if(b.hasAttribute('data-import')){document.getElementById('importFile').click();return}
 if(b.hasAttribute('data-print')){window.print();return}
});
document.addEventListener('input',e=>{if(e.target.dataset.dayNote){const id=Number(e.target.dataset.dayNote);state.days[id]={...dayState(id),note:e.target.value};save()}if(e.target.dataset.cardNote){const id=e.target.dataset.cardNote;state.cards[id]={...cardState(id),note:e.target.value};save()}});
document.addEventListener('change',e=>{if(e.target.id==='category'){category=e.target.value;page=1;renderCards()}if(e.target.id==='priority'){priority=e.target.value;page=1;renderCards()}});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim();category='全部';priority='全部';filter='全部';page=1;if(view!=='cards'){view='cards';render()}else renderCards()});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();document.getElementById('search').focus()}});
document.getElementById('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>4000000)throw Error('文件过大');const raw=JSON.parse(await file.text());if(raw.format!=='my-learning-records'||raw.version!==1)throw Error('请选择本手册导出的记录');const imported=normalize(raw.state);state.days={...state.days,...imported.days};state.cards={...state.cards,...imported.cards};const seen=new Set();state.quizHistory=[...state.quizHistory,...imported.quizHistory].filter(h=>{const k=h.date+'-'+h.score+'-'+h.total;if(seen.has(k))return false;seen.add(k);return true}).slice(-50);save();render();toast('学习记录已合并')}catch(err){toast('导入失败：'+err.message)}e.target.value=''});
render();
