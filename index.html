<script id="study-data" type="application/json">{"version":1,"updated":"2026-10-20","days":[{"id":1,"title":"建立地图，不求读完整个项目","week":1,"body":"**读什么，30 分钟**\n- 打开 G2 的 process()，只看“鉴权→限流→路由→Client→Processor→错误处理”主干。\n- 在 G1 搜索谁调用 Pipeline，选择一处普通对话入口继续追。\n- 看请求类型和返回类型的定义，只抄 5 个关键字段，例如 model、business、traceId、processType、messages。\n\n**动手，30 分钟**\n- 建立自己的学习笔记和练习目录；可以直接填写本页底部的每日笔记。\n- 用纸或页面笔记画 6—8 个方框，连接调用顺序。\n- 在每个框旁写“输入什么、输出什么”；不会的地方写问号，不让 AI 先替你填完。\n- 检查本地 JDK 和运行一个 Hello World，环境问题限时 30 分钟。\n\n**补基础，20 分钟**\n- 类、对象、方法、参数、返回值、成员变量和局部变量。\n- 写 Request 类，增加 model 字段；把对象传给一个方法修改，再观察外面能否看到。理解 Java 传递的是引用值的副本。\n\n**今天产出**\n- Day 01 页面笔记：调用链草图、5 个字段、最多 5 个疑问。\n- 一个能本地运行的 main 方法。\n\n**验收**\n- 不看代码说出 Pipeline 做的 5 件事。\n- 指出哪里真正调用模型；暂时只定位到抽象方法也可以，但要标注“还没找到具体实现”。\n\n**最低任务**\n- 只读 process()，写出正常主干和两个 catch 分支的区别。","html":"\u003cp>\u003cstrong>读什么，30 分钟\u003c/strong>\u003c/p>\n\u003cul>\u003cli>打开 \u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/Pipeline.java\">G2 · 主编排 Pipeline \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的 process()，只看“鉴权→限流→路由→Client→Processor→错误处理”主干。\u003c/li>\u003cli>在 \u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/controller/AgentController.java\">G1 · 请求入口 AgentController \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 搜索谁调用 Pipeline，选择一处普通对话入口继续追。\u003c/li>\u003cli>看请求类型和返回类型的定义，只抄 5 个关键字段，例如 model、business、traceId、processType、messages。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>动手，30 分钟\u003c/strong>\u003c/p>\n\u003cul>\u003cli>建立自己的学习笔记和练习目录；可以直接填写本页底部的每日笔记。\u003c/li>\u003cli>用纸或页面笔记画 6—8 个方框，连接调用顺序。\u003c/li>\u003cli>在每个框旁写“输入什么、输出什么”；不会的地方写问号，不让 AI 先替你填完。\u003c/li>\u003cli>检查本地 JDK 和运行一个 Hello World，环境问题限时 30 分钟。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>补基础，20 分钟\u003c/strong>\u003c/p>\n\u003cul>\u003cli>类、对象、方法、参数、返回值、成员变量和局部变量。\u003c/li>\u003cli>写 Request 类，增加 model 字段；把对象传给一个方法修改，再观察外面能否看到。理解 Java 传递的是引用值的副本。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>今天产出\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Day 01 页面笔记：调用链草图、5 个字段、最多 5 个疑问。\u003c/li>\u003cli>一个能本地运行的 main 方法。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>不看代码说出 Pipeline 做的 5 件事。\u003c/li>\u003cli>指出哪里真正调用模型；暂时只定位到抽象方法也可以，但要标注“还没找到具体实现”。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>最低任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>只读 process()，写出正常主干和两个 catch 分支的区别。\u003c/li>\u003c/ul>"},{"id":2,"title":"看懂继承、泛型和 Processor","week":1,"body":"**读什么**\n- G2 的 resolveProcessor()。\n- 从 G6 的父类往上追一层，找到 execute() 与 doExecute() 的关系。\n- 选择 G14，找到非流式请求的一个具体实现。不要同时读所有厂商。\n\n**动手**\n- 写接口 ModelClient，定义 chat(String text)。\n- 写 FakeClientA 和 FakeClientB，分别返回固定字符串。\n- 用 Map\u003cString, ModelClient> 根据模型名取实例；没有配置时给出明确错误。\n- 再写一个小泛型例子 Box\u003cT>，分别放 String 和 Integer。\n\n**补基础**\n- interface、abstract、extends、implements、方法重写、泛型。\n- 查明代码里的注解哪些来自 Spring、哪些来自 Lombok。先知道用途，不展开所有原理。\n\n**产出与验收**\n- 一张“抽象入口→具体实现”的继承图。\n- 能解释“为什么调用抽象类型，最后执行的是具体类的方法”。\n- 能解释 processKey 查找失败的路径，不把它简单说成 Spring 自动选择。\n\n**最低任务**\n- 找到一个 request() 的具体实现，写出它和父类的关系。","html":"\u003cp>\u003cstrong>读什么\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/Pipeline.java\">G2 · 主编排 Pipeline \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的 resolveProcessor()。\u003c/li>\u003cli>从 \u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/process/ChatProcessor.java\">G6 · 非流式 ChatProcessor \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的父类往上追一层，找到 execute() 与 doExecute() 的关系。\u003c/li>\u003cli>选择 \u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/process/mock/MockChatProcessor.java\">G14 · 本地模拟 MockChatProcessor \u003cspan>复制路径 ↗\u003c/span>\u003c/button>，找到非流式请求的一个具体实现。不要同时读所有厂商。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>动手\u003c/strong>\u003c/p>\n\u003cul>\u003cli>写接口 ModelClient，定义 chat(String text)。\u003c/li>\u003cli>写 FakeClientA 和 FakeClientB，分别返回固定字符串。\u003c/li>\u003cli>用 Map&lt;String, ModelClient&gt; 根据模型名取实例；没有配置时给出明确错误。\u003c/li>\u003cli>再写一个小泛型例子 Box&lt;T&gt;，分别放 String 和 Integer。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>补基础\u003c/strong>\u003c/p>\n\u003cul>\u003cli>interface、abstract、extends、implements、方法重写、泛型。\u003c/li>\u003cli>查明代码里的注解哪些来自 Spring、哪些来自 Lombok。先知道用途，不展开所有原理。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>产出与验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>一张“抽象入口→具体实现”的继承图。\u003c/li>\u003cli>能解释“为什么调用抽象类型，最后执行的是具体类的方法”。\u003c/li>\u003cli>能解释 processKey 查找失败的路径，不把它简单说成 Spring 自动选择。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>最低任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>找到一个 request() 的具体实现，写出它和父类的关系。\u003c/li>\u003c/ul>"},{"id":3,"title":"鉴权与 Spring 注入","week":1,"body":"**读什么**\n- G4 的 execute()、doExecute()。\n- 在 IDE 中查 AbstractAuth 的具体子类，确认当前注入的是哪一个；如果需要环境条件，记录条件。\n- 回到 G2，看 auth 从哪里注入、鉴权后哪些请求字段改变。\n\n**动手**\n- 用内存 Map 模拟 test-key-a→business-a、test-key-b→business-b。\n- 验证四种输入：空 key、未知 key、已知 key、请求试图自行指定其他 business。\n- 不需要搭完整 Spring；先用构造方法把鉴权对象传给最小网关。\n- 画出“自己 new 对象”和“容器管理对象”的区别。\n\n**补基础**\n- @Component、@Service、@Resource、构造器注入的基本作用。\n- 认证“你是谁”、授权“你能做什么”的区别。\n\n**产出与验收**\n- 一张输入／预期结果表，实际跑出四种结果。\n- 能解释为什么不能直接相信请求传来的 business。\n- 能解释 @Service 不会自动让代码具备线程安全。\n\n**最低任务**\n- 说明 business 在哪一行被赋值，后面谁依赖它。","html":"\u003cp>\u003cstrong>读什么\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/auth/AbstractAuth.java\">G4 · 鉴权 AbstractAuth \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的 execute()、doExecute()。\u003c/li>\u003cli>在 IDE 中查 AbstractAuth 的具体子类，确认当前注入的是哪一个；如果需要环境条件，记录条件。\u003c/li>\u003cli>回到 \u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/Pipeline.java\">G2 · 主编排 Pipeline \u003cspan>复制路径 ↗\u003c/span>\u003c/button>，看 auth 从哪里注入、鉴权后哪些请求字段改变。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>动手\u003c/strong>\u003c/p>\n\u003cul>\u003cli>用内存 Map 模拟 test-key-a→business-a、test-key-b→business-b。\u003c/li>\u003cli>验证四种输入：空 key、未知 key、已知 key、请求试图自行指定其他 business。\u003c/li>\u003cli>不需要搭完整 Spring；先用构造方法把鉴权对象传给最小网关。\u003c/li>\u003cli>画出“自己 new 对象”和“容器管理对象”的区别。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>补基础\u003c/strong>\u003c/p>\n\u003cul>\u003cli>@Component、@Service、@Resource、构造器注入的基本作用。\u003c/li>\u003cli>认证“你是谁”、授权“你能做什么”的区别。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>产出与验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>一张输入／预期结果表，实际跑出四种结果。\u003c/li>\u003cli>能解释为什么不能直接相信请求传来的 business。\u003c/li>\u003cli>能解释 @Service 不会自动让代码具备线程安全。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>最低任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>说明 business 在哪一行被赋值，后面谁依赖它。\u003c/li>\u003c/ul>"},{"id":4,"title":"限流：先看实现，再背算法","week":1,"body":"**读什么**\n- G5 的 execute()，找到具体 doExecute()。\n- 判断它实际限制哪个维度、状态放哪里、失败如何返回。\n- 如果只找到抽象入口，结论就写“尚未验证实际限流算法”，不要根据类名推断。\n\n**动手**\n- 写一个只用于练习的固定窗口限流器：每个 business 每 1 秒最多 3 次。\n- 同一时间模拟 business-a 连续 5 次、business-b 连续 2 次。\n- 为可重复验证，让检查方法接收 nowMillis，不必真的等待一分钟。\n- 记录单机状态与多实例状态的区别；这天不要求实现分布式限流。\n\n**补基础**\n- HashMap、ConcurrentHashMap、AtomicInteger。\n- 查一次再写一次为什么不必然是原子操作；容器线程安全不等于组合逻辑线程安全。\n\n**产出与验收**\n- 两个 business 相互隔离的运行记录。\n- 说明固定窗口边界可能出现怎样的突发流量。\n- 区分每秒请求数和同时进行的请求数；了解 RPM、TPM 的含义即可。\n\n**最低任务**\n- 找到实际限流实现，写清 key、计数、时间窗口三个信息。","html":"\u003cp>\u003cstrong>读什么\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/limit/AbstractLimit.java\">G5 · 限流 AbstractLimit \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的 execute()，找到具体 doExecute()。\u003c/li>\u003cli>判断它实际限制哪个维度、状态放哪里、失败如何返回。\u003c/li>\u003cli>如果只找到抽象入口，结论就写“尚未验证实际限流算法”，不要根据类名推断。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>动手\u003c/strong>\u003c/p>\n\u003cul>\u003cli>写一个只用于练习的固定窗口限流器：每个 business 每 1 秒最多 3 次。\u003c/li>\u003cli>同一时间模拟 business-a 连续 5 次、business-b 连续 2 次。\u003c/li>\u003cli>为可重复验证，让检查方法接收 nowMillis，不必真的等待一分钟。\u003c/li>\u003cli>记录单机状态与多实例状态的区别；这天不要求实现分布式限流。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>补基础\u003c/strong>\u003c/p>\n\u003cul>\u003cli>HashMap、ConcurrentHashMap、AtomicInteger。\u003c/li>\u003cli>查一次再写一次为什么不必然是原子操作；容器线程安全不等于组合逻辑线程安全。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>产出与验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>两个 business 相互隔离的运行记录。\u003c/li>\u003cli>说明固定窗口边界可能出现怎样的突发流量。\u003c/li>\u003cli>区分每秒请求数和同时进行的请求数；了解 RPM、TPM 的含义即可。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>最低任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>找到实际限流实现，写清 key、计数、时间窗口三个信息。\u003c/li>\u003c/ul>"},{"id":5,"title":"路由、配置和非流式成功／失败","week":1,"body":"**读什么**\n- G3 的 route()、findProviders()。\n- G8 的 getProviderMoaiClient() 与一个具体 getMoaiClient()。\n- G6 的 doExecute()、doExecuteInternal()，只追正常路径和一条异常路径。\n\n**动手**\n- 配置 business-a/model-a→fake-a、business-b/model-a→fake-b。\n- 分别验证未知业务、未知模型、未知处理器、模型抛异常。\n- 画清三层：逻辑模型配置、厂商管理器、最终调用的 Client。\n- 给请求加一个 traceId，使同一次请求的各条日志能关联。\n\n**补基础**\n- Map 嵌套查找、空值处理、受检异常与运行时异常、try/catch/finally。\n- 为什么 finally 适合做收尾，但里面再抛异常可能掩盖原异常。\n\n**产出与验收**\n- 一张路由表示例和一张错误映射表。\n- 能回答：route() 先取一个 Provider 配置，与后续具体 Client 的选择是什么关系？必须找到代码证据。\n\n**最低任务**\n- 给一个虚构请求，手动沿 Map 查到路由结果。","html":"\u003cp>\u003cstrong>读什么\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/ModelRouter.java\">G3 · 模型路由 ModelRouter \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的 route()、findProviders()。\u003c/li>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/client/ProviderMoaiClient.java\">G8 · 客户端管理 ProviderMoaiClient \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的 getProviderMoaiClient() 与一个具体 getMoaiClient()。\u003c/li>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/process/ChatProcessor.java\">G6 · 非流式 ChatProcessor \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的 doExecute()、doExecuteInternal()，只追正常路径和一条异常路径。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>动手\u003c/strong>\u003c/p>\n\u003cul>\u003cli>配置 business-a/model-a→fake-a、business-b/model-a→fake-b。\u003c/li>\u003cli>分别验证未知业务、未知模型、未知处理器、模型抛异常。\u003c/li>\u003cli>画清三层：逻辑模型配置、厂商管理器、最终调用的 Client。\u003c/li>\u003cli>给请求加一个 traceId，使同一次请求的各条日志能关联。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>补基础\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Map 嵌套查找、空值处理、受检异常与运行时异常、try/catch/finally。\u003c/li>\u003cli>为什么 finally 适合做收尾，但里面再抛异常可能掩盖原异常。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>产出与验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>一张路由表示例和一张错误映射表。\u003c/li>\u003cli>能回答：route() 先取一个 Provider 配置，与后续具体 Client 的选择是什么关系？必须找到代码证据。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>最低任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>给一个虚构请求，手动沿 Map 查到路由结果。\u003c/li>\u003c/ul>"},{"id":6,"title":"周六练习：最小网关 v1","week":1,"body":"**目标，2—3 小时**\n做一个普通 Java 程序，能读固定请求对象并返回结果；HTTP、数据库、配置中心都不是本周必需。\n\n**依次完成**\n1. Request：key、model、text。\n2. AuthService：校验 key，确定 business。\n3. RateLimiter：按 business 限流。\n4. Router：按 business 和 model 找 ModelClient。\n5. 两个 FakeModelClient：一个正常返回，一个可配置抛异常。\n6. Gateway：统一编排，返回成功或错误结果。\n7. 日志：至少包含 traceId、阶段、耗时和最终状态。\n\n**必须验证的场景**\n- 正常请求、空 key、未知 key、未知模型、超过限额、模型异常。\n- 鉴权失败后不得调用模型；用调用计数验证。\n- business-a 的限额不能消耗 business-b 的额度。\n\n**验收**\n- 自己从请求对象追到最终结果，讲清每一步。\n- 能指出这个练习暂时缺少什么，例如多实例限流、配置更新、真实 HTTP Client。\n- 不要求复刻公司完整设计，不需要前端页面。\n\n**卡住时的降级**\n只保留鉴权、路由、两种模型和错误返回，把限流放到下一次补；记录未完成项。","html":"\u003cp>\u003cstrong>目标，2—3 小时\u003c/strong>\u003c/p>\n\u003cp>做一个普通 Java 程序，能读固定请求对象并返回结果；HTTP、数据库、配置中心都不是本周必需。\u003c/p>\n\u003cp>\u003cstrong>依次完成\u003c/strong>\u003c/p>\n\u003col>\u003cli>Request：key、model、text。\u003c/li>\u003cli>AuthService：校验 key，确定 business。\u003c/li>\u003cli>RateLimiter：按 business 限流。\u003c/li>\u003cli>Router：按 business 和 model 找 ModelClient。\u003c/li>\u003cli>两个 FakeModelClient：一个正常返回，一个可配置抛异常。\u003c/li>\u003cli>Gateway：统一编排，返回成功或错误结果。\u003c/li>\u003cli>日志：至少包含 traceId、阶段、耗时和最终状态。\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>必须验证的场景\u003c/strong>\u003c/p>\n\u003cul>\u003cli>正常请求、空 key、未知 key、未知模型、超过限额、模型异常。\u003c/li>\u003cli>鉴权失败后不得调用模型；用调用计数验证。\u003c/li>\u003cli>business-a 的限额不能消耗 business-b 的额度。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>自己从请求对象追到最终结果，讲清每一步。\u003c/li>\u003cli>能指出这个练习暂时缺少什么，例如多实例限流、配置更新、真实 HTTP Client。\u003c/li>\u003cli>不要求复刻公司完整设计，不需要前端页面。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>卡住时的降级\u003c/strong>\u003c/p>\n\u003cp>只保留鉴权、路由、两种模型和错误返回，把限流放到下一次补；记录未完成项。\u003c/p>"},{"id":7,"title":"周日复盘：检查第一周是否真的学会","week":1,"body":"**30—60 分钟**\n- 合上代码，重画网关链路，与 Day 01 比较。\n- 用 3 分钟讲一次成功请求，用 2 分钟讲一次鉴权失败。\n- 重做本周最不确定的一个场景；其余遗漏先记录。\n- 给五项能力各打 0—3 分：语法、调用链、鉴权、路由、异常。评分规则见后文。\n- 下周开始前至少保证：最小网关正常和失败路径都能运行。\n\n**最低任务**\n- 录一段 2 分钟解释，找出自己卡住的一个地方。","html":"\u003cp>\u003cstrong>30—60 分钟\u003c/strong>\u003c/p>\n\u003cul>\u003cli>合上代码，重画网关链路，与 Day 01 比较。\u003c/li>\u003cli>用 3 分钟讲一次成功请求，用 2 分钟讲一次鉴权失败。\u003c/li>\u003cli>重做本周最不确定的一个场景；其余遗漏先记录。\u003c/li>\u003cli>给五项能力各打 0—3 分：语法、调用链、鉴权、路由、异常。评分规则见后文。\u003c/li>\u003cli>下周开始前至少保证：最小网关正常和失败路径都能运行。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>最低任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>录一段 2 分钟解释，找出自己卡住的一个地方。\u003c/li>\u003c/ul>"},{"id":8,"title":"理解流式输出与 SSE","week":2,"body":"**读什么**\n- 对比 G6 与 G7 的 doExecute()、doExecuteInternal()。\n- 找到 SseEmitter 的创建、返回，以及实际发送数据的位置。\n- 只记录三个时刻：入口接收、第一段内容发送、流结束。\n\n**动手**\n- 最小练习每隔 200 毫秒输出一个文本片段，共 5 段。\n- 再做一次全部完成后统一输出，比较可见行为和总耗时。\n- 有可运行 Spring 环境时增加一个本地 SseEmitter 接口；否则先在控制台观察分段输出，并标注“尚未验证 HTTP/SSE”。\n\n**补基础**\n- HTTP 请求响应、长连接、SSE 事件格式、流式与非流式。\n- SSE 常用于服务端向客户端推送；不要把它等同于 WebSocket。\n- 一次底层网络 read 不一定对应一条完整 SSE 事件。\n\n**产出与验收**\n- 一张流式时间线，区分首包延迟和完整响应时间。\n- 能解释“看起来卡住”可能发生在哪些阶段。\n\n**最低任务**\n- 在 G7 中定位创建流、发送流、结束流三个位置。","html":"\u003cp>\u003cstrong>读什么\u003c/strong>\u003c/p>\n\u003cul>\u003cli>对比 \u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/process/ChatProcessor.java\">G6 · 非流式 ChatProcessor \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 与 \u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/process/ChatStreamProcessor.java\">G7 · 流式 ChatStreamProcessor \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的 doExecute()、doExecuteInternal()。\u003c/li>\u003cli>找到 SseEmitter 的创建、返回，以及实际发送数据的位置。\u003c/li>\u003cli>只记录三个时刻：入口接收、第一段内容发送、流结束。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>动手\u003c/strong>\u003c/p>\n\u003cul>\u003cli>最小练习每隔 200 毫秒输出一个文本片段，共 5 段。\u003c/li>\u003cli>再做一次全部完成后统一输出，比较可见行为和总耗时。\u003c/li>\u003cli>有可运行 Spring 环境时增加一个本地 SseEmitter 接口；否则先在控制台观察分段输出，并标注“尚未验证 HTTP/SSE”。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>补基础\u003c/strong>\u003c/p>\n\u003cul>\u003cli>HTTP 请求响应、长连接、SSE 事件格式、流式与非流式。\u003c/li>\u003cli>SSE 常用于服务端向客户端推送；不要把它等同于 WebSocket。\u003c/li>\u003cli>一次底层网络 read 不一定对应一条完整 SSE 事件。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>产出与验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>一张流式时间线，区分首包延迟和完整响应时间。\u003c/li>\u003cli>能解释“看起来卡住”可能发生在哪些阶段。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>最低任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>在 \u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/process/ChatStreamProcessor.java\">G7 · 流式 ChatStreamProcessor \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 中定位创建流、发送流、结束流三个位置。\u003c/li>\u003c/ul>"},{"id":9,"title":"线程池与任务提交","week":2,"body":"**读什么**\n- 在 G7 找到提交流处理任务的位置，追到使用的执行器。\n- 记录 Controller 线程和处理流的线程是否相同；没有运行证据时写“根据调用关系推测”。\n\n**动手**\n- 建一个有界 ThreadPoolExecutor，打印线程名。\n- 提交 6 个慢任务，使用较小线程数和队列，让排队可见。\n- 观察任务开始顺序、等待时间、拒绝策略；结束时关闭线程池。\n\n**补基础**\n- execute 与 submit、Runnable 与 Callable、Future。\n- 核心线程、最大线程、队列和拒绝策略的关系。\n- 不先背 CPU 核数公式；根据任务是 CPU 计算还是 IO 等待分析。\n\n**产出与验收**\n- 一张“提交→排队→运行→结束”的表。\n- 能解释队列满时会发生什么。\n- 知道 CallerRunsPolicy 可能让提交任务的线程执行工作，影响入口延迟。\n\n**最低任务**\n- 写一个两线程执行四任务的例子，打印线程名。","html":"\u003cp>\u003cstrong>读什么\u003c/strong>\u003c/p>\n\u003cul>\u003cli>在 \u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/process/ChatStreamProcessor.java\">G7 · 流式 ChatStreamProcessor \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 找到提交流处理任务的位置，追到使用的执行器。\u003c/li>\u003cli>记录 Controller 线程和处理流的线程是否相同；没有运行证据时写“根据调用关系推测”。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>动手\u003c/strong>\u003c/p>\n\u003cul>\u003cli>建一个有界 ThreadPoolExecutor，打印线程名。\u003c/li>\u003cli>提交 6 个慢任务，使用较小线程数和队列，让排队可见。\u003c/li>\u003cli>观察任务开始顺序、等待时间、拒绝策略；结束时关闭线程池。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>补基础\u003c/strong>\u003c/p>\n\u003cul>\u003cli>execute 与 submit、Runnable 与 Callable、Future。\u003c/li>\u003cli>核心线程、最大线程、队列和拒绝策略的关系。\u003c/li>\u003cli>不先背 CPU 核数公式；根据任务是 CPU 计算还是 IO 等待分析。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>产出与验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>一张“提交→排队→运行→结束”的表。\u003c/li>\u003cli>能解释队列满时会发生什么。\u003c/li>\u003cli>知道 CallerRunsPolicy 可能让提交任务的线程执行工作，影响入口延迟。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>最低任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>写一个两线程执行四任务的例子，打印线程名。\u003c/li>\u003c/ul>"},{"id":10,"title":"生产者、消费者与队列","week":2,"body":"**读什么**\n- G9 的数据入队、取数据、结束和异常处理。\n- 区分上游网络回调线程与下游消费线程。\n- 核实队列是否有界，不根据名字推断。\n\n**动手**\n- 生产者每 50 毫秒产生一段内容，消费者每 200 毫秒消费一段。\n- 使用容量 3 的有界队列，记录阻塞或拒绝行为。\n- 实现明确的完成信号和失败信号，让消费者不会永久等待。\n- 比较慢消费者下无限积压与有界队列两种结果。\n\n**补基础**\n- BlockingQueue、put/take、offer/poll、背压的基本含义。\n- 结束标志要与正常数据区分，异常要能传给消费者。\n\n**产出与验收**\n- 一段队列长度随时间变化的日志。\n- 能解释“上游结束，但消费者一直等待”的一种原因。\n\n**最低任务**\n- 找到消费者怎样知道流结束；若找不到，明确记录疑问。","html":"\u003cp>\u003cstrong>读什么\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/protocol/stream/GatewayStreamSink.java\">G9 · 流桥接 GatewayStreamSink \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的数据入队、取数据、结束和异常处理。\u003c/li>\u003cli>区分上游网络回调线程与下游消费线程。\u003c/li>\u003cli>核实队列是否有界，不根据名字推断。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>动手\u003c/strong>\u003c/p>\n\u003cul>\u003cli>生产者每 50 毫秒产生一段内容，消费者每 200 毫秒消费一段。\u003c/li>\u003cli>使用容量 3 的有界队列，记录阻塞或拒绝行为。\u003c/li>\u003cli>实现明确的完成信号和失败信号，让消费者不会永久等待。\u003c/li>\u003cli>比较慢消费者下无限积压与有界队列两种结果。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>补基础\u003c/strong>\u003c/p>\n\u003cul>\u003cli>BlockingQueue、put/take、offer/poll、背压的基本含义。\u003c/li>\u003cli>结束标志要与正常数据区分，异常要能传给消费者。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>产出与验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>一段队列长度随时间变化的日志。\u003c/li>\u003cli>能解释“上游结束，但消费者一直等待”的一种原因。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>最低任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>找到消费者怎样知道流结束；若找不到，明确记录疑问。\u003c/li>\u003c/ul>"},{"id":11,"title":"超时、取消和真正停止","week":2,"body":"**读什么**\n- G10 的 watch()、cancel()。\n- G7 中超时参数、watchdog 与清理逻辑的连接。\n- 区分定时关闭资源与取消定时器；两者不是同一件事。\n\n**动手**\n- 场景 A：任务 sleep，捕获中断后记录并结束。\n- 场景 B：任务忽略中断继续循环，用短时运行和明确退出条件避免失控。\n- 调用 Future.cancel(true)，分别记录 Future 状态与任务是否真正停止。\n- 用假 Closeable 标记资源是否关闭，超时与正常结束都要检查。\n\n**补基础**\n- InterruptedException、中断标志、协作式取消。\n- connect timeout、read timeout、总体 deadline 解决不同问题。\n- 计算同一进程的经过时间时，理解单调时钟与墙上时间的差别。\n\n**产出与验收**\n- 一张“Future 已取消／代码已退出／资源已关闭”的三列表。\n- 能解释为什么 cancel(true) 不保证网络 IO 或任意任务立即停止。\n\n**最低任务**\n- 写一个能响应中断的任务，取消后看到退出日志。","html":"\u003cp>\u003cstrong>读什么\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/protocol/stream/StreamWatchdog.java\">G10 · 流超时 StreamWatchdog \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的 watch()、cancel()。\u003c/li>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/process/ChatStreamProcessor.java\">G7 · 流式 ChatStreamProcessor \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 中超时参数、watchdog 与清理逻辑的连接。\u003c/li>\u003cli>区分定时关闭资源与取消定时器；两者不是同一件事。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>动手\u003c/strong>\u003c/p>\n\u003cul>\u003cli>场景 A：任务 sleep，捕获中断后记录并结束。\u003c/li>\u003cli>场景 B：任务忽略中断继续循环，用短时运行和明确退出条件避免失控。\u003c/li>\u003cli>调用 Future.cancel(true)，分别记录 Future 状态与任务是否真正停止。\u003c/li>\u003cli>用假 Closeable 标记资源是否关闭，超时与正常结束都要检查。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>补基础\u003c/strong>\u003c/p>\n\u003cul>\u003cli>InterruptedException、中断标志、协作式取消。\u003c/li>\u003cli>connect timeout、read timeout、总体 deadline 解决不同问题。\u003c/li>\u003cli>计算同一进程的经过时间时，理解单调时钟与墙上时间的差别。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>产出与验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>一张“Future 已取消／代码已退出／资源已关闭”的三列表。\u003c/li>\u003cli>能解释为什么 cancel(true) 不保证网络 IO 或任意任务立即停止。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>最低任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>写一个能响应中断的任务，取消后看到退出日志。\u003c/li>\u003c/ul>"},{"id":12,"title":"流结束、幂等收尾与监控","week":2,"body":"**读什么**\n- G7 的 finalizeStream() 与正常结束、异常、超时之间的关系。\n- G12 记录什么健康信息；先区分观测指标与实际摘除策略。\n\n**动手**\n- 在练习中故意让正常结束和超时回调接近同时发生。\n- 使用原子状态或等价机制保证“终态统计、释放资源”只执行一次。\n- 输出请求数、成功数、失败数、首段延迟、总耗时。\n- 想清楚用户取消应该归类为什么；写出定义而不是随意当成功。\n\n**补基础**\n- AtomicBoolean.compareAndSet、幂等、状态机。\n- 平均耗时与长尾延迟的区别；样本少时不要声称 p99 稳定。\n\n**产出与验收**\n- 重复触发终止时，收尾计数仍为 1。\n- 能说明流已发送部分内容后，错误处理为什么不同于普通 JSON 响应。\n\n**最低任务**\n- 找出一条正常终止路径和一条异常终止路径。","html":"\u003cp>\u003cstrong>读什么\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/process/ChatStreamProcessor.java\">G7 · 流式 ChatStreamProcessor \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的 finalizeStream() 与正常结束、异常、超时之间的关系。\u003c/li>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/llm-proxy-moa/llm-proxy-moa-service/src/main/java/com/immomo/moai/service/pipeline/client/bean/ClientHealthCounter.java\">G12 · 健康计数 ClientHealthCounter \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 记录什么健康信息；先区分观测指标与实际摘除策略。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>动手\u003c/strong>\u003c/p>\n\u003cul>\u003cli>在练习中故意让正常结束和超时回调接近同时发生。\u003c/li>\u003cli>使用原子状态或等价机制保证“终态统计、释放资源”只执行一次。\u003c/li>\u003cli>输出请求数、成功数、失败数、首段延迟、总耗时。\u003c/li>\u003cli>想清楚用户取消应该归类为什么；写出定义而不是随意当成功。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>补基础\u003c/strong>\u003c/p>\n\u003cul>\u003cli>AtomicBoolean.compareAndSet、幂等、状态机。\u003c/li>\u003cli>平均耗时与长尾延迟的区别；样本少时不要声称 p99 稳定。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>产出与验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>重复触发终止时，收尾计数仍为 1。\u003c/li>\u003cli>能说明流已发送部分内容后，错误处理为什么不同于普通 JSON 响应。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>最低任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>找出一条正常终止路径和一条异常终止路径。\u003c/li>\u003c/ul>"},{"id":13,"title":"周六练习：流式网关 v2 与故障表","week":2,"body":"**2—3 小时**\n在 v1 上增加假流式模型，先用内存回调／迭代器；环境具备时再接本地 SSE。\n\n**验证场景**\n1. 正常输出 5 段并结束。\n2. 输出 2 段后抛异常。\n3. 上游一直不返回首段。\n4. 首段很快，但后续停滞。\n5. 消费者非常慢。\n6. 消费者在第 2 段主动退出。\n7. 超时与正常结束同时触发。\n\n**每个场景记录**\n- 用户看到什么？\n- 任务是否结束？多久结束？\n- 队列和资源是否释放？\n- 统计是否重复？\n- 证据来自实际日志还是源码推断？\n\n**验收**\n至少完成场景 1、2、3、6。尚未接真实 HTTP 时，明确区分“模拟消费者退出”和“浏览器断连”，后者留到 HTTP 验证。","html":"\u003cp>\u003cstrong>2—3 小时\u003c/strong>\u003c/p>\n\u003cp>在 v1 上增加假流式模型，先用内存回调／迭代器；环境具备时再接本地 SSE。\u003c/p>\n\u003cp>\u003cstrong>验证场景\u003c/strong>\u003c/p>\n\u003col>\u003cli>正常输出 5 段并结束。\u003c/li>\u003cli>输出 2 段后抛异常。\u003c/li>\u003cli>上游一直不返回首段。\u003c/li>\u003cli>首段很快，但后续停滞。\u003c/li>\u003cli>消费者非常慢。\u003c/li>\u003cli>消费者在第 2 段主动退出。\u003c/li>\u003cli>超时与正常结束同时触发。\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>每个场景记录\u003c/strong>\u003c/p>\n\u003cul>\u003cli>用户看到什么？\u003c/li>\u003cli>任务是否结束？多久结束？\u003c/li>\u003cli>队列和资源是否释放？\u003c/li>\u003cli>统计是否重复？\u003c/li>\u003cli>证据来自实际日志还是源码推断？\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>验收\u003c/strong>\u003c/p>\n\u003cp>至少完成场景 1、2、3、6。尚未接真实 HTTP 时，明确区分“模拟消费者退出”和“浏览器断连”，后者留到 HTTP 验证。\u003c/p>"},{"id":14,"title":"周日复盘：用一次卡顿解释整条链路","week":2,"body":"**30—60 分钟**\n- 画“客户端→网关→上游模型→返回流”的线程和资源关系。\n- 回答：首段慢、后续慢、下游慢分别看什么？\n- 找一处上周的真实理解错误，写下修正后的证据。\n- 复做 Day 11 的取消例子，避免只记住 API 名。\n\n**进入下一周的门槛**\n能解释流式生命周期，并能用练习证明正常、失败、取消三种结束。做不到就多留 2—3 天。","html":"\u003cp>\u003cstrong>30—60 分钟\u003c/strong>\u003c/p>\n\u003cul>\u003cli>画“客户端→网关→上游模型→返回流”的线程和资源关系。\u003c/li>\u003cli>回答：首段慢、后续慢、下游慢分别看什么？\u003c/li>\u003cli>找一处上周的真实理解错误，写下修正后的证据。\u003c/li>\u003cli>复做 Day 11 的取消例子，避免只记住 API 名。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>进入下一周的门槛\u003c/strong>\u003c/p>\n\u003cp>能解释流式生命周期，并能用练习证明正常、失败、取消三种结束。做不到就多留 2—3 天。\u003c/p>"},{"id":15,"title":"图、节点和执行器","week":3,"body":"**读什么**\n- W1 的 build()：前驱、后继、节点集合、startNode 如何建立。\n- W3 的 run() 与 _run()。\n- W5、W6 各看一个最主要方法。\n\n**动手**\n- 手画 A→B→C。\n- 用 Map\u003cString, Node> 存节点、Map\u003cString, List\u003cString>> 存后继。\n- 写出节点输入、输出、状态三个概念；不要把整份 DSL 都抄下来。\n\n**补基础**\n- 图、顶点、边、有向图、DAG、入度、邻接表。\n- 用 5 个节点手动计算入度，练一次拓扑排序。\n\n**产出与验收**\n- 给任意一个节点，说出它的前驱、后继和何时能运行。\n- 能解释为什么有环的任务图可能无法按普通 DAG 规则完成。\n\n**最低任务**\n- 找到图的 nodes 和 edges 在哪里转换为运行结构。","html":"\u003cp>\u003cstrong>读什么\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/WorkflowRunner.java\">W1 · 执行器 WorkflowRunner \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的 build()：前驱、后继、节点集合、startNode 如何建立。\u003c/li>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/nodes/BaseNode.java\">W3 · 节点基类 BaseNode \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的 run() 与 _run()。\u003c/li>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/nodes/start/StartNode.java\">W5 · StartNode \u003cspan>复制路径 ↗\u003c/span>\u003c/button>、\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/nodes/end/EndNode.java\">W6 · EndNode \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 各看一个最主要方法。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>动手\u003c/strong>\u003c/p>\n\u003cul>\u003cli>手画 A→B→C。\u003c/li>\u003cli>用 Map&lt;String, Node&gt; 存节点、Map&lt;String, List&lt;String&gt;&gt; 存后继。\u003c/li>\u003cli>写出节点输入、输出、状态三个概念；不要把整份 DSL 都抄下来。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>补基础\u003c/strong>\u003c/p>\n\u003cul>\u003cli>图、顶点、边、有向图、DAG、入度、邻接表。\u003c/li>\u003cli>用 5 个节点手动计算入度，练一次拓扑排序。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>产出与验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>给任意一个节点，说出它的前驱、后继和何时能运行。\u003c/li>\u003cli>能解释为什么有环的任务图可能无法按普通 DAG 规则完成。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>最低任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>找到图的 nodes 和 edges 在哪里转换为运行结构。\u003c/li>\u003c/ul>"},{"id":16,"title":"一次执行的状态与变量","week":3,"body":"**读什么**\n- W1 的 runWithTaskId()：在哪里创建 W2。\n- W2 的构造方法和关键字段。\n- W4 的变量存取，选一处节点读输入、一处写输出。\n\n**动手**\n- 同一个工作流定义，模拟 request-a 与 request-b 并行执行。\n- 两个请求分别传不同文本，确认输出没有混用。\n- 明确区分可共享的工作流定义和每次执行独立的 RunContext。\n\n**补基础**\n- 对象生命周期、共享可变状态、浅拷贝与深拷贝。\n- ConcurrentHashMap 不能保护放进去的任意可变对象。\n\n**产出与验收**\n- 一张字段归属表：全局配置／工作流定义／本次执行／单节点局部。\n- 能解释把当前请求输出存在共享节点字段中可能有什么问题。\n\n**最低任务**\n- 找到每次执行独立创建状态对象的代码位置。","html":"\u003cp>\u003cstrong>读什么\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/WorkflowRunner.java\">W1 · 执行器 WorkflowRunner \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的 runWithTaskId()：在哪里创建 \u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/entities/WorkflowRunState.java\">W2 · 请求状态 WorkflowRunState \u003cspan>复制路径 ↗\u003c/span>\u003c/button>。\u003c/li>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/entities/WorkflowRunState.java\">W2 · 请求状态 WorkflowRunState \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的构造方法和关键字段。\u003c/li>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/entities/VariablePool.java\">W4 · 变量池 VariablePool \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的变量存取，选一处节点读输入、一处写输出。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>动手\u003c/strong>\u003c/p>\n\u003cul>\u003cli>同一个工作流定义，模拟 request-a 与 request-b 并行执行。\u003c/li>\u003cli>两个请求分别传不同文本，确认输出没有混用。\u003c/li>\u003cli>明确区分可共享的工作流定义和每次执行独立的 RunContext。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>补基础\u003c/strong>\u003c/p>\n\u003cul>\u003cli>对象生命周期、共享可变状态、浅拷贝与深拷贝。\u003c/li>\u003cli>ConcurrentHashMap 不能保护放进去的任意可变对象。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>产出与验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>一张字段归属表：全局配置／工作流定义／本次执行／单节点局部。\u003c/li>\u003cli>能解释把当前请求输出存在共享节点字段中可能有什么问题。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>最低任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>找到每次执行独立创建状态对象的代码位置。\u003c/li>\u003c/ul>"},{"id":17,"title":"串行执行与节点结果","week":3,"body":"**读什么**\n- W1 的 run(state, node) 主干。\n- W3 的 run() 怎样包装具体节点的执行结果。\n- 暂时跳过迭代、分支重置、多模态等复杂路径。\n\n**动手**\n- 写 Start、Uppercase、End 三种假节点。\n- 执行 hello→HELLO，变量通过 RunContext 传递。\n- 定义最少状态：PENDING、RUNNING、SUCCEEDED、FAILED。\n- 注入一个失败节点，确认后续普通节点不会继续执行。\n\n**补基础**\n- 枚举、状态转换、错误传播。\n- 区分节点失败与整个工作流失败，先明确练习的规则。\n\n**产出与验收**\n- 每个节点的开始、结束、结果记录。\n- 不看源码，能手写串行执行伪代码。\n\n**最低任务**\n- 从 StartNode 追到下一个节点被执行的位置。","html":"\u003cp>\u003cstrong>读什么\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/WorkflowRunner.java\">W1 · 执行器 WorkflowRunner \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的 run(state, node) 主干。\u003c/li>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/nodes/BaseNode.java\">W3 · 节点基类 BaseNode \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的 run() 怎样包装具体节点的执行结果。\u003c/li>\u003cli>暂时跳过迭代、分支重置、多模态等复杂路径。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>动手\u003c/strong>\u003c/p>\n\u003cul>\u003cli>写 Start、Uppercase、End 三种假节点。\u003c/li>\u003cli>执行 hello→HELLO，变量通过 RunContext 传递。\u003c/li>\u003cli>定义最少状态：PENDING、RUNNING、SUCCEEDED、FAILED。\u003c/li>\u003cli>注入一个失败节点，确认后续普通节点不会继续执行。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>补基础\u003c/strong>\u003c/p>\n\u003cul>\u003cli>枚举、状态转换、错误传播。\u003c/li>\u003cli>区分节点失败与整个工作流失败，先明确练习的规则。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>产出与验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>每个节点的开始、结束、结果记录。\u003c/li>\u003cli>不看源码，能手写串行执行伪代码。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>最低任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>从 StartNode 追到下一个节点被执行的位置。\u003c/li>\u003c/ul>"},{"id":18,"title":"并行分支与汇合","week":3,"body":"**读什么**\n- W1 中提交并行任务的位置。\n- W2 的 judgeDependent() 和依赖相关字段。\n- W11 的 testConcurrentDagConvergence()，先读测试目的再看实现。\n\n**动手**\n- 构造菱形图：A 后并行 B、C，B、C 都结束后运行 D。\n- 让 B 耗时短、C 耗时长，再互换。\n- 为 D 加计数器，重复执行并验证每次只运行一次。\n- 简化练习可以先用等待全部 Future 的方式；这不等同于通用依赖调度器，要写明范围。\n\n**补基础**\n- CountDownLatch、原子计数、临界区。\n- “检查依赖满足”和“标记节点已经调度”之间的竞态。\n\n**产出与验收**\n- 时间线证明 B、C 有执行重叠，D 在两者结束后开始。\n- 能解释仅判断入度为 0 为什么还需要避免重复调度。\n\n**最低任务**\n- 手画两条线程交错导致 D 重复执行的一种顺序。","html":"\u003cp>\u003cstrong>读什么\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/WorkflowRunner.java\">W1 · 执行器 WorkflowRunner \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 中提交并行任务的位置。\u003c/li>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/entities/WorkflowRunState.java\">W2 · 请求状态 WorkflowRunState \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的 judgeDependent() 和依赖相关字段。\u003c/li>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/test/java/com/immomo/dify/workflow/WorkflowRunStateTest.java\">W11 · 并发与超时测试 WorkflowRunStateTest \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的 testConcurrentDagConvergence()，先读测试目的再看实现。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>动手\u003c/strong>\u003c/p>\n\u003cul>\u003cli>构造菱形图：A 后并行 B、C，B、C 都结束后运行 D。\u003c/li>\u003cli>让 B 耗时短、C 耗时长，再互换。\u003c/li>\u003cli>为 D 加计数器，重复执行并验证每次只运行一次。\u003c/li>\u003cli>简化练习可以先用等待全部 Future 的方式；这不等同于通用依赖调度器，要写明范围。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>补基础\u003c/strong>\u003c/p>\n\u003cul>\u003cli>CountDownLatch、原子计数、临界区。\u003c/li>\u003cli>“检查依赖满足”和“标记节点已经调度”之间的竞态。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>产出与验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>时间线证明 B、C 有执行重叠，D 在两者结束后开始。\u003c/li>\u003cli>能解释仅判断入度为 0 为什么还需要避免重复调度。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>最低任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>手画两条线程交错导致 D 重复执行的一种顺序。\u003c/li>\u003c/ul>"},{"id":19,"title":"用测试证明并发行为","week":3,"body":"**读什么**\n- W11 中并发测试使用的启动栅栏、完成等待、断言。\n- 回到自己的并行调度代码，找一个检查与更新分离的位置。\n\n**动手**\n- 加入请求状态隔离、D 只执行一次、前驱失败阻止 D 三项验证。\n- 用 CountDownLatch 等手段让竞争可控，不依赖“sleep 刚好碰上”。\n- 重复运行能帮助发现错误，但通过 100 次不等于数学上证明没有竞态。\n\n**补基础**\n- synchronized、Lock、CAS 各解决什么问题。\n- 只选一种清楚的保护方式完成练习，不为了“高级”堆多套锁。\n\n**产出与验收**\n- 一条自己理解并能解释的并发测试。\n- 能说出锁保护哪个状态、临界区边界在哪里。\n\n**最低任务**\n- 读懂 W11 一项测试，写清准备、触发、断言。","html":"\u003cp>\u003cstrong>读什么\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/test/java/com/immomo/dify/workflow/WorkflowRunStateTest.java\">W11 · 并发与超时测试 WorkflowRunStateTest \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 中并发测试使用的启动栅栏、完成等待、断言。\u003c/li>\u003cli>回到自己的并行调度代码，找一个检查与更新分离的位置。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>动手\u003c/strong>\u003c/p>\n\u003cul>\u003cli>加入请求状态隔离、D 只执行一次、前驱失败阻止 D 三项验证。\u003c/li>\u003cli>用 CountDownLatch 等手段让竞争可控，不依赖“sleep 刚好碰上”。\u003c/li>\u003cli>重复运行能帮助发现错误，但通过 100 次不等于数学上证明没有竞态。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>补基础\u003c/strong>\u003c/p>\n\u003cul>\u003cli>synchronized、Lock、CAS 各解决什么问题。\u003c/li>\u003cli>只选一种清楚的保护方式完成练习，不为了“高级”堆多套锁。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>产出与验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>一条自己理解并能解释的并发测试。\u003c/li>\u003cli>能说出锁保护哪个状态、临界区边界在哪里。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>最低任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>读懂 \u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/test/java/com/immomo/dify/workflow/WorkflowRunStateTest.java\">W11 · 并发与超时测试 WorkflowRunStateTest \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 一项测试，写清准备、触发、断言。\u003c/li>\u003c/ul>"},{"id":20,"title":"周六练习：最小 DAG v1","week":3,"body":"**2—3 小时**\n- 支持链形 A→B→C 和菱形 A→B/C→D。\n- 每次执行独立 RunContext。\n- 假节点支持固定输出、延迟、抛异常。\n- 输出节点执行时间、线程名、状态、结果。\n- 开始前验证引用节点是否存在；尝试检测环。\n- 正常、前驱失败、并行汇合、两个请求隔离至少四种场景。\n\n**验收**\n- 运行日志能解释实际顺序，D 每次只运行一次。\n- 线程池能正常退出，程序不会因为残留线程一直不结束。\n- 写明“不支持条件分支、循环、持久化恢复”等当前范围。\n\n**降级**\n先做能运行的串行版本和固定菱形并行版本，通用任意 DAG 的调度留后续。","html":"\u003cp>\u003cstrong>2—3 小时\u003c/strong>\u003c/p>\n\u003cul>\u003cli>支持链形 A→B→C 和菱形 A→B/C→D。\u003c/li>\u003cli>每次执行独立 RunContext。\u003c/li>\u003cli>假节点支持固定输出、延迟、抛异常。\u003c/li>\u003cli>输出节点执行时间、线程名、状态、结果。\u003c/li>\u003cli>开始前验证引用节点是否存在；尝试检测环。\u003c/li>\u003cli>正常、前驱失败、并行汇合、两个请求隔离至少四种场景。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>运行日志能解释实际顺序，D 每次只运行一次。\u003c/li>\u003cli>线程池能正常退出，程序不会因为残留线程一直不结束。\u003c/li>\u003cli>写明“不支持条件分支、循环、持久化恢复”等当前范围。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>降级\u003c/strong>\u003c/p>\n\u003cp>先做能运行的串行版本和固定菱形并行版本，通用任意 DAG 的调度留后续。\u003c/p>"},{"id":21,"title":"周日复盘：把工作流讲给普通后端同事听","week":3,"body":"**30—60 分钟**\n- 3 分钟解释配置、节点、边、执行状态、变量池。\n- 画一个共享配置与请求状态分离的图。\n- 用一个失败案例说明“运行成功”与“并发正确”不是同一个标准。\n- 给自己图基础、状态隔离、并行汇合、测试四项评分。\n\n**门槛**\n能手写简单串行流程，能运行菱形图，并解释一次请求的状态放在哪里。","html":"\u003cp>\u003cstrong>30—60 分钟\u003c/strong>\u003c/p>\n\u003cul>\u003cli>3 分钟解释配置、节点、边、执行状态、变量池。\u003c/li>\u003cli>画一个共享配置与请求状态分离的图。\u003c/li>\u003cli>用一个失败案例说明“运行成功”与“并发正确”不是同一个标准。\u003c/li>\u003cli>给自己图基础、状态隔离、并行汇合、测试四项评分。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>门槛\u003c/strong>\u003c/p>\n\u003cp>能手写简单串行流程，能运行菱形图，并解释一次请求的状态放在哪里。\u003c/p>"},{"id":22,"title":"工作流总体超时预算","week":4,"body":"**读什么**\n- W1 的 calculateWaitTimeout()，看已消耗时间如何扣除。\n- W2 的 waitTask() 与取消逻辑。\n- W11 的 testWaitTaskBudgetTimeoutAndCascadeCancel()。\n\n**动手**\n- 让两个分支都需要较长时间，总预算设置为较短值。\n- 比较“每个 Future 都等待完整 timeout”和“统一 deadline，等待前扣剩余时间”。\n- 使用单调时钟计算练习中的经过时间，记录总等待与任务存活情况。\n- 超时后分别检查工作流状态、Future 状态、实际任务退出、资源关闭。\n\n**补基础**\n- 总预算、节点超时、网络读取超时不是一回事。\n- 超时只说明调用方不继续等待，不自动证明远端操作没有发生。\n- 时间断言留合理容差，不要求在繁忙机器上精确到毫秒。\n\n**产出与验收**\n- 对比两种超时方式的实际记录。\n- 能解释为什么多个任务不能各自重复使用整份总预算。\n\n**最低任务**\n- 算一遍：总预算 2 秒，前面已花 1.2 秒，接下来最多还允许等待多少。","html":"\u003cp>\u003cstrong>读什么\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/WorkflowRunner.java\">W1 · 执行器 WorkflowRunner \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的 calculateWaitTimeout()，看已消耗时间如何扣除。\u003c/li>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/entities/WorkflowRunState.java\">W2 · 请求状态 WorkflowRunState \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的 waitTask() 与取消逻辑。\u003c/li>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/test/java/com/immomo/dify/workflow/WorkflowRunStateTest.java\">W11 · 并发与超时测试 WorkflowRunStateTest \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的 testWaitTaskBudgetTimeoutAndCascadeCancel()。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>动手\u003c/strong>\u003c/p>\n\u003cul>\u003cli>让两个分支都需要较长时间，总预算设置为较短值。\u003c/li>\u003cli>比较“每个 Future 都等待完整 timeout”和“统一 deadline，等待前扣剩余时间”。\u003c/li>\u003cli>使用单调时钟计算练习中的经过时间，记录总等待与任务存活情况。\u003c/li>\u003cli>超时后分别检查工作流状态、Future 状态、实际任务退出、资源关闭。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>补基础\u003c/strong>\u003c/p>\n\u003cul>\u003cli>总预算、节点超时、网络读取超时不是一回事。\u003c/li>\u003cli>超时只说明调用方不继续等待，不自动证明远端操作没有发生。\u003c/li>\u003cli>时间断言留合理容差，不要求在繁忙机器上精确到毫秒。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>产出与验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>对比两种超时方式的实际记录。\u003c/li>\u003cli>能解释为什么多个任务不能各自重复使用整份总预算。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>最低任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>算一遍：总预算 2 秒，前面已花 1.2 秒，接下来最多还允许等待多少。\u003c/li>\u003c/ul>"},{"id":23,"title":"失败、重试、幂等和孤儿任务","week":4,"body":"**读什么**\n- 在 W1、W2 中查失败后是否阻止后续调度、如何取消已提交任务。\n- 不假设项目支持自动重试或持久化恢复；找到实现才下结论。\n\n**动手**\n- B 抛异常、C 仍在运行，观察 D 和 C 的最终状态。\n- 给假模型增加“前两次失败、第三次成功”，设置有限次数重试。\n- 再模拟“服务端已记录结果，但客户端没收到响应”，说明重复提交会发生什么。\n- 用 requestId 和内存结果表做一个最小去重；标明它不覆盖进程崩溃与多实例。\n\n**补基础**\n- 重试对象、错误分类、退避、最大次数、总预算。\n- 幂等不等于不执行，而是重复请求不会产生额外业务副作用。\n- 不把重试套在所有节点外面；发送通知、扣费等副作用要单独设计。\n\n**产出与验收**\n- 一张“可重试／不应直接重试／需要确认”的错误分类表。\n- 能说明超时后重试为什么可能重复产生业务效果。\n\n**最低任务**\n- 写一个“第一次实际成功，但客户端误认为失败”的时间线。","html":"\u003cp>\u003cstrong>读什么\u003c/strong>\u003c/p>\n\u003cul>\u003cli>在 \u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/WorkflowRunner.java\">W1 · 执行器 WorkflowRunner \u003cspan>复制路径 ↗\u003c/span>\u003c/button>、\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/entities/WorkflowRunState.java\">W2 · 请求状态 WorkflowRunState \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 中查失败后是否阻止后续调度、如何取消已提交任务。\u003c/li>\u003cli>不假设项目支持自动重试或持久化恢复；找到实现才下结论。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>动手\u003c/strong>\u003c/p>\n\u003cul>\u003cli>B 抛异常、C 仍在运行，观察 D 和 C 的最终状态。\u003c/li>\u003cli>给假模型增加“前两次失败、第三次成功”，设置有限次数重试。\u003c/li>\u003cli>再模拟“服务端已记录结果，但客户端没收到响应”，说明重复提交会发生什么。\u003c/li>\u003cli>用 requestId 和内存结果表做一个最小去重；标明它不覆盖进程崩溃与多实例。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>补基础\u003c/strong>\u003c/p>\n\u003cul>\u003cli>重试对象、错误分类、退避、最大次数、总预算。\u003c/li>\u003cli>幂等不等于不执行，而是重复请求不会产生额外业务副作用。\u003c/li>\u003cli>不把重试套在所有节点外面；发送通知、扣费等副作用要单独设计。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>产出与验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>一张“可重试／不应直接重试／需要确认”的错误分类表。\u003c/li>\u003cli>能说明超时后重试为什么可能重复产生业务效果。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>最低任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>写一个“第一次实际成功，但客户端误认为失败”的时间线。\u003c/li>\u003c/ul>"},{"id":24,"title":"条件分支与跳过状态","week":4,"body":"**读什么**\n- W2 的 resetDependent() 与 W11 的并发汇合测试。\n- 找到条件节点后只执行一条分支时，另一条分支怎样影响依赖。\n\n**动手**\n- 画 A→条件判断→B 或 C→D。\n- 明确练习语义：选中的分支成功后 D 执行，未选分支记为 SKIPPED。\n- 区分“未运行”“已跳过”“已失败”，不要都用一个 false 表示。\n- 写出条件分支和并行分支在汇合规则上的差别。\n- 本天可以只做状态推演，不强制实现通用条件调度器。\n\n**补基础**\n- 状态机终态、分支激活、依赖满足规则。\n- 不同引擎可以有不同汇合语义，必须先定义规则。\n\n**产出与验收**\n- 四张状态表：选 B、选 C、选中分支失败、条件节点失败。\n- 解释为什么等待所有原始前驱成功可能造成永久等待。\n\n**最低任务**\n- 读懂 W11 中“一个前驱完成、另一分支跳过”的测试目的。","html":"\u003cp>\u003cstrong>读什么\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/entities/WorkflowRunState.java\">W2 · 请求状态 WorkflowRunState \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的 resetDependent() 与 \u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/test/java/com/immomo/dify/workflow/WorkflowRunStateTest.java\">W11 · 并发与超时测试 WorkflowRunStateTest \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的并发汇合测试。\u003c/li>\u003cli>找到条件节点后只执行一条分支时，另一条分支怎样影响依赖。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>动手\u003c/strong>\u003c/p>\n\u003cul>\u003cli>画 A→条件判断→B 或 C→D。\u003c/li>\u003cli>明确练习语义：选中的分支成功后 D 执行，未选分支记为 SKIPPED。\u003c/li>\u003cli>区分“未运行”“已跳过”“已失败”，不要都用一个 false 表示。\u003c/li>\u003cli>写出条件分支和并行分支在汇合规则上的差别。\u003c/li>\u003cli>本天可以只做状态推演，不强制实现通用条件调度器。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>补基础\u003c/strong>\u003c/p>\n\u003cul>\u003cli>状态机终态、分支激活、依赖满足规则。\u003c/li>\u003cli>不同引擎可以有不同汇合语义，必须先定义规则。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>产出与验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>四张状态表：选 B、选 C、选中分支失败、条件节点失败。\u003c/li>\u003cli>解释为什么等待所有原始前驱成功可能造成永久等待。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>最低任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>读懂 \u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/test/java/com/immomo/dify/workflow/WorkflowRunStateTest.java\">W11 · 并发与超时测试 WorkflowRunStateTest \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 中“一个前驱完成、另一分支跳过”的测试目的。\u003c/li>\u003c/ul>"},{"id":25,"title":"Agent 与工具调用：最小循环","week":4,"body":"**读什么**\n- W7 如何从变量构造模型请求、处理返回。\n- 在项目中搜索工具调用入口，记录是否真的支持循环调用；目录或类名不能单独证明。\n\n**动手**\n- 定义一个虚构工具 getOrderStatus(orderId)，用内存 Map 返回订单状态。\n- 假模型第一轮返回“调用此工具”的结构，程序验证工具名和参数后执行。\n- 把工具结果带回假模型，第二轮返回最终文本。\n- 增加最大轮数、总体超时、未知工具、错误参数四个约束。\n- 不需要真实模型账号，也不需要实现多智能体协作。\n\n**补基础**\n- 模型产生工具调用请求，后端负责校验和执行。\n- 工具结果要与调用 ID 对应，避免多调用混淆。\n- 工作流通常按预定义图执行；Agent 的后续行动可以根据模型输出动态决定，两者可以组合。\n\n**产出与验收**\n- 一张“模型→工具请求→执行→工具结果→模型”的时序图。\n- 能解释为什么只调用一次模型，不足以说明实现了有工具循环的 Agent。\n\n**最低任务**\n- 用伪代码写出一个最多三轮的工具循环。","html":"\u003cp>\u003cstrong>读什么\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/nodes/llm/LLMNode.java\">W7 · LLMNode \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 如何从变量构造模型请求、处理返回。\u003c/li>\u003cli>在项目中搜索工具调用入口，记录是否真的支持循环调用；目录或类名不能单独证明。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>动手\u003c/strong>\u003c/p>\n\u003cul>\u003cli>定义一个虚构工具 getOrderStatus(orderId)，用内存 Map 返回订单状态。\u003c/li>\u003cli>假模型第一轮返回“调用此工具”的结构，程序验证工具名和参数后执行。\u003c/li>\u003cli>把工具结果带回假模型，第二轮返回最终文本。\u003c/li>\u003cli>增加最大轮数、总体超时、未知工具、错误参数四个约束。\u003c/li>\u003cli>不需要真实模型账号，也不需要实现多智能体协作。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>补基础\u003c/strong>\u003c/p>\n\u003cul>\u003cli>模型产生工具调用请求，后端负责校验和执行。\u003c/li>\u003cli>工具结果要与调用 ID 对应，避免多调用混淆。\u003c/li>\u003cli>工作流通常按预定义图执行；Agent 的后续行动可以根据模型输出动态决定，两者可以组合。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>产出与验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>一张“模型→工具请求→执行→工具结果→模型”的时序图。\u003c/li>\u003cli>能解释为什么只调用一次模型，不足以说明实现了有工具循环的 Agent。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>最低任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>用伪代码写出一个最多三轮的工具循环。\u003c/li>\u003c/ul>"},{"id":26,"title":"RAG：从查询到可用上下文","week":4,"body":"**读什么**\n- W8→W9 的检索主链路。\n- W10 的 search()、mergeAndSortResults()，核对注释与实际执行顺序。\n- 查 KNN 和文本检索的参数用途，不深入 ES 全部实现。\n\n**动手**\n- 建 8—12 条虚构知识，例如请假、报销、设备申请规则。\n- 用关键词匹配或手工构造的检索结果做最小召回。\n- 准备 8 个问题，包含明确命中、同义表达、没有答案、过期知识四类。\n- 记录命中文档、是否包含正确证据、如何处理无结果。\n- 没有实际 Embedding 就标注“尚未实现向量检索”，不要把模拟分数叫真实语义相似度。\n\n**补基础**\n- 切分、Embedding、关键词／向量召回、融合、重排、上下文构建。\n- 向量分数和关键词分数可能尺度不同，简单加权并非天然合理。\n- RAG 需要评估检索和回答两个阶段；不能只看某次回复像不像。\n\n**产出与验收**\n- 一张 8 题小评测表，描述失误和可能改进。\n- 能解释知识过期、无证据、权限过滤分别影响什么。\n\n**最低任务**\n- 手画 query→召回→筛选／重排→上下文→回答链路。","html":"\u003cp>\u003cstrong>读什么\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/nodes/knowledge/KnowledgeNode.java\">W8 · KnowledgeNode \u003cspan>复制路径 ↗\u003c/span>\u003c/button>→\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/nodes/knowledge/service/KnowledgeRetrievalService.java\">W9 · KnowledgeRetrievalService \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的检索主链路。\u003c/li>\u003cli>\u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/nodes/knowledge/strategy/HybridSearchStrategy.java\">W10 · HybridSearchStrategy \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的 search()、mergeAndSortResults()，核对注释与实际执行顺序。\u003c/li>\u003cli>查 KNN 和文本检索的参数用途，不深入 ES 全部实现。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>动手\u003c/strong>\u003c/p>\n\u003cul>\u003cli>建 8—12 条虚构知识，例如请假、报销、设备申请规则。\u003c/li>\u003cli>用关键词匹配或手工构造的检索结果做最小召回。\u003c/li>\u003cli>准备 8 个问题，包含明确命中、同义表达、没有答案、过期知识四类。\u003c/li>\u003cli>记录命中文档、是否包含正确证据、如何处理无结果。\u003c/li>\u003cli>没有实际 Embedding 就标注“尚未实现向量检索”，不要把模拟分数叫真实语义相似度。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>补基础\u003c/strong>\u003c/p>\n\u003cul>\u003cli>切分、Embedding、关键词／向量召回、融合、重排、上下文构建。\u003c/li>\u003cli>向量分数和关键词分数可能尺度不同，简单加权并非天然合理。\u003c/li>\u003cli>RAG 需要评估检索和回答两个阶段；不能只看某次回复像不像。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>产出与验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>一张 8 题小评测表，描述失误和可能改进。\u003c/li>\u003cli>能解释知识过期、无证据、权限过滤分别影响什么。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>最低任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>手画 query→召回→筛选／重排→上下文→回答链路。\u003c/li>\u003c/ul>"},{"id":27,"title":"周六练习：DAG v2 与一项 AI 能力","week":4,"body":"**2—3 小时**\n- 在 DAG v1 上补总体超时、失败状态、协作式取消。\n- 从“工具循环”或“最小检索”中选一项接入，不必两项都做。\n- 给 6 个场景写出可重复验证：正常、分支失败、总超时、重复提交、工具错误／检索为空、请求隔离。\n- 对重复提交的验证，明确只保证当前练习的内存去重范围。\n- 为每次执行输出 workflowId、runId、nodeId、状态、耗时；字段可以使用虚构值。\n\n**验收**\n- 失败后没有错误启动依赖节点。\n- 对不能立即退出的任务有可解释证据和改进方向。\n- 写清当前不支持跨进程恢复，不能把内存状态机描述成持久化工作流系统。\n\n**降级**\n超时和失败先完成，AI 能力先保留独立小程序。","html":"\u003cp>\u003cstrong>2—3 小时\u003c/strong>\u003c/p>\n\u003cul>\u003cli>在 DAG v1 上补总体超时、失败状态、协作式取消。\u003c/li>\u003cli>从“工具循环”或“最小检索”中选一项接入，不必两项都做。\u003c/li>\u003cli>给 6 个场景写出可重复验证：正常、分支失败、总超时、重复提交、工具错误／检索为空、请求隔离。\u003c/li>\u003cli>对重复提交的验证，明确只保证当前练习的内存去重范围。\u003c/li>\u003cli>为每次执行输出 workflowId、runId、nodeId、状态、耗时；字段可以使用虚构值。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>失败后没有错误启动依赖节点。\u003c/li>\u003cli>对不能立即退出的任务有可解释证据和改进方向。\u003c/li>\u003cli>写清当前不支持跨进程恢复，不能把内存状态机描述成持久化工作流系统。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>降级\u003c/strong>\u003c/p>\n\u003cp>超时和失败先完成，AI 能力先保留独立小程序。\u003c/p>"},{"id":28,"title":"周日复盘：用四个故障回答平台问题","week":4,"body":"**30—60 分钟**\n分别录音解释：\n1. 并行分支超时了，怎样避免请求长期挂住？\n2. 用户重试，为什么可能重复调用工具？\n3. 条件分支跳过后，汇合节点为什么可能卡住？\n4. 知识库没有证据时，系统应该如何响应？\n\n每题最多 2 分钟。只讲自己能解释的机制，不堆框架名。选最弱的一题再跑一次练习。","html":"\u003cp>\u003cstrong>30—60 分钟\u003c/strong>\u003c/p>\n\u003cp>分别录音解释：\u003c/p>\n\u003col>\u003cli>并行分支超时了，怎样避免请求长期挂住？\u003c/li>\u003cli>用户重试，为什么可能重复调用工具？\u003c/li>\u003cli>条件分支跳过后，汇合节点为什么可能卡住？\u003c/li>\u003cli>知识库没有证据时，系统应该如何响应？\u003c/li>\u003c/ol>\n\u003cp>每题最多 2 分钟。只讲自己能解释的机制，不堆框架名。选最弱的一题再跑一次练习。\u003c/p>"},{"id":29,"title":"MySQL：索引和慢查询","week":5,"body":"**材料与练习**\n- 在管理服务找一个普通查询，画出 WHERE、ORDER BY 和 LIMIT 涉及字段。\n- 自己设计小表 run_record(id, business, workflow_id, status, created_at)。\n- 设计“查某业务某工作流最近 20 条执行记录”的 SQL。\n- 为查询提出一个候选联合索引，解释列顺序。\n- 有本地数据库时使用虚构数据与 EXPLAIN；没有数据库就完成 SQL 和执行计划分析题，不声称已验证性能。\n\n**补基础**\n- B+ 树索引的基本作用、联合索引左前缀、回表、覆盖索引。\n- 索引有写入、存储代价；优化器也不一定选择你预期的索引。\n- 深分页为什么可能代价大，游标分页需要稳定排序和唯一的续查条件。\n\n**产出与验收**\n- 一张查询→索引→预期收益→实际证据／待验证的表。\n- 能解释为什么不能说“加了索引一定快”。\n\n**最低任务**\n- 给上述查询写 SQL 和一个索引方案，解释理由。","html":"\u003cp>\u003cstrong>材料与练习\u003c/strong>\u003c/p>\n\u003cul>\u003cli>在管理服务找一个普通查询，画出 WHERE、ORDER BY 和 LIMIT 涉及字段。\u003c/li>\u003cli>自己设计小表 run_record(id, business, workflow_id, status, created_at)。\u003c/li>\u003cli>设计“查某业务某工作流最近 20 条执行记录”的 SQL。\u003c/li>\u003cli>为查询提出一个候选联合索引，解释列顺序。\u003c/li>\u003cli>有本地数据库时使用虚构数据与 EXPLAIN；没有数据库就完成 SQL 和执行计划分析题，不声称已验证性能。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>补基础\u003c/strong>\u003c/p>\n\u003cul>\u003cli>B+ 树索引的基本作用、联合索引左前缀、回表、覆盖索引。\u003c/li>\u003cli>索引有写入、存储代价；优化器也不一定选择你预期的索引。\u003c/li>\u003cli>深分页为什么可能代价大，游标分页需要稳定排序和唯一的续查条件。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>产出与验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>一张查询→索引→预期收益→实际证据／待验证的表。\u003c/li>\u003cli>能解释为什么不能说“加了索引一定快”。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>最低任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>给上述查询写 SQL 和一个索引方案，解释理由。\u003c/li>\u003c/ul>"},{"id":30,"title":"Redis：缓存与一致性边界","week":5,"body":"**材料与练习**\n- 在项目中找一处缓存读写，确认 key、过期时间、数据来源。\n- 用本地内存缓存模拟模型配置缓存，给 key 加 business。\n- 模拟多个请求同时遇到热点 key 失效，记录回源次数。\n- 比较“缓存失效后回源”和“先更新数据再失效缓存”的过程。\n\n**补基础**\n- 缓存穿透、击穿、雪崩的区别。\n- 过期时间、空值缓存、互斥加载／请求合并、随机抖动分别解决什么。\n- 更新数据库后删除缓存仍存在失败与并发窗口，不轻率承诺强一致。\n- Redis 锁不是今天必做项；如果使用，要说明租约、释放条件、业务幂等。\n\n**产出与验收**\n- 三种缓存问题各举一个你项目附近的例子。\n- 说明缓存旧配置可能怎样影响路由。\n\n**最低任务**\n- 写清一个缓存 key 的设计，避免跨业务串数据。","html":"\u003cp>\u003cstrong>材料与练习\u003c/strong>\u003c/p>\n\u003cul>\u003cli>在项目中找一处缓存读写，确认 key、过期时间、数据来源。\u003c/li>\u003cli>用本地内存缓存模拟模型配置缓存，给 key 加 business。\u003c/li>\u003cli>模拟多个请求同时遇到热点 key 失效，记录回源次数。\u003c/li>\u003cli>比较“缓存失效后回源”和“先更新数据再失效缓存”的过程。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>补基础\u003c/strong>\u003c/p>\n\u003cul>\u003cli>缓存穿透、击穿、雪崩的区别。\u003c/li>\u003cli>过期时间、空值缓存、互斥加载／请求合并、随机抖动分别解决什么。\u003c/li>\u003cli>更新数据库后删除缓存仍存在失败与并发窗口，不轻率承诺强一致。\u003c/li>\u003cli>Redis 锁不是今天必做项；如果使用，要说明租约、释放条件、业务幂等。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>产出与验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>三种缓存问题各举一个你项目附近的例子。\u003c/li>\u003cli>说明缓存旧配置可能怎样影响路由。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>最低任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>写清一个缓存 key 的设计，避免跨业务串数据。\u003c/li>\u003c/ul>"},{"id":31,"title":"Kafka：消息重复与消费失败","week":5,"body":"**材料与练习**\n- 从 W1 的 Kafka 发送位置向外追一层，区分发送追踪日志与实际业务执行。\n- 用 List 或 BlockingQueue 模拟一条消息被重复投递两次。\n- 让消费者在“写结果成功、确认消费之前”失败，观察重试。\n- 用 eventId 做最小去重，说明内存方案的范围。\n\n**补基础**\n- Topic、Partition、Consumer Group、offset。\n- 业务处理与 offset 提交之间的先后顺序影响重复或丢失风险。\n- 分区内顺序与跨分区全局顺序不同。\n- Kafka 的事务能力不能自动消除任意外部数据库、HTTP 工具调用的重复副作用。\n\n**产出与验收**\n- 一张“处理成功→提交前崩溃→重复消费”的时序图。\n- 能解释为什么消费端业务幂等仍然重要。\n\n**最低任务**\n- 说明消息重复的一种具体触发过程。","html":"\u003cp>\u003cstrong>材料与练习\u003c/strong>\u003c/p>\n\u003cul>\u003cli>从 \u003cbutton class=\"pathlink\" data-copy=\"/Users/lv/Documents/code/dify-engine/dify-engine-platform-service/src/main/java/com/immomo/dify/platform/service/workflow/WorkflowRunner.java\">W1 · 执行器 WorkflowRunner \u003cspan>复制路径 ↗\u003c/span>\u003c/button> 的 Kafka 发送位置向外追一层，区分发送追踪日志与实际业务执行。\u003c/li>\u003cli>用 List 或 BlockingQueue 模拟一条消息被重复投递两次。\u003c/li>\u003cli>让消费者在“写结果成功、确认消费之前”失败，观察重试。\u003c/li>\u003cli>用 eventId 做最小去重，说明内存方案的范围。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>补基础\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Topic、Partition、Consumer Group、offset。\u003c/li>\u003cli>业务处理与 offset 提交之间的先后顺序影响重复或丢失风险。\u003c/li>\u003cli>分区内顺序与跨分区全局顺序不同。\u003c/li>\u003cli>Kafka 的事务能力不能自动消除任意外部数据库、HTTP 工具调用的重复副作用。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>产出与验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>一张“处理成功→提交前崩溃→重复消费”的时序图。\u003c/li>\u003cli>能解释为什么消费端业务幂等仍然重要。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>最低任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>说明消息重复的一种具体触发过程。\u003c/li>\u003c/ul>"},{"id":32,"title":"Spring 事务：提交时机与异步任务","week":5,"body":"**材料与练习**\n- 在管理服务搜索 @Transactional，选一处小事务。\n- 结合项目现有结算相关变更记录，研究“本类自调用”和“事务提交前启动异步任务”两类问题。\n- 画线程 A 开事务写数据、线程 B 在提交前查询的时间线。\n- 有本地 Spring 测试环境时验证；否则用时间线和源码追踪说明，不伪造测试结果。\n\n**补基础**\n- 常见代理模式下，本类直接调用通常绕过事务代理。\n- 默认回滚规则与异常类型有关，也可以配置；捕获后不再抛出异常可能影响回滚。\n- 事务不自动传播到任意异步线程。\n- afterCommit 可改变启动时机，但不等于异步操作一定执行成功；需要更可靠交付时可以研究 Outbox 等机制。\n\n**产出与验收**\n- 两种事务失效／时序问题的触发条件和修复思路。\n- 能解释为什么 afterCommit 解决不了所有可靠性问题。\n\n**最低任务**\n- 解释“数据已写入当前事务”与“其他事务已经可见”的区别。","html":"\u003cp>\u003cstrong>材料与练习\u003c/strong>\u003c/p>\n\u003cul>\u003cli>在管理服务搜索 @Transactional，选一处小事务。\u003c/li>\u003cli>结合项目现有结算相关变更记录，研究“本类自调用”和“事务提交前启动异步任务”两类问题。\u003c/li>\u003cli>画线程 A 开事务写数据、线程 B 在提交前查询的时间线。\u003c/li>\u003cli>有本地 Spring 测试环境时验证；否则用时间线和源码追踪说明，不伪造测试结果。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>补基础\u003c/strong>\u003c/p>\n\u003cul>\u003cli>常见代理模式下，本类直接调用通常绕过事务代理。\u003c/li>\u003cli>默认回滚规则与异常类型有关，也可以配置；捕获后不再抛出异常可能影响回滚。\u003c/li>\u003cli>事务不自动传播到任意异步线程。\u003c/li>\u003cli>afterCommit 可改变启动时机，但不等于异步操作一定执行成功；需要更可靠交付时可以研究 Outbox 等机制。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>产出与验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>两种事务失效／时序问题的触发条件和修复思路。\u003c/li>\u003cli>能解释为什么 afterCommit 解决不了所有可靠性问题。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>最低任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>解释“数据已写入当前事务”与“其他事务已经可见”的区别。\u003c/li>\u003c/ul>"},{"id":33,"title":"部署基础：进程、容器和服务检查","week":5,"body":"**材料与练习**\n- 阅读两个项目的部署说明，先查启动参数、配置来源、日志位置、健康检查。\n- 将自己的最小网关以普通 Java 进程运行，观察端口、日志、正常停止。\n- 已有 Docker 环境时再写最简单容器构建与启动说明；没有就先理解，不花整晚安装平台。\n- 列出 readiness 与 liveness 各检查什么，哪些故障不宜靠反复重启解决。\n\n**补基础**\n- 镜像、容器、进程、端口、环境变量。\n- Kubernetes 先掌握 Pod、Deployment、Service、ConfigMap、Secret 的用途与连接关系。\n- Docker 环境能跑程序不等于掌握生产 K8s，简历如实区分。\n\n**产出与验收**\n- 一页自己的服务启动与停止说明。\n- 画出请求如何从服务入口到应用进程。\n\n**最低任务**\n- 说明应用端口、容器端口映射、Service 三者分别是什么概念。","html":"\u003cp>\u003cstrong>材料与练习\u003c/strong>\u003c/p>\n\u003cul>\u003cli>阅读两个项目的部署说明，先查启动参数、配置来源、日志位置、健康检查。\u003c/li>\u003cli>将自己的最小网关以普通 Java 进程运行，观察端口、日志、正常停止。\u003c/li>\u003cli>已有 Docker 环境时再写最简单容器构建与启动说明；没有就先理解，不花整晚安装平台。\u003c/li>\u003cli>列出 readiness 与 liveness 各检查什么，哪些故障不宜靠反复重启解决。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>补基础\u003c/strong>\u003c/p>\n\u003cul>\u003cli>镜像、容器、进程、端口、环境变量。\u003c/li>\u003cli>Kubernetes 先掌握 Pod、Deployment、Service、ConfigMap、Secret 的用途与连接关系。\u003c/li>\u003cli>Docker 环境能跑程序不等于掌握生产 K8s，简历如实区分。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>产出与验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>一页自己的服务启动与停止说明。\u003c/li>\u003cli>画出请求如何从服务入口到应用进程。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>最低任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>说明应用端口、容器端口映射、Service 三者分别是什么概念。\u003c/li>\u003c/ul>"},{"id":34,"title":"周六练习：一次小型故障排查","week":5,"body":"**2—3 小时**\n从自己的小项目选三个故障：\n1. 慢任务占满线程或许可。\n2. 消费者不读导致队列积压。\n3. 模型一直报错，但入口仍持续放量。\n\n**排查步骤**\n- 先写现象和影响，记录发生时间。\n- 查看请求数、运行中任务数、队列长度、错误和延迟。\n- 使用 IDE 线程视图或本机具备的线程诊断工具观察等待位置。\n- 提出一个最小假设，只改变一个条件，再比较结果。\n- 记录现象→证据→根因→修复→验证→局限。\n\n**验收**\n- 至少有一次故障被自己稳定复现，并用证据解释。\n- 修复前后使用同样场景比较。\n- 低流量本地练习不能写成生产压测结论。\n\n**最低版本**\n只有 90 分钟时，完成一个故障并保留日志。","html":"\u003cp>\u003cstrong>2—3 小时\u003c/strong>\u003c/p>\n\u003cp>从自己的小项目选三个故障：\u003c/p>\n\u003col>\u003cli>慢任务占满线程或许可。\u003c/li>\u003cli>消费者不读导致队列积压。\u003c/li>\u003cli>模型一直报错，但入口仍持续放量。\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>排查步骤\u003c/strong>\u003c/p>\n\u003cul>\u003cli>先写现象和影响，记录发生时间。\u003c/li>\u003cli>查看请求数、运行中任务数、队列长度、错误和延迟。\u003c/li>\u003cli>使用 IDE 线程视图或本机具备的线程诊断工具观察等待位置。\u003c/li>\u003cli>提出一个最小假设，只改变一个条件，再比较结果。\u003c/li>\u003cli>记录现象→证据→根因→修复→验证→局限。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>至少有一次故障被自己稳定复现，并用证据解释。\u003c/li>\u003cli>修复前后使用同样场景比较。\u003c/li>\u003cli>低流量本地练习不能写成生产压测结论。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>最低版本\u003c/strong>\u003c/p>\n\u003cp>只有 90 分钟时，完成一个故障并保留日志。\u003c/p>"},{"id":35,"title":"周日复盘：基础题第一次闭卷检查","week":5,"body":"**30—60 分钟**\n- 从附带的必背卡片中抽 8 张，每张回答 30—60 秒。\n- 其中至少两张要连接你的代码或练习。\n- 把回答分成“准确”“模糊”“错误”，不要只标记“背过”。\n- 本周最弱的两个基础点安排到第六周的补课时间。\n\n**门槛**\n能说明数据库、缓存、消息、事务各解决什么问题，以及各自一项不能自动保证的事情。","html":"\u003cp>\u003cstrong>30—60 分钟\u003c/strong>\u003c/p>\n\u003cul>\u003cli>从附带的必背卡片中抽 8 张，每张回答 30—60 秒。\u003c/li>\u003cli>其中至少两张要连接你的代码或练习。\u003c/li>\u003cli>把回答分成“准确”“模糊”“错误”，不要只标记“背过”。\u003c/li>\u003cli>本周最弱的两个基础点安排到第六周的补课时间。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>门槛\u003c/strong>\u003c/p>\n\u003cp>能说明数据库、缓存、消息、事务各解决什么问题，以及各自一项不能自动保证的事情。\u003c/p>"},{"id":36,"title":"整理个人贡献与真实指标","week":6,"body":"**任务**\n- 为两个项目分别写：背景、使用方、架构、本人参与范围、一个具体问题、验证方式。\n- 对每项标注：本人独立完成／参与协作／维护接触／学习后才理解。\n- 指标分成已有证据、可核对、暂无数据三类。\n- 没有量化数据可以讲明确机制和验证，不编 QPS、收益比例或生产规模。\n- 将外包雇佣关系与陌陌驻场项目分开写清楚。\n\n**产出**\n- 两张“项目事实卡”，每张不超过一页。\n- 三条候选简历描述：动作、具体对象、解决的问题、可证明的结果。\n\n**验收**\n每句话被问“你具体做了哪一部分”“证据在哪里”时，都能回答。\n\n**最低任务**\n- 写清自己最熟悉的一个模块，删掉无法解释的主导／精通表述。","html":"\u003cp>\u003cstrong>任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>为两个项目分别写：背景、使用方、架构、本人参与范围、一个具体问题、验证方式。\u003c/li>\u003cli>对每项标注：本人独立完成／参与协作／维护接触／学习后才理解。\u003c/li>\u003cli>指标分成已有证据、可核对、暂无数据三类。\u003c/li>\u003cli>没有量化数据可以讲明确机制和验证，不编 QPS、收益比例或生产规模。\u003c/li>\u003cli>将外包雇佣关系与陌陌驻场项目分开写清楚。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>产出\u003c/strong>\u003c/p>\n\u003cul>\u003cli>两张“项目事实卡”，每张不超过一页。\u003c/li>\u003cli>三条候选简历描述：动作、具体对象、解决的问题、可证明的结果。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>验收\u003c/strong>\u003c/p>\n\u003cp>每句话被问“你具体做了哪一部分”“证据在哪里”时，都能回答。\u003c/p>\n\u003cp>\u003cstrong>最低任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>写清自己最熟悉的一个模块，删掉无法解释的主导／精通表述。\u003c/li>\u003c/ul>"},{"id":37,"title":"网关项目讲稿","week":6,"body":"**任务**\n- 30 秒版本：服务什么业务、解决什么问题、你做哪部分。\n- 3 分钟版本：请求链路、关键抽象、一个难点。\n- 8 分钟版本：选择理由、故障处理、替代方案、当前局限。\n- 画一张网关图，能指出鉴权、限流、配置、路由、Client、协议、流处理、日志位置。\n\n**追问练习**\n- 新厂商接入要改哪些位置？\n- 逻辑模型与厂商实际模型怎样解耦？\n- 流开始后报错怎样处理？\n- 客户端断开如何影响上游？\n- 多实例限流、配置更新、健康摘除分别有什么问题？\n\n**验收**\n能讲自己的实际实现；未实现的内容明确说“如果扩展，我会……”，不混在现状中。","html":"\u003cp>\u003cstrong>任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>30 秒版本：服务什么业务、解决什么问题、你做哪部分。\u003c/li>\u003cli>3 分钟版本：请求链路、关键抽象、一个难点。\u003c/li>\u003cli>8 分钟版本：选择理由、故障处理、替代方案、当前局限。\u003c/li>\u003cli>画一张网关图，能指出鉴权、限流、配置、路由、Client、协议、流处理、日志位置。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>追问练习\u003c/strong>\u003c/p>\n\u003cul>\u003cli>新厂商接入要改哪些位置？\u003c/li>\u003cli>逻辑模型与厂商实际模型怎样解耦？\u003c/li>\u003cli>流开始后报错怎样处理？\u003c/li>\u003cli>客户端断开如何影响上游？\u003c/li>\u003cli>多实例限流、配置更新、健康摘除分别有什么问题？\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>验收\u003c/strong>\u003c/p>\n\u003cp>能讲自己的实际实现；未实现的内容明确说“如果扩展，我会……”，不混在现状中。\u003c/p>"},{"id":38,"title":"工作流讲稿与故障案例","week":6,"body":"**任务**\n- 同样准备 30 秒、3 分钟、8 分钟版本。\n- 从亲自处理过的问题中选一个真实案例；没有则将学习练习明确标为练习。\n- 按“现象→定位证据→根因→方案→验证→遗留限制”组织。\n- 画普通 DAG、条件分支图各一张，解释不同汇合规则。\n\n**追问练习**\n- 并行分支为什么不会重复执行汇合节点？\n- 请求之间状态怎样隔离？\n- deadline 怎样传递？\n- 某个任务取消失败怎么办？\n- 进程重启后能不能恢复？如果当前不能，持久化需要新增什么？\n\n**验收**\n既能讲成功路径，也能讲失败和局限，不能用“用了虚拟线程所以并发没问题”代替解释。","html":"\u003cp>\u003cstrong>任务\u003c/strong>\u003c/p>\n\u003cul>\u003cli>同样准备 30 秒、3 分钟、8 分钟版本。\u003c/li>\u003cli>从亲自处理过的问题中选一个真实案例；没有则将学习练习明确标为练习。\u003c/li>\u003cli>按“现象→定位证据→根因→方案→验证→遗留限制”组织。\u003c/li>\u003cli>画普通 DAG、条件分支图各一张，解释不同汇合规则。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>追问练习\u003c/strong>\u003c/p>\n\u003cul>\u003cli>并行分支为什么不会重复执行汇合节点？\u003c/li>\u003cli>请求之间状态怎样隔离？\u003c/li>\u003cli>deadline 怎样传递？\u003c/li>\u003cli>某个任务取消失败怎么办？\u003c/li>\u003cli>进程重启后能不能恢复？如果当前不能，持久化需要新增什么？\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>验收\u003c/strong>\u003c/p>\n\u003cp>既能讲成功路径，也能讲失败和局限，不能用“用了虚拟线程所以并发没问题”代替解释。\u003c/p>"},{"id":39,"title":"算法与手写代码集中查漏","week":6,"body":"**任务，90—120 分钟**\n- 哈希题一题，图题一题。\n- 手写一个按 business 分组的简单限流检查或一个串行节点执行器。\n- 每题先口述输入输出、边界、复杂度，再写代码。\n- 卡住 15—20 分钟先看提示；看完合上答案，过一段时间重写。\n\n**验收**\n- 能处理空输入、重复元素／重复边、未知节点等边界。\n- 解释复杂度，而不只说“最优解”。\n- 完成更少的题，但每题能独立重写。","html":"\u003cp>\u003cstrong>任务，90—120 分钟\u003c/strong>\u003c/p>\n\u003cul>\u003cli>哈希题一题，图题一题。\u003c/li>\u003cli>手写一个按 business 分组的简单限流检查或一个串行节点执行器。\u003c/li>\u003cli>每题先口述输入输出、边界、复杂度，再写代码。\u003c/li>\u003cli>卡住 15—20 分钟先看提示；看完合上答案，过一段时间重写。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>验收\u003c/strong>\u003c/p>\n\u003cul>\u003cli>能处理空输入、重复元素／重复边、未知节点等边界。\u003c/li>\u003cli>解释复杂度，而不只说“最优解”。\u003c/li>\u003cli>完成更少的题，但每题能独立重写。\u003c/li>\u003c/ul>"},{"id":40,"title":"第一次模拟面试","week":6,"body":"**时间分配**\n- 5 分钟：自我介绍与经历。\n- 15 分钟：网关深挖。\n- 15 分钟：工作流深挖。\n- 15 分钟：Java／中间件抽问。\n- 20 分钟：一道代码题。\n- 20—30 分钟：复盘。\n\n**操作**\n自己录音或请 AI 逐题提问。先回答，结束后再让对方评价，不要边问边看答案。\n\n**产出**\n每个卡点归因：不知道概念／看不懂实现／缺少证据／表达乱／代码写不出。\n\n**验收**\n只选最影响结果的三个问题进入周六补课，不重新报一门大课。","html":"\u003cp>\u003cstrong>时间分配\u003c/strong>\u003c/p>\n\u003cul>\u003cli>5 分钟：自我介绍与经历。\u003c/li>\u003cli>15 分钟：网关深挖。\u003c/li>\u003cli>15 分钟：工作流深挖。\u003c/li>\u003cli>15 分钟：Java／中间件抽问。\u003c/li>\u003cli>20 分钟：一道代码题。\u003c/li>\u003cli>20—30 分钟：复盘。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>操作\u003c/strong>\u003c/p>\n\u003cp>自己录音或请 AI 逐题提问。先回答，结束后再让对方评价，不要边问边看答案。\u003c/p>\n\u003cp>\u003cstrong>产出\u003c/strong>\u003c/p>\n\u003cp>每个卡点归因：不知道概念／看不懂实现／缺少证据／表达乱／代码写不出。\u003c/p>\n\u003cp>\u003cstrong>验收\u003c/strong>\u003c/p>\n\u003cp>只选最影响结果的三个问题进入周六补课，不重新报一门大课。\u003c/p>"},{"id":41,"title":"周六：定向修补与简历初稿","week":6,"body":"**2—3 小时**\n- 用前 90 分钟修最弱的两项：一个知识问题、一个代码问题。\n- 再录一次项目介绍，与 Day 37 或 Day 38 对比。\n- 整理一版简历，突出真实模块与可核验结果。\n- 把本地练习与正式工作经历分开，不把学习项目的实现写成公司生产成果。\n- 针对“平台后端”“网关”“工作流”三类岗位整理关键词，不需要写三份完全不同经历。\n\n**验收**\n每条简历描述至少能承受三层追问：做了什么→怎样实现→为什么这样做／边界是什么。","html":"\u003cp>\u003cstrong>2—3 小时\u003c/strong>\u003c/p>\n\u003cul>\u003cli>用前 90 分钟修最弱的两项：一个知识问题、一个代码问题。\u003c/li>\u003cli>再录一次项目介绍，与 Day 37 或 Day 38 对比。\u003c/li>\u003cli>整理一版简历，突出真实模块与可核验结果。\u003c/li>\u003cli>把本地练习与正式工作经历分开，不把学习项目的实现写成公司生产成果。\u003c/li>\u003cli>针对“平台后端”“网关”“工作流”三类岗位整理关键词，不需要写三份完全不同经历。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>验收\u003c/strong>\u003c/p>\n\u003cp>每条简历描述至少能承受三层追问：做了什么→怎样实现→为什么这样做／边界是什么。\u003c/p>"},{"id":42,"title":"周日：毕业检查与下一轮安排","week":6,"body":"**基础完成线**\n- 能不看资料画网关与工作流主链路。\n- 两个小项目都有可运行的正常和失败场景。\n- 能用代码解释线程池、取消、超时、请求隔离、DAG 汇合。\n- 能准确回答必背卡片的大部分基础问题，剩余项有明确标记。\n- 有真实项目素材，能区分个人贡献与学习理解。\n- 有一段 5 分钟项目讲述和一次模拟面试记录。\n\n**检查结果**\n- 大部分达成：可以开始少量投递匹配岗位，用反馈继续修正。\n- 概念懂但代码不熟：再花 1—2 周重复小项目，不扩大知识面。\n- Java 语法、集合、异常、线程仍普遍卡住：先增加 2—4 周 Java 基础与编码训练，平台专题减量。\n- 只是背得流畅但不能写例子：暂时不把“学完”视为完成。\n\n**下一轮只选一个方向加深**\n- 网关：配置切换、限流、负载均衡、流生命周期。\n- 工作流：调度、状态机、超时、失败恢复。\n- AI 应用：工具调用、RAG 评测、业务效果。\n根据自己最能独立解释的内容和面试反馈选择。","html":"\u003cp>\u003cstrong>基础完成线\u003c/strong>\u003c/p>\n\u003cul>\u003cli>能不看资料画网关与工作流主链路。\u003c/li>\u003cli>两个小项目都有可运行的正常和失败场景。\u003c/li>\u003cli>能用代码解释线程池、取消、超时、请求隔离、DAG 汇合。\u003c/li>\u003cli>能准确回答必背卡片的大部分基础问题，剩余项有明确标记。\u003c/li>\u003cli>有真实项目素材，能区分个人贡献与学习理解。\u003c/li>\u003cli>有一段 5 分钟项目讲述和一次模拟面试记录。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>检查结果\u003c/strong>\u003c/p>\n\u003cul>\u003cli>大部分达成：可以开始少量投递匹配岗位，用反馈继续修正。\u003c/li>\u003cli>概念懂但代码不熟：再花 1—2 周重复小项目，不扩大知识面。\u003c/li>\u003cli>Java 语法、集合、异常、线程仍普遍卡住：先增加 2—4 周 Java 基础与编码训练，平台专题减量。\u003c/li>\u003cli>只是背得流畅但不能写例子：暂时不把“学完”视为完成。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>下一轮只选一个方向加深\u003c/strong>\u003c/p>\n\u003cul>\u003cli>网关：配置切换、限流、负载均衡、流生命周期。\u003c/li>\u003cli>工作流：调度、状态机、超时、失败恢复。\u003c/li>\u003cli>AI 应用：工具调用、RAG 评测、业务效果。\u003c/li>\u003c/ul>\n\u003cp>根据自己最能独立解释的内容和面试反馈选择。\u003c/p>"}],"cards":[{"id":"core-01","cat":"Java 基础","q":"Java 是值传递还是引用传递？","plain":"方法拿到的是一份值的副本；对象参数复制的是指向对象的引用，所以能改对象内容，不能替换外面的变量。","answer":"Java 是值传递。传基本类型时复制基本值，传对象时复制引用值。因此方法里可以通过引用修改同一个对象的内容，但给参数重新赋一个新对象，不会替换调用方变量里的引用。","example":"鉴权方法修改请求对象的 business，外层为什么能读取到？","pitfall":"“Java 传对象就是引用传递”不够准确。","follow":"写两个方法，一个修改对象字段，一个让参数指向新对象，预测调用后结果。","priority":"基础必会"},{"id":"core-02","cat":"Java 基础","q":"接口、抽象类、泛型分别解决什么？","plain":"接口约定会做什么，抽象类提供共同骨架，泛型让同一套逻辑处理不同类型。","answer":"接口约定能力，抽象类可以共享骨架和部分实现，泛型表达类型参数，让公共逻辑适配不同具体类型并得到编译期类型检查。选择具体实现依赖实际注册、配置或注入机制，不是写了泛型就自动路由。","example":"Processor 抽象与具体厂商处理器分别负责什么？processKey 如何找到实现？","pitfall":"","follow":"如果注册名重复或配置找不到处理器，怎样发现？","priority":"基础必会"},{"id":"core-03","cat":"Java 基础","q":"equals 和 hashCode 有什么约定？","plain":"相等的对象要有相同哈希值；哈希值相同的两个对象，内容却不一定相等。","answer":"equals 相等的对象必须有相同 hashCode；hashCode 相同不保证 equals 相等。放进哈希集合的对象，参与判等和哈希计算的字段不宜随意修改，否则可能无法按预期查找。","example":"使用业务、模型等字段作为缓存键时，怎样保证身份稳定？","pitfall":"","follow":"两个内容相同的自定义对象，为什么可能在 HashSet 中同时存在？","priority":"基础必会"},{"id":"core-04","cat":"集合","q":"HashMap 与 ConcurrentHashMap 怎么选？","plain":"普通 Map 不负责并发保护，并发 Map 也不等于你写的一整段业务逻辑都安全。","answer":"HashMap 不提供并发修改安全保证。ConcurrentHashMap 提供线程安全的单次操作及若干原子组合方法，但任意“先查再改”并不因此整体原子，里面存放的可变对象也不会自动线程安全。","example":"共享路由表、处理器注册表、请求内变量分别怎样使用？","pitfall":"","follow":"containsKey 后 put，怎样改成符合业务语义的原子操作？","priority":"基础必会"},{"id":"core-05","cat":"Spring","q":"Spring 注入和单例意味着什么？","plain":"容器帮你创建和组装对象；默认一个服务对象可能同时被许多请求使用。","answer":"Spring 容器创建和管理 Bean，并按规则装配依赖。默认 singleton 作用域通常表示每个容器中每个 Bean 定义对应一个实例。多个请求可能使用同一实例，因此请求级可变状态不能随意放在共享字段里。","example":"Pipeline 可以共享，单个请求的 messages、状态、输出应放在哪里？","pitfall":"@Service 不是线程安全注解，也不表示全 JVM 只能存在一个对象。","follow":"用自己的话解释，并找到一个最小例子。","priority":"基础必会"},{"id":"core-06","cat":"并发","q":"volatile 能保证什么，不能保证什么？","plain":"volatile 帮线程看见更新，但不会把读取、加一、写回三步变成不可分割的一步。","answer":"volatile 为相关读写提供可见性与顺序约束，但不会让 count++ 之类读—改—写复合操作自动原子化。简单计数可考虑原子类，多字段不变量可能需要锁或其他整体设计。","example":"配置引用更新与并发请求计数，为什么是两类问题？","pitfall":"","follow":"将 Map 引用设为 volatile，能否保证其他线程对 Map 内容的任意修改都安全？不能仅凭 volatile 得出这个结论。","priority":"基础必会"},{"id":"core-07","cat":"并发","q":"synchronized、Lock 和 CAS 怎么理解？","plain":"锁把关键操作圈起来一次只让合适的线程进入；CAS 则在值仍符合预期时尝试更新。","answer":"synchronized 与显式 Lock 可以保护临界区；显式 Lock 提供更灵活的尝试获取、可中断获取等能力，需要正确释放。CAS 用比较并交换实现原子更新，但不会自动解决多个字段的一致性。先定义要保护的不变量，再选工具。","example":"汇合节点的“依赖满足”和“标记已调度”如何保持一致？","pitfall":"不要泛称 Lock 一定比 synchronized 快，或 CAS 一定没有代价。","follow":"用自己的话解释，并找到一个最小例子。","priority":"基础必会"},{"id":"core-08","cat":"并发","q":"线程池有哪些关键参数？","plain":"线程池像一组工作人员加一个等候队列，要决定人数、排队容量和满员后的处理方式。","answer":"线程池涉及核心线程数、最大线程数、队列、空闲存活时间、线程工厂和拒绝策略。常见 ThreadPoolExecutor 提交流程与线程数、入队结果相关：通常先建核心线程，再尝试入队，队列无法接收时再尝试扩到上限，最后拒绝；实际还受池状态影响。","example":"流式请求很多、任务慢，为什么队列和运行中数量都要观察？","pitfall":"","follow":"CallerRunsPolicy 可能把负载转给谁？无界队列会怎样影响最大线程数发挥作用？","priority":"基础必会"},{"id":"core-09","cat":"并发","q":"Future.get、cancel 与任务停止是什么关系？","plain":"取消更像发出停止请求，任务是否真的停下来，还要看它有没有响应并清理资源。","answer":"get 可以等待结果并感知异常，带 timeout 的 get 超时主要表示调用方不再等这么久；它不会因此自动停止任务。cancel(true) 尝试取消并中断执行线程，实际代码、IO 和外部副作用是否停止，需要对应实现配合。","example":"总体超时后为什么还要检查任务退出和连接关闭？","pitfall":"","follow":"区分 Future 已取消、任务代码已退出、远端操作已停止三件事。","priority":"基础必会"},{"id":"core-10","cat":"并发","q":"虚拟线程适合什么，不解决什么？","plain":"虚拟线程降低大量等待任务的线程管理成本，不会让计算凭空加速，也不能无限请求下游。","answer":"虚拟线程降低大量线程并发等待时的管理成本，常适合较多 IO 等待的任务；不会让 CPU 计算凭空加速，也不会自动限制下游连接、请求并发、内存和配额。阻塞与调度行为需要结合实际 JDK 和库验证。","example":"工作流用了虚拟线程，为什么仍需要并发限制、总体超时和资源管理？","pitfall":"“用了虚拟线程就不需要限流”是错误结论。","follow":"用自己的话解释，并找到一个最小例子。","priority":"基础必会"},{"id":"core-11","cat":"Spring","q":"Spring 事务为什么可能没按预期生效？","plain":"事务要经过正确的调用边界并符合回滚规则；写了注解，不代表任何调用方式都会生效。","answer":"常见代理模式下，本类直接自调用通常绕过事务代理；异常被捕获后没有按配置触发回滚，也可能不符合预期。默认常见回滚规则针对 RuntimeException 和 Error，其他异常可配置。事务上下文不会自动跨任意异步线程传播。","example":"当前事务尚未提交时启动异步查询，为什么可能读不到数据？","pitfall":"","follow":"afterCommit 改变了什么？为什么它不等于可靠消息投递？","priority":"基础必会"},{"id":"core-12","cat":"网络与 Linux","q":"SSE 与普通响应有什么区别？","plain":"普通响应等结果齐了再返回；SSE 可以边产生内容边通过 HTTP 持续推送事件。","answer":"SSE 让服务端在 HTTP 响应中持续发送事件。普通非流式接口通常等待完整结果后再返回。流式生命周期更长，需要处理事件边界、心跳或保活策略、断连、超时与终止。底层一次网络读取不保证就是一条完整事件。","example":"SseEmitter 已返回时，模型调用是否已经结束？","pitfall":"SSE 不等同于 WebSocket，二者交互方式和协议机制不同。","follow":"用自己的话解释，并找到一个最小例子。","priority":"基础必会"},{"id":"core-13","cat":"网络与 Linux","q":"connect、read、首段超时与总体 deadline 怎样区分？","plain":"连不上、连上后等不到数据、迟迟没有第一段输出、整次调用太久，是不同的超时问题。","answer":"建连超时约束建立连接；读取超时通常约束某次读取等待或读取空闲，具体语义看客户端实现；首段超时约束多久见到第一段有效输出；总体 deadline 限制端到端总预算。任务持续零星返回数据时，仍可能超过总预算。","example":"多个分支或多次重试怎样共享剩余预算？","pitfall":"","follow":"超时了，能不能断言远端没执行？不能。","priority":"基础必会"},{"id":"core-14","cat":"网络与 Linux","q":"限流、并发限制、负载均衡和熔断分别是什么？","plain":"限流管一段时间来多少，并发限制管同时做多少，负载均衡管交给谁，熔断管故障时先别继续打。","answer":"限流控制一段时间内接收的量；并发限制控制同时进行的任务数；负载均衡分配流量；熔断根据故障状态临时减少或停止访问某依赖，并通过受控探测判断恢复。它们解决不同问题，不能互相替代。","example":"RPM／TPM、运行中流数量、Client 选择、健康过滤各属于哪一类？","pitfall":"记录健康指标不自动等于已经实现完整熔断和恢复策略。","follow":"用自己的话解释，并找到一个最小例子。","priority":"基础必会"},{"id":"core-15","cat":"网络与 Linux","q":"为什么需要幂等收尾与背压？","plain":"结束可能从多个方向同时发生，要保证只收尾一次；下游慢时也要约束上游继续堆数据。","answer":"正常结束、异常、超时、断连可能交错触发，幂等收尾避免重复释放、重复统计或重复写终态。背压是让生产速度受消费能力约束的一类机制；有界队列只是手段之一，还要定义满了怎么办、如何取消和传递异常。","example":"上游产出很快、下游发送很慢，队列会怎样变化？","pitfall":"","follow":"无限队列为什么可能把问题延后变成内存压力？","priority":"基础必会"},{"id":"core-16","cat":"AI 与工作流","q":"DAG、入度和拓扑排序是什么？","plain":"DAG 就是不能绕圈的有向任务图；任务要按依赖关系先后执行。","answer":"DAG 是有向无环图。入度是指向节点的边数。拓扑排序给出满足依赖先后关系的一种节点顺序；存在环时无法得到覆盖所有节点的普通拓扑序。可以使用入度递减等方法进行排序或判断环。","example":"工作流配置中的 nodes 和 edges 怎样形成前驱／后继关系？","pitfall":"","follow":"拓扑顺序正确，是否就自动解决并发执行和状态隔离？没有。","priority":"基础必会"},{"id":"core-17","cat":"AI 与工作流","q":"并行汇合怎样避免重复调度？","plain":"两个前驱同时完成时，要避免它们都认为应该启动同一个后继节点。","answer":"必须定义节点可执行条件，并让“确认依赖满足”和“确保只调度一次”的关键状态更新具备原子性或等价的正确同步。并行分支、条件跳过、失败的依赖语义可能不同，不能只机械等待所有原始前驱成功。","example":"B、C 同时完成时，D 怎样保证只执行一次？","pitfall":"","follow":"条件分支没有选中的前驱，为什么不能永远当成未完成？","priority":"基础必会"},{"id":"core-18","cat":"AI 与工作流","q":"工作流定义与运行状态为什么分开？","plain":"工作流定义是可复用的流程模板，运行状态是某一次请求自己的进度和数据。","answer":"工作流定义描述节点、边和配置，可以在适当不可变设计下被多次执行共享。运行状态属于某一次 run，包含输入、变量、节点状态、错误和任务句柄。混用共享可变状态会引起不同请求数据串扰。","example":"WorkflowRunner、WorkflowRunState、VariablePool 各是什么生命周期？","pitfall":"","follow":"配置热更新时，正在执行的请求使用哪一版？应明确快照或一致性规则。","priority":"基础必会"},{"id":"core-19","cat":"AI 与工作流","q":"工作流总体超时怎样实现？","plain":"整次请求只有一份时间预算，前面花掉的时间，后面不能再领一遍。","answer":"在入口确定总体预算或 deadline，执行／等待／重试前计算剩余时间，不能每一步重新领取完整预算。预算耗尽后更新终态、停止新增调度，并尝试取消未完成任务和关闭相关资源。收尾可能需要额外时间，不能承诺任意任务都能立刻终止。","example":"calculateWaitTimeout() 和 waitTask() 怎样配合？","pitfall":"","follow":"为什么“控制等待时间”与“终止计算、IO、远端副作用”是不同层面的事？","priority":"基础必会"},{"id":"core-20","cat":"AI 与工作流","q":"重试、幂等、持久化恢复有什么区别？","plain":"重试是再做一次，幂等是重复也不多产生业务效果，恢复是故障后还能接着处理。","answer":"重试是失败后再次尝试；幂等控制重复操作的业务效果；持久化恢复需要保存执行信息并在故障后重建进度。内存 Future 和状态表不能跨进程崩溃恢复，某个节点能重试也不代表整个流程能安全恢复。","example":"生成文本与发送付款指令，重试风险有什么不同？","pitfall":"","follow":"已执行成功但确认丢失时，怎样判断再次调用是否安全？","priority":"项目必会"},{"id":"core-21","cat":"AI 与工作流","q":"Agent 与工作流是什么关系？","plain":"工作流常按预定步骤走，Agent 可以根据模型返回决定下一步，两种方式可以结合。","answer":"工作流通常按预先定义的图组织任务；Agent 可以根据模型输出动态决定后续动作，例如选择工具和继续执行。两者能组合。是否称为 Agent 不重要，要说明决策、执行、状态、停止条件和错误处理机制。","example":"固定的 Start→LLM→End 与循环工具调用有什么行为差别？","pitfall":"调用一次模型并不自动具备动态规划或工具循环能力。","follow":"用自己的话解释，并找到一个最小例子。","priority":"项目必会"},{"id":"core-22","cat":"AI 与工作流","q":"工具调用是谁执行的？","plain":"模型提出调用工具，真正校验权限、检查参数、执行操作的是后端程序。","answer":"模型返回工具名、结构化参数和调用标识等信息，后端负责校验工具是否允许、参数是否有效、上下文是否有权限，再执行并回传对应结果。需要设置最大轮数、总预算、异常处理和副作用保护。","example":"查询订单状态工具被传入其他用户的订单号时，校验在哪里做？","pitfall":"","follow":"为什么模型输出格式正确，也不表示调用一定合法？","priority":"项目必会"},{"id":"core-23","cat":"AI 与工作流","q":"RAG 的基本链路是什么？","plain":"先从知识库找证据，再把证据交给模型回答，而不是只凭模型自己的记忆。","answer":"知识先经过整理、切分和索引；查询时做关键词或向量等召回，按规则过滤、融合或重排，将证据放入上下文交给模型生成回答。评估要拆开看检索是否找到证据和回答是否使用正确证据。","example":"KnowledgeNode、检索服务、SearchStrategy 分别负责哪一段？","pitfall":"","follow":"检索为空、证据过期、权限不匹配时怎样处理？","priority":"项目必会"},{"id":"core-24","cat":"AI 与工作流","q":"Embedding、混合召回、Rerank 有什么区别？","plain":"向量帮助找语义接近的内容，混合召回结合多种信号，重排则给已有候选重新排顺序。","answer":"Embedding 将对象映射为向量，用相似度支持语义匹配；混合召回结合不同检索信号；Rerank 对候选重新判断相关性并排序。不同检索分数可能量纲和分布不同，简单相加需要验证。Rerank 通常只改善已召回候选的排序，无法凭空找到完全没有进入候选的文档。","example":"混合检索的分数怎样融合，是否有评测依据？","pitfall":"不把向量相似度等同于答案正确率。","follow":"用自己的话解释，并找到一个最小例子。","priority":"项目必会"},{"id":"core-25","cat":"MySQL","q":"MySQL 联合索引为什么要考虑列顺序？","plain":"联合索引像按多个字段顺序整理的目录，能不能用好，取决于你怎么查询。","answer":"联合索引按定义列的顺序组织，能否有效利用与查询条件、范围、排序、选择性和优化器判断有关。左前缀是重要原则，但不能脱离具体查询断言索引必定生效或一定最快。用 EXPLAIN 和实际数据验证。","example":"business、workflow_id、created_at 的最近执行记录查询怎样设计？","pitfall":"","follow":"回表、覆盖索引、索引维护代价分别是什么？","priority":"项目必会"},{"id":"core-26","cat":"MySQL","q":"事务隔离与 MVCC 先记什么？","plain":"并发事务能看到哪些数据，既看隔离级别，也看读法和其他事务的提交时机。","answer":"事务隔离控制并发事务之间的可见性和相互影响。InnoDB 的多版本机制参与一致性读，但快照可见规则随隔离级别和读类型而变；锁定读、更新等不能简单按普通快照读理解。事务能否看到数据要看提交时机和读语义。","example":"主事务写入后，另一个线程的独立事务为什么可能读不到？","pitfall":"不要用“有 MVCC，所以所有读取都不加锁”概括。","follow":"用自己的话解释，并找到一个最小例子。","priority":"项目必会"},{"id":"core-27","cat":"Redis","q":"缓存穿透、击穿、雪崩是什么？","plain":"不存在的数据不停查是穿透；热门缓存失效后一起查是击穿；大量缓存集中出问题是雪崩。","answer":"穿透常指不存在数据的请求持续回源；击穿常指热点失效后大量请求同时回源；雪崩常指大量缓存集中失效或缓存服务故障引发广泛回源压力。空值缓存、请求合并、过期抖动和降级等分别应对不同问题，仍要考虑时效和失败。","example":"模型配置热点 key 过期后，多个网关实例会怎样访问配置源？","pitfall":"","follow":"更新数据库后删除缓存失败，系统如何恢复？","priority":"项目必会"},{"id":"core-28","cat":"分布式与消息","q":"Kafka 为什么还要考虑重复消费？","plain":"消息处理完但还没确认进度就崩溃，重启后可能再次处理同一条消息。","answer":"业务处理成功与消费进度提交之间可能发生故障，重启后消息再次被读取。提交策略、生产配置等也影响交付语义。消费端应根据业务副作用设计幂等和一致性；Kafka 事务不能自动让任意外部 HTTP 或数据库操作恰好执行一次。","example":"日志重复写入与重复扣费，影响为什么不同？","pitfall":"","follow":"分区内有序是否表示全 Topic 全局有序？不是。","priority":"项目必会"},{"id":"core-29","cat":"分布式与消息","q":"配置热更新怎样避免半更新状态？","plain":"先完整准备好新版配置，再切换给请求使用，避免一半新、一半旧。","answer":"先构建并验证一份完整新配置，再按设计切换可见引用，可以减少读到半成品的问题；配置快照应避免随后被无控制修改。旧 Client 的关闭还要考虑在途请求，不能切换后立即粗暴销毁所有资源。","example":"路由表、模型配置、Client 池是否一起更新？失败时如何保留旧版本？","pitfall":"","follow":"仅把引用声明为 volatile，为什么不足以说明整个热更新流程正确？","priority":"项目必会"},{"id":"core-30","cat":"分布式与消息","q":"线上排障先看哪些证据？","plain":"先弄清哪里、何时、影响多少，再结合日志、指标和调用关系找证据。","answer":"先明确现象、时间、影响范围和近期变更，再结合请求量、错误率、延迟、运行中任务、队列、线程、连接等证据定位。日志用关联 ID 串起链路。提出可验证假设，比较修复前后同一场景，区分相关性和因果。","example":"首段慢、上游慢、队列堵、客户端不消费分别看什么？","pitfall":"","follow":"为什么平均耗时正常仍可能有严重长尾？","priority":"项目必会"},{"cat":"Java 基础","q":"JDK、JRE、JVM 分别是什么？","plain":"JVM 负责运行字节码，JRE 是运行环境的概念，JDK 还包含开发工具。","answer":"Java 源码通常经 javac 编译为字节码，再由 JVM 执行。JDK 提供编译、运行和诊断等工具。现代 JDK 的发行与运行时打包方式不应照搬老版本目录结构。","example":"写 Hello.java，经编译得到 class，再运行。","pitfall":"不要把 JVM 说成 Java 编译器，也不要认为每个现代 JDK 都有独立 jre 目录。","follow":"为什么同一份 class 能在不同系统运行？","priority":"基础必会","id":"base-001"},{"cat":"Java 基础","q":"== 与 equals 有什么区别？","plain":"一个先看值或身份，一个按类型定义的规则判断相等。","answer":"基本类型的 == 比较对应的值；引用类型的 == 比较是否指向同一对象。equals 是方法，Object 的默认实现按身份比较，String 等类型会重写为内容比较。","example":"new String(\"a\") 与另一个 new String(\"a\")：== 通常为 false，equals 为 true。","pitfall":"不要说所有对象的 equals 都比较内容。","follow":"自定义模型配置对象怎样定义相等？","priority":"基础必会","id":"base-002"},{"cat":"Java 基础","q":"String 为什么不可变？","plain":"字符串创建后，其内容不能通过公开操作直接修改。","answer":"不可变设计便于共享、缓存哈希和作为稳定键，也有助于降低被意外修改的风险。变量重新赋值是指向新字符串，并非改变原对象。","example":"String s=\"a\"; s=s+\"b\"; 变量指向新的结果。","pitfall":"不可变对象不代表保存它的变量不能改变。","follow":"循环拼接大量文本为什么可以考虑 StringBuilder？","priority":"基础必会","id":"base-003"},{"cat":"Java 基础","q":"StringBuilder 与 StringBuffer 怎么选？","plain":"都可拼接，是否共享使用是关键。","answer":"StringBuilder 不提供并发修改安全，适合局部构建文本；StringBuffer 的相关操作有同步，但多步业务操作仍需整体考虑。默认先避免共享可变构建器。","example":"每个请求在局部方法中组装自己的 Prompt。","pitfall":"不要为了线程安全把所有字符串操作都换成 StringBuffer。","follow":"如果构建器存在单例 Bean 的字段里会怎样？","priority":"基础必会","id":"base-004"},{"cat":"Java 基础","q":"重载与重写有什么区别？","plain":"重载是同名不同参数；重写是子类替换继承来的实现。","answer":"重载选择基于编译期可见类型和参数等规则；实例方法重写支持运行时多态。返回类型不同本身不足以构成重载。","example":"chat(String) 与 chat(Request) 是重载；厂商类实现父类 request() 是重写。","pitfall":"静态方法隐藏与实例方法重写不能混为一谈。","follow":"父类引用指向子类时，哪个 request() 会运行？","priority":"基础必会","id":"base-005"},{"cat":"Java 基础","q":"受检异常和运行时异常怎么区分？","plain":"有些异常需要显式处理或声明，有些不受这个编译检查。","answer":"RuntimeException 及其子类属于运行时异常；Exception 中除运行时异常外的常见异常受检查。处理策略仍要按业务可恢复性判断，不能只依赖类别。","example":"网络失败转换成业务错误时保留原始 cause。","pitfall":"catch(Exception) 后只打印日志可能把失败伪装成成功。","follow":"finally 再抛异常会有什么影响？","priority":"基础必会","id":"base-006"},{"cat":"Java 基础","q":"try-with-resources 解决什么问题？","plain":"确保可关闭资源在代码块退出时被关闭。","answer":"实现 AutoCloseable 的资源可放进 try 资源声明，正常或异常离开时会执行关闭。关闭也可能失败，应理解原异常与 suppressed 异常的关系。","example":"读取本地文件后自动关闭流。","pitfall":"资源自动关闭不等于远端副作用自动回滚。","follow":"流式模型 Client 的响应体谁负责关闭？","priority":"基础必会","id":"base-007"},{"cat":"Java 基础","q":"泛型擦除是什么？","plain":"很多泛型类型信息主要用于编译期检查，运行时不按每种类型生成一份类。","answer":"Java 泛型通常通过擦除实现，类型参数在字节码层面转换为边界等形式并插入转换。运行时反射能保留部分声明信息，但不能把所有具体类型都当成可直接获得。","example":"List\u003cString> 与 List\u003cInteger> 通常共享同一个运行时类。","pitfall":"不能简单用 instanceof List\u003cString> 判断每个元素类型。","follow":"为什么不能直接 new T()？","priority":"进阶再学","id":"base-008"},{"cat":"Java 基础","q":"浅拷贝与深拷贝有什么区别？","plain":"浅拷贝可能让新旧对象继续共享内部对象。","answer":"浅拷贝复制字段值，引用字段仍指向同一内部对象；深拷贝需要按定义复制嵌套可变结构，范围与循环引用都要考虑。不可变对象可以按设计共享。","example":"复制配置 List 后修改其中一个 Provider，可能影响旧配置。","pitfall":"复制外层 Map 不代表所有内部对象都隔离。","follow":"请求状态里哪些字段必须独立？","priority":"基础必会","id":"base-009"},{"cat":"集合","q":"List、Set、Map 各解决什么问题？","plain":"List 管顺序集合，Set 管去重，Map 管键到值映射。","answer":"List 通常允许重复并提供位置语义；Set 按相等规则保证元素不重复；Map 为键关联值。是否有序、是否允许 null 和线程安全取决于具体实现。","example":"节点顺序用 List，依赖去重用 Set，nodeId 查节点用 Map。","pitfall":"不能说所有 Set 都无序或所有 Map 都允许 null。","follow":"用对象做 Set 元素时要注意什么？","priority":"基础必会","id":"base-010"},{"cat":"集合","q":"ArrayList 与 LinkedList 怎么选？","plain":"连续数组擅长按位置访问，链表要考虑遍历和节点定位。","answer":"ArrayList 基于可扩展数组，随机访问通常 O(1)，中间插删常需搬移。LinkedList 访问指定位置需遍历；只有已定位节点附近的链接调整才便宜。实际还要看缓存局部性和对象开销。","example":"按下标读一批节点配置，通常优先 ArrayList。","pitfall":"不要笼统说链表插入删除一定更快。","follow":"LinkedList 按下标循环为什么可能很慢？","priority":"基础必会","id":"base-011"},{"cat":"集合","q":"HashMap 为什么通常查得快？","plain":"先用哈希缩小范围，再比较键。","answer":"HashMap 使用桶数组并处理冲突。良好分布时查找期望开销较低；冲突、扩容和键的 equals 成本都会影响表现。Java 8 之后常见实现还有链表树化机制。","example":"business 查路由表，通常不用遍历全部业务。","pitfall":"不要承诺任何输入下都是严格 O(1)。","follow":"哈希相同但 equals 不同的键能共存吗？","priority":"基础必会","id":"base-012"},{"cat":"集合","q":"HashMap 扩容和负载因子是什么？","plain":"元素变多后需要更多桶，减少拥挤。","answer":"负载因子参与计算扩容阈值。扩容会分配更大结构并重新分配条目，存在成本。已知大致元素量可以合理预估初始容量，但不应无脑设很大。","example":"初始化几千个模型配置时估计容量。","pitfall":"容量、实际条目数、扩容阈值不是同一个数。","follow":"为什么频繁更新共享 HashMap 需要并发设计？","priority":"基础必会","id":"base-013"},{"cat":"集合","q":"HashMap 什么时候树化？","plain":"树化是碰撞较多时的一种优化，还受容量条件影响。","answer":"常见 OpenJDK 8+ 实现中，树化阈值常提到 8，最小表容量 64，退化阈值常提到 6；具体触发还取决于插入或拆分路径，不是第 8 个元素一定立刻树化。容量不足时倾向先扩容。","example":"多个不同 key 哈希落到同一个桶。","pitfall":"先讲原因和条件，再讲常见常量；不要把实现细节当所有 Map 的契约。","follow":"容量不足为什么可能选择扩容？","priority":"进阶再学","id":"base-014"},{"cat":"集合","q":"为什么并发容器不一定得到整体快照？","plain":"每次读取安全，不代表多次读取看到同一个瞬间。","answer":"并发更新过程中，遍历、size 和多 key 读取可能反映不同时间的状态。如果业务需要一份一致配置，应设计不可变快照、锁或版本机制。","example":"先读模型路由，再读 Client 池，可能跨越一次配置更新。","pitfall":"不抛 ConcurrentModificationException 不等于强一致快照。","follow":"配置版本怎么与请求绑定？","priority":"基础必会","id":"base-015"},{"cat":"集合","q":"Iterator 的 fail-fast 是什么？","plain":"一些迭代器会尽早报告意外结构修改。","answer":"普通集合的 fail-fast 常是尽力检查，帮助发现错误，不是并发正确性保证。遍历期间修改需遵守迭代器契约或选择合适策略。","example":"foreach 中直接从原 ArrayList 删除元素可能报错。","pitfall":"不要用是否抛异常判断程序是否线程安全。","follow":"Iterator.remove 与直接 list.remove 有什么区别？","priority":"基础必会","id":"base-016"},{"cat":"集合","q":"BlockingQueue 的四种操作风格是什么？","plain":"满或空时，可以报错、返回结果、一直等或限时等。","answer":"add/remove 常用异常表达失败；offer/poll 立即返回特殊结果；put/take 可阻塞；带超时的 offer/poll 限时等待。选择时要配合终止、取消和队列容量。","example":"流消费者用 poll(timeout) 后检查结束状态。","pitfall":"无超时阻塞可能让终止逻辑无法及时推进。","follow":"上游异常时如何唤醒正在等待的消费者？","priority":"基础必会","id":"base-017"},{"cat":"并发","q":"线程和进程有什么区别？","plain":"进程是资源隔离单位，线程是执行流。","answer":"同进程线程共享堆等资源，各自有执行栈等状态，通信方便但要同步。进程间通常隔离地址空间，通信要借助 IPC 或网络等机制。实现和操作系统细节各有差异。","example":"一个网关进程里多个线程共享 Client 池。","pitfall":"不要认为线程之间天然不会互相影响。","follow":"一个线程泄漏会怎样拖垮服务？","priority":"基础必会","id":"base-018"},{"cat":"并发","q":"sleep、wait、park 有什么区别？","plain":"暂停的条件、锁和唤醒方式不同。"
